# Renovate bumps the date of the cks QEMU image tag in every qemu config.yaml
# (customManagers in renovate.json) but cannot compute the per-architecture
# checksums that astrona verifies. This workflow reads them from the registry,
# commits them to the Renovate branch and starts the labs workflow for the new
# commit: a push made with GITHUB_TOKEN starts no pull_request run, but a
# workflow_dispatch does.
#
# On every other pull request it only checks that the checksums match the
# registry, so a hand-edited tag with stale checksums fails early.
name: qemu-image-checksums

on:
  pull_request:
    paths:
      - "sections/**/config.yaml"
      - "scripts/ci/qemu-image-checksums.py"
      - ".github/workflows/qemu-image-checksums.yml"

permissions:
  contents: read

concurrency:
  group: qemu-image-checksums-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the QEMU image checksums
        run: python3 scripts/ci/qemu-image-checksums.py --check

  refresh:
    # Only Renovate branches in this repository; a fork cannot get write access.
    if: ${{ startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Write the checksums of the new image tag
        run: python3 scripts/ci/qemu-image-checksums.py
      - name: Commit them and test the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Checksums already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(qemu): refresh cks image checksums"
          git push origin "HEAD:$BRANCH"
          gh workflow run labs.yml --ref "$BRANCH" -f paths="sections/section-020"
