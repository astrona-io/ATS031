- id: section-030
  title: Properly set up Ingress with TLS
  curriculum_item: Properly set up Ingress with TLS
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Set Up Ingress With TLS
    objectives:
    - Explain the roles of the Ingress object, the IngressClass and the Ingress controller.
    - Write Ingress rules with host, path, `pathType` and a backend Service port.
    - Create a `kubernetes.io/tls` Secret from a certificate and a key, and check
      that the two match.
    - Configure `spec.tls` in an Ingress and explain which certificate a client receives
      for a given host name.
    - Test with `curl` and `openssl s_client` that the certificate is trusted for
      the matching name and rejected for another name.
    outline:
    - 'Ingress Routing: Controller, Class, Host And Path'
    - Certificates And The TLS Secret
    - Configure An Ingress With TLS And Verify It
    - Several Hosts, Server Name Selection And Troubleshooting
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-ingress-routing-controller-class-host-path.md
      adapted_from: 
    - reading: sections/section-030/module-01/course-02-certificates-and-the-tls-secret.md
      adapted_from: 
    - reading: sections/section-030/module-01/course-03-configure-and-verify-a-tls-ingress.md
      adapted_from: 
    - reading: sections/section-030/module-01/course-04-several-hosts-sni-and-troubleshooting.md
      adapted_from: 
    labs:
    - id: lab-01
      path: sections/section-030/module-01/labs/lab-01
      after_reading: sections/section-030/module-01/course-03-configure-and-verify-a-tls-ingress.md
      objective: Route HTTPS through the controller and verify both matching and mismatched
        certificate identities.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-030/module-01/course-01-ingress-routing-controller-class-host-path.md
    - sections/section-030/module-01/course-02-certificates-and-the-tls-secret.md
    - sections/section-030/module-01/course-03-configure-and-verify-a-tls-ingress.md
    - sections/section-030/module-01/course-04-several-hosts-sni-and-troubleshooting.md
    quiz: sections/section-030/module-01/quiz.yaml
  - id: module-02
    title: Run Traefik On kind
    objectives: []
    outline:
    - Ingress Controller Architecture With Traefik
    - Read The Traefik Installation On kind
    - First Ingress And Host Header Testing
    - Path Types And Priority
    - Several Services And A Default Backend
    - Inspect The Running Controller
  - id: module-03
    title: Build TLS With openssl For Traefik
    objectives: []
    outline:
    - Certificate Fundamentals Needed For The Exam
    - Self-Signed Certificate With openssl
    - Sign A Server Certificate With Your Own CA
    - Create The TLS Secret
    - Configure spec.tls And Verify
    - HTTPS Redirect, HSTS And The Default Certificate
  - id: module-04
    title: Harden And Troubleshoot Traefik TLS
    objectives: []
    outline:
    - TLS Versions, Ciphers And Server Names
    - Mutual TLS With Client Certificates
    - Shrink The Controller Attack Surface
    - Rotate And Replace Certificates
    - Troubleshoot TLS Ingress Failures
- id: section-040
  title: Protect node metadata and endpoints
  curriculum_item: Protect node metadata and endpoints
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Protect Node Metadata And Management Endpoints
    objectives:
    - 'Name the node-local endpoints that carry authority: the cloud metadata service,
      the kubelet API and the container runtime socket.'
    - Explain why the identity of a node differs from the identity of a workload,
      and why RBAC does not cover a metadata service.
    - Read the kubelet authentication and authorization settings from a running node,
      and find pods that mount host paths or use the host network.
    - Show with requests from two namespaces that a pod can reach a metadata-style
      endpoint, and restrict it with an egress allow-list.
    - Explain what a NetworkPolicy does not cover, and name provider-specific protections
      that complement it.
    outline:
    - Endpoints That Carry Authority
    - Network Paths To A Metadata-Style Endpoint
    - Restrict The Pod And Verify The Boundary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-endpoints-that-carry-authority.md
      adapted_from: 
    - reading: sections/section-040/module-01/course-02-network-paths-to-a-metadata-style-endpoint.md
      adapted_from: 
    - reading: sections/section-040/module-01/course-03-restrict-the-pod-and-verify-the-boundary.md
      adapted_from: 
    labs:
    - id: lab-01
      path: sections/section-040/module-01/labs/lab-01
      after_reading: sections/section-040/module-01/course-03-restrict-the-pod-and-verify-the-boundary.md
      objective: Separate permitted application dependencies from a metadata-style
        endpoint in the private network.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-040/module-01/course-01-endpoints-that-carry-authority.md
    - sections/section-040/module-01/course-02-network-paths-to-a-metadata-style-endpoint.md
    - sections/section-040/module-01/course-03-restrict-the-pod-and-verify-the-boundary.md
    quiz: sections/section-040/module-01/quiz.yaml
  - id: module-02
    title: Block The Cloud Metadata Endpoint
    objectives: []
    outline:
    - What The Metadata Service Hands Out
    - The Playground Metadata Server
    - Block With An ipBlock Except Rule
    - Default Deny Plus A Selective Allow
    - Policy Pitfalls For The Metadata Address
    - Verify Coverage Across Namespaces
  - id: module-03
    title: Protect Node Endpoints And The Runtime
    objectives: []
    outline:
    - The Kubelet API From A Pod
    - Restrict Reachability To Node Ports
    - Node Identity And NodeRestriction
    - Runtime Socket And hostPath Exposure
    - hostNetwork And Privileged Pods Bypass Policy
    - Controls Outside The Cluster
- id: section-050
  title: Verify platform binaries before deploying
  curriculum_item: Verify platform binaries before deploying
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Verify Platform Binaries Before Deploying
    objectives:
    - Explain what a checksum proves, what it does not prove, and why the source of
      the expected digest decides its value.
    - Choose the exact artifact by version, operating system and architecture, and
      record its digest.
    - Verify a signature over a checksum manifest with a public key, and check the
      binary against the authenticated manifest.
    - Show that a forged checksum file matches a tampered binary, and that signature
      verification rejects the forgery.
    - Keep the verified bytes bound to what is deployed, and explain what verification
      does not cover.
    outline:
    - Integrity, Authenticity And The Exact Artifact
    - Digests At Work And The Limits Of A Checksum
    - Verify A Signed Manifest And Record The Result
    - Keep The Binding Through Delivery, And Identity-Based Signatures
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-050/module-01/course-01-integrity-authenticity-and-the-exact-artifact.md
      adapted_from: 
    - reading: sections/section-050/module-01/course-02-digests-at-work-and-the-limits-of-a-checksum.md
      adapted_from: 
    - reading: sections/section-050/module-01/course-03-verify-a-signed-manifest-and-record-the-result.md
      adapted_from: 
    - reading: sections/section-050/module-01/course-04-keep-the-binding-through-delivery.md
      adapted_from: 
    labs:
    - id: lab-01
      path: sections/section-050/module-01/labs/lab-01
      after_reading: sections/section-050/module-01/course-03-verify-a-signed-manifest-and-record-the-result.md
      objective: Verify a signed checksum manifest and reject altered bytes before
        using a binary.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-050/module-01/course-02-digests-at-work-and-the-limits-of-a-checksum.md
    - sections/section-050/module-01/course-03-verify-a-signed-manifest-and-record-the-result.md
    - sections/section-050/module-01/course-04-keep-the-binding-through-delivery.md
    quiz: sections/section-050/module-01/quiz.yaml
  - id: module-02
    title: Verify Kubernetes Release Binaries Hands-On
    objectives: []
    outline:
    - Kubernetes Release Artifacts
    - sha256sum And The Check Format
