- id: section-040
  title: Protect node metadata and endpoints
  curriculum_item: Protect node metadata and endpoints
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Protect Node Metadata And Management Endpoints
    objectives:
    - 'Name the node-local endpoints that carry authority: the cloud metadata service, the kubelet API and the container runtime socket.'
    - Explain why the identity of a node differs from the identity of a workload, and why RBAC does not cover a metadata service.
    - Read the kubelet authentication and authorization settings from a running node, and find pods that mount host paths or use the host network.
    - Show with requests from two namespaces that a pod can reach a metadata-style endpoint, and restrict it with an egress allow-list.
    - Explain what a NetworkPolicy does not cover, and name provider-specific protections that complement it.
    outline:
    - Endpoints That Carry Authority
    - Network Paths To A Metadata-Style Endpoint
    - Restrict The Pod And Verify The Boundary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-endpoints-that-carry-authority.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-02-network-paths-to-a-metadata-style-endpoint.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-03-restrict-the-pod-and-verify-the-boundary.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-01/labs/lab-01
      after_reading: sections/section-040/module-01/course-03-restrict-the-pod-and-verify-the-boundary.md
      objective: Separate permitted application dependencies from a metadata-style endpoint in the private network.
      status: draft
      runtime_verification: pending
    practice_readings:
