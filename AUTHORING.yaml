- id: section-030
  title: Properly set up Ingress with TLS
  curriculum_item: Properly set up Ingress with TLS
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Ingress Routing And TLS Contracts
    objectives:
    - Identify IngressClass and controller responsibility.
    - Compare exact, prefix and implementation-specific paths.
    - Trace host and Service port matching.
    - Explain TLS termination and backend protocol limits.
    - Explain public keys, private keys and certificate authority trust.
    - Distinguish server authentication from mutual TLS.
    - Relate identity names, validity and trust chains to verification.
    - Describe rotation and compromise recovery for certificate-based identities.
    outline:
    - Matching Ingress Hosts, Paths And Service Backends
    - PKI Trust And Certificate Verification
    playground: false
    module_lab: false
    sources:
    - reading: sections/section-030/module-01/course-01-matching-ingress-hosts-paths-and-service-backends.md
      adapted_from: ATS030/sections/section-030/module-01/course-01-matching-ingress-hosts-paths-and-service-backends.md
    - reading: sections/section-030/module-01/course-02-pki-trust-and-certificate-verification.md
      adapted_from: ATS045/sections/section-050/module-01/course-01-pki-trust-and-certificate-verification.md
- id: section-040
  title: Protect node metadata and endpoints
  curriculum_item: Protect node metadata and endpoints
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Protecting Node Metadata And Management Endpoints
    objectives:
    - Identify credentials and authority exposed through node-local endpoints.
    - Separate workload network paths from host and control-plane paths.
    - Explain cloud metadata protections and their implementation limits.
    - Evaluate endpoint authentication, authorization and least privilege together.
    outline:
    - Protecting Node Metadata And Management Endpoints
    playground: false
    module_lab: false
    sources:
    - reading: sections/section-040/module-01/course-01-protecting-node-metadata-and-management-endpoints.md
      adapted_from: null
- id: section-050
  title: Verify platform binaries before deploying
  curriculum_item: Verify platform binaries before deploying
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Verifying Release Artifacts Before Deployment
    objectives:
    - Distinguish integrity checks from publisher authenticity.
    - Bind verification evidence to an exact release and architecture.
    - Explain authenticated checksum and signature trust chains.
    - Preserve verified bytes through storage and deployment.
    outline:
    - Verifying Release Artifacts Before Deployment
