    - Data Directory Ownership And Permissions
    - Query etcd With etcdctl
    - Encryption At Rest Check
  - id: module-05
    title: Harden The kubelet And CoreDNS, Then Remediate End To End
    objectives: []
    outline:
    - Kubelet Configuration Sources
