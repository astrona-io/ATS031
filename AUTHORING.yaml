version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13,
  superseding the earlier reading-only scope.
course:
  id: ATS031
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Cluster Setup
    weight: 15
    competencies:
    - Use Network security policies to restrict cluster level access
    - Use CIS benchmark to review the security configuration of Kubernetes components
      (etcd, kubelet, kubedns, kubeapi)
    - Properly set up Ingress with TLS
    - Protect node metadata and endpoints
    - Verify platform binaries before deploying
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: false
  final_quiz: true
assessment_format: YAML question banks v1, registered in assessments/index.yaml
sections:
- id: section-010
  title: Use Network security policies to restrict cluster level access
  curriculum_item: Use Network security policies to restrict cluster level access
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Restrict Pod Traffic With NetworkPolicy
    objectives:
    - Explain which pods a policy isolates, in which direction, and how several policies
      combine.
    - Write an ingress policy that allows one labelled peer and denies all others,
      including a peer in another namespace.
    - Write an egress policy that allows DNS and one application dependency and blocks
      everything else.
    - Explain why `namespaceSelector` and `podSelector` in one peer entry differ from
      two separate peer entries.
    - Test a policy with an allowed request and a denied request, and tell a timeout
      from a refused connection.
    outline:
    - How NetworkPolicy Isolation Works
    - Allow One Peer With An Ingress Policy
    - Restrict Egress And Allow DNS
    - Default Deny And Troubleshooting Policies
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-isolation-and-evaluation-rules.md
      adapted_from: 
    - reading: sections/section-010/module-01/course-02-ingress-policy-allow-one-peer.md
      adapted_from: 
    - reading: sections/section-010/module-01/course-03-egress-policy-dns-and-dependencies.md
      adapted_from: 
    - reading: sections/section-010/module-01/course-04-default-deny-and-troubleshooting.md
      adapted_from: 
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-02-ingress-policy-allow-one-peer.md
      objective: Enforce both an allowed same-namespace peer and a denied peer in
        another namespace.
      status: alpha
      runtime_verification: pending
    - id: lab-02
      path: sections/section-010/module-01/labs/lab-02
      after_reading: sections/section-010/module-01/course-03-egress-policy-dns-and-dependencies.md
      objective: Allow name resolution and application access while denying a healthy
        unrelated listener.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-010/module-01/course-01-isolation-and-evaluation-rules.md
    - sections/section-010/module-01/course-02-ingress-policy-allow-one-peer.md
    - sections/section-010/module-01/course-03-egress-policy-dns-and-dependencies.md
    - sections/section-010/module-01/course-04-default-deny-and-troubleshooting.md
    quiz: sections/section-010/module-01/quiz.yaml
  - id: module-02
    title: Build Default-Deny Baselines For Namespaces
    objectives: []
    outline:
    - Why A Baseline Comes First
    - Deny All Ingress
    - Deny All Egress And Its Side Effects
    - Combine Baselines With Allow Rules
    - Baselines Across Many Namespaces
  - id: module-03
    title: Select Peers And Ports Precisely
    objectives: []
    outline:
    - Selectors Recap And The Namespace Name Label
    - Cross-Namespace Ingress
    - One Entry Versus Two Entries
    - ipBlock And Except
    - Ports, Protocols And endPort
    - Policies On Services And Replicas
  - id: module-04
    title: Policy For Real Cluster Traffic And Troubleshooting
    objectives: []
    outline:
    - DNS And CoreDNS Egress
    - Egress To The API Server And Other Dependencies
    - Probes, hostNetwork And Node Traffic
    - Test Matrix For A Policy Set
    - Audit And Troubleshoot Policies
- id: section-020
  title: Use CIS benchmark to review the security configuration of Kubernetes components
    (etcd, kubelet, kubedns, kubeapi)
  curriculum_item: Use CIS benchmark to review the security configuration of Kubernetes
    components (etcd, kubelet, kubedns, kubeapi)
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Review Kubernetes Components With The CIS Benchmark
    objectives:
    - Explain how the CIS benchmark is organised and which component each section
      covers.
    - Find the manifests, configuration files and certificates of a kubeadm cluster
      on a node.
    - Read a `kube-bench` check (its audit, test and remediation) and run the same
      audit by hand.
    - Review the effective kubelet configuration and the permissions of its files.
    - Correct an API server flag in the static pod manifest, wait for the API server
      to return, and verify the new value.
    outline:
    - The Benchmark And Where The Settings Live
    - 'Read A Check: kube-bench And The Manual Audit'
    - 'Review The Kubelet: Effective Configuration And File Permissions'
    - Correct A Finding Safely And Record It
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-benchmark-structure-and-file-layout.md
      adapted_from: 
    - reading: sections/section-020/module-01/course-02-reading-checks-and-auditing-the-control-plane.md
      adapted_from: 
    - reading: sections/section-020/module-01/course-03-reviewing-the-kubelet.md
      adapted_from: 
    - reading: sections/section-020/module-01/course-04-correcting-a-finding-and-recording-it.md
      adapted_from: 
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-04-correcting-a-finding-and-recording-it.md
      objective: Review and correct one effective control-plane setting while keeping
        API access available.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-020/module-01/course-01-benchmark-structure-and-file-layout.md
    - sections/section-020/module-01/course-02-reading-checks-and-auditing-the-control-plane.md
    - sections/section-020/module-01/course-03-reviewing-the-kubelet.md
    - sections/section-020/module-01/course-04-correcting-a-finding-and-recording-it.md
    quiz: sections/section-020/module-01/quiz.yaml
  - id: module-02
    title: Run kube-bench And Read Its Output
    objectives: []
    outline:
    - What kube-bench Does Under The Hood
    - Run kube-bench On A kind Node
    - Targets, Benchmarks And Versions
    - Read A Result
    - Select Checks And Export Results
    - Manual Checks And False Findings
  - id: module-03
    title: Harden The API Server And Control Plane Components
    objectives: []
