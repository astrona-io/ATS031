- id: section-020
  title: Use CIS benchmark to review the security configuration of Kubernetes components (etcd, kubelet,
    kubedns, kubeapi)
  curriculum_item: Use CIS benchmark to review the security configuration of Kubernetes components (etcd,
    kubelet, kubedns, kubeapi)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Reviewing A Cluster Against A Security Benchmark
    objectives:
    - Select a benchmark matching component versions and deployment ownership.
    - Distinguish automated findings from manual security judgment.
    - Trace a failed recommendation to effective configuration.
    - Plan a scoped correction with availability and exception evidence.
    outline:
    - Reviewing A Cluster Against A Security Benchmark
    playground: false
    module_lab: false
