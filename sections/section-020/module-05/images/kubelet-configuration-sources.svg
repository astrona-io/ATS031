<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Where the kubelet gets its settings</title>
  <desc id="desc">The kubelet merges four sources: the configuration file /var/lib/kubelet/config.yaml, command-line flags from kubeadm-flags.env and /etc/default/kubelet, fragments from --config-dir, and compiled defaults. Flags and fragments override the file. The kubelet process runs with the merged settings, and the configz endpoint reports them.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <text class="label" x="30" y="26">Sources</text>

  <path class="line" d="M360 68 L448 166" marker-end="url(#arrow)"/>
  <path class="line" d="M360 148 L448 182" marker-end="url(#arrow)"/>
  <path class="line" d="M360 228 L448 198" marker-end="url(#arrow)"/>
  <path class="line" d="M360 308 L448 214" marker-end="url(#arrow)"/>
  <path class="line" d="M590 190 H638" marker-end="url(#arrow)"/>
  <path class="line" d="M725 218 V268" marker-end="url(#arrow)"/>

  <rect class="box" x="30" y="40" width="330" height="56" rx="8"/>
  <text class="code" x="195" y="63" text-anchor="middle">/var/lib/kubelet/config.yaml</text>
  <text x="195" y="84" text-anchor="middle">Configuration file, named by <tspan class="code">--config</tspan></text>

  <rect class="ask" x="30" y="120" width="330" height="56" rx="8"/>
  <text x="195" y="143" text-anchor="middle">Command-line flags, override the file</text>
  <text class="code" x="195" y="164" text-anchor="middle">kubeadm-flags.env  /etc/default/kubelet</text>

  <rect class="ask" x="30" y="200" width="330" height="56" rx="8"/>
  <text x="195" y="223" text-anchor="middle">Fragments from <tspan class="code">--config-dir</tspan></text>
  <text x="195" y="244" text-anchor="middle">override the main file</text>

  <rect class="box" x="30" y="280" width="330" height="56" rx="8"/>
  <text x="195" y="303" text-anchor="middle">Compiled defaults</text>
  <text x="195" y="324" text-anchor="middle">fill every field no other source sets</text>

  <rect class="box" x="450" y="150" width="140" height="80" rx="8"/>
  <text class="strong" x="520" y="186" text-anchor="middle">Merged</text>
  <text class="strong" x="520" y="206" text-anchor="middle">settings</text>

  <rect class="ok" x="640" y="162" width="170" height="56" rx="8"/>
  <text x="725" y="185" text-anchor="middle">kubelet process</text>
  <text class="code" x="725" y="206" text-anchor="middle">/usr/bin/kubelet</text>

  <rect class="ask" x="640" y="270" width="170" height="56" rx="8"/>
  <text class="code" x="725" y="293" text-anchor="middle">/proxy/configz</text>
  <text x="725" y="314" text-anchor="middle">reports the result</text>
</svg>
