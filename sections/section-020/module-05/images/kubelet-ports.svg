<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">The three ports of the kubelet</title>
  <desc id="desc">Port 10250 is the HTTPS API that checks credentials and RBAC; the API server connects to it with a client certificate. Port 10255 is the read-only port that serves plain HTTP without authentication, so the shuttle pod can read the pod list until readOnlyPort: 0 closes it. Port 10248 is a health check on the loopback address only.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="okline" d="M220 78 H298" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M220 168 H298" marker-end="url(#arrowbad)"/>
  <path class="line" d="M560 78 H618"/>
  <path class="line" d="M560 168 H618"/>
  <path class="line" d="M560 258 H618"/>

  <rect class="box" x="20" y="48" width="200" height="60" rx="8"/>
  <text x="120" y="73" text-anchor="middle">API server</text>
  <text x="120" y="94" text-anchor="middle">client certificate</text>

  <rect class="box" x="20" y="138" width="200" height="60" rx="8"/>
  <text x="120" y="163" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <text x="120" y="184" text-anchor="middle">no credentials</text>

  <rect class="ok" x="300" y="48" width="260" height="60" rx="8"/>
  <text class="strong" x="430" y="73" text-anchor="middle"><tspan class="code">10250</tspan> HTTPS API</text>
  <text x="430" y="94" text-anchor="middle">credentials and RBAC checked</text>

  <rect class="drop" x="300" y="138" width="260" height="60" rx="8"/>
  <text class="strong" x="430" y="163" text-anchor="middle"><tspan class="code">10255</tspan> read-only port</text>
  <text x="430" y="184" text-anchor="middle">plain HTTP, no authentication</text>

  <rect class="box" x="300" y="228" width="260" height="60" rx="8"/>
  <text class="strong" x="430" y="253" text-anchor="middle"><tspan class="code">10248</tspan> health check</text>
  <text x="430" y="274" text-anchor="middle">loopback address only</text>

  <rect class="box" x="620" y="48" width="200" height="240" rx="8"/>
  <text class="strong" x="720" y="160" text-anchor="middle">kubelet</text>
  <text class="code" x="720" y="182" text-anchor="middle">readOnlyPort: 0</text>
  <text x="720" y="202" text-anchor="middle">closes 10255</text>
</svg>
