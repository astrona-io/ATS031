apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-05-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: kubelet-file-modes
    description: kubelet config.yaml and kubelet.conf have mode 600
    type: file
    source: validation/validate-kubelet-file-modes.sh
    points: 2
  - name: certificate-rotation
    description: The kubelet rotates its certificates
    type: file
    source: validation/validate-certificate-rotation.sh
    points: 1
  - name: streaming-idle-timeout
    description: streamingConnectionIdleTimeout is 5m0s
    type: file
    source: validation/validate-streaming-idle-timeout.sh
    points: 1
  - name: tls-min-version
    description: The kubelet accepts TLS 1.2 or later only
    type: file
    source: validation/validate-tls-min-version.sh
    points: 1
