apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-05-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-{ARCH}
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: kubelet-file-modes
    description: The kubelet configuration file and kubeconfig on the worker node have mode 600 or stricter
    type: file
    source: vm/validate-kubelet-file-modes.sh
    points: 1
  - name: certificate-rotation
    description: The effective kubelet configuration has rotateCertificates set to true
    type: file
    source: vm/validate-certificate-rotation.sh
    points: 1
  - name: streaming-idle-timeout
    description: The effective kubelet streamingConnectionIdleTimeout is 5m0s
    type: file
    source: vm/validate-streaming-idle-timeout.sh
    points: 1
  - name: tls-min-version
    description: The effective kubelet tlsMinVersion is VersionTLS12 or VersionTLS13
    type: file
    source: vm/validate-tls-min-version.sh
    points: 1
