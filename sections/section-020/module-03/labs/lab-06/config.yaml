apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-03-06
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-20261118-{ARCH}
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: controller-manager-profiling
    description: kube-controller-manager runs with --profiling=false
    type: file
    source: vm/validate-controller-manager-profiling.sh
    points: 1
  - name: scheduler-profiling
    description: kube-scheduler runs with --profiling=false
    type: file
    source: vm/validate-scheduler-profiling.sh
    points: 1
  - name: manifest-permissions
    description: Every manifest in /etc/kubernetes/manifests has mode 600 or stricter and owner root:root
    type: file
    source: vm/validate-manifest-permissions.sh
    points: 1
