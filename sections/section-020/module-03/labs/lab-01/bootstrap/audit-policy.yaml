apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
- RequestReceived
rules:
- level: None
  nonResourceURLs:
  - /healthz*
  - /livez*
  - /readyz*
- level: Metadata
  resources:
  - group: ""
    resources: ["secrets"]
- level: Request
  namespaces: ["starfleet-031-020-03-01"]
  resources:
  - group: ""
    resources: ["pods"]
- level: Metadata
