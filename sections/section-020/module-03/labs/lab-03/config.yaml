apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-{ARCH}
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: controller-manager-running
    description: kube-controller-manager runs again without the broken flag and its pod is ready
    type: file
    source: vm/validate-controller-manager-running.sh
    points: 2
  - name: manifest-mode-kept
    description: The kube-controller-manager manifest has mode 600 or stricter and owner root:root, and no extra file is in the manifests directory
    type: file
    source: vm/validate-manifest-mode-kept.sh
    points: 1
