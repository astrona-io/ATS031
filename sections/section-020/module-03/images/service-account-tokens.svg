<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="740" height="370" role="img" aria-labelledby="title desc">
  <title id="title">How the API server signs and checks service account tokens</title>
  <desc id="desc">The API server signs each service account token with the private key named by --service-account-signing-key-file and writes the issuer from --service-account-issuer into it. When a pod sends a request with the token, the API server verifies it with the public key named by --service-account-key-file, and --service-account-lookup checks that the service account still exists in etcd.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M350 75 H438" marker-end="url(#arrow)"/>
  <path class="line" d="M580 110 V168" marker-end="url(#arrow)"/>
  <path class="line" d="M440 192 H352" marker-end="url(#arrow)"/>
  <path class="line" d="M185 230 V278" marker-end="url(#arrow)"/>

  <rect class="box" x="20" y="40" width="330" height="70" rx="8"/>
  <text x="36" y="68"><tspan class="code">kube-apiserver</tspan> signs with <tspan class="code">sa.key</tspan></text>
  <text class="code" x="36" y="92">--service-account-signing-key-file</text>
  <text class="label" x="394" y="66" text-anchor="middle">signs</text>

  <rect class="ask" x="440" y="40" width="280" height="70" rx="8"/>
  <text x="456" y="68">service account token</text>
  <text class="code" x="456" y="92">--service-account-issuer</text>

  <rect class="box" x="440" y="170" width="280" height="44" rx="8"/>
  <text x="580" y="197" text-anchor="middle">pod</text>
  <text class="label" x="396" y="182" text-anchor="middle">request</text>
  <text class="label" x="580" y="240" text-anchor="middle">sends a request with the token</text>

  <rect class="box" x="20" y="160" width="330" height="70" rx="8"/>
  <text x="36" y="188"><tspan class="code">kube-apiserver</tspan> verifies with <tspan class="code">sa.pub</tspan></text>
  <text class="code" x="36" y="212">--service-account-key-file</text>

  <rect class="ask" x="20" y="280" width="330" height="70" rx="8"/>
  <text x="36" y="308">Does the service account still exist in etcd?</text>
  <text class="code" x="36" y="332">--service-account-lookup</text>

</svg>
