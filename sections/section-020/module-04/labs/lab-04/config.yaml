apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-04-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: data-dir-mode
    description: The etcd data directory has mode 700 or stricter and owner root:root, and etcd stays healthy
    type: file
    source: validation/validate-data-dir-mode.sh
    points: 2
  - name: process-user-recorded
    description: ConfigMap etcd-process records the data directory and the user of the running etcd process
    type: file
    source: validation/validate-process-user-recorded.sh
    points: 1
