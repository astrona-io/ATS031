apiVersion: astrona.io/v1
metadata:
  name: ats-031-playground-020-04
  docs:
    guide: docs/overview.md
# A real kubeadm node, so the commands in the guide read and change the real
# static pod manifests, kubelet and etcd files instead of a kind node container.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-{ARCH}
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
