<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">First matching audit rule wins</title>
  <desc id="desc">A request to list pods in starfleet is checked against the rules of the staged audit policy in order. The None rule for health endpoints and the Metadata rule for secrets do not match. The Request rule for pods in starfleet matches, so the event is written at level Request, and the catch-all Metadata rule is never checked.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M240 62 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M480 84 V118" marker-end="url(#arrow)"/>
  <path class="line" d="M480 164 V198" marker-end="url(#arrow)"/>
  <path class="okline" d="M640 222 H668" marker-end="url(#arrowok)"/>

  <rect class="box" x="20" y="34" width="220" height="56" rx="8"/>
  <text class="label" x="36" y="56">request</text>
  <text x="36" y="78">list <tspan class="code">pods</tspan> in <tspan class="code">starfleet</tspan></text>

  <rect class="box" x="320" y="40" width="320" height="44" rx="8"/>
  <text x="336" y="67"><tspan class="code">None</tspan>: <tspan class="code">/healthz*</tspan>, <tspan class="code">/livez*</tspan>, <tspan class="code">/readyz*</tspan></text>
  <text class="label" x="492" y="106">no match</text>

  <rect class="box" x="320" y="120" width="320" height="44" rx="8"/>
  <text x="336" y="147"><tspan class="code">Metadata</tspan>: <tspan class="code">secrets</tspan></text>
  <text class="label" x="492" y="186">no match</text>

  <rect class="ok" x="320" y="200" width="320" height="44" rx="8"/>
  <text x="336" y="227"><tspan class="code">Request</tspan>: <tspan class="code">pods</tspan> in <tspan class="code">starfleet</tspan></text>

  <rect class="box" x="320" y="280" width="320" height="44" rx="8" opacity="0.55"/>
  <text x="336" y="307" opacity="0.55"><tspan class="code">Metadata</tspan>: everything else</text>
  <text class="label" x="660" y="307">never checked</text>

  <rect class="ok" x="670" y="200" width="150" height="44" rx="8"/>
  <text class="code" x="745" y="227" text-anchor="middle">level: Request</text>

  <text x="20" y="362">The rules are checked from the top. The first rule that matches sets the level.</text>

</svg>
