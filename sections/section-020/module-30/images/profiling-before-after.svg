<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Profiling endpoint before and after the change</title>
  <desc id="desc">With the default --profiling=true, a request to /debug/pprof/ returns an HTML index of profile types. With --profiling=false the API server does not register the path, and the same request fails with NotFound.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M304 72 H348" marker-end="url(#arrowok)"/>
  <path class="okline" d="M520 72 H568" marker-end="url(#arrowok)"/>
  <path class="line" d="M304 192 H348" marker-end="url(#arrow)"/>
  <path class="dashed" d="M520 192 H568" marker-end="url(#arrowbad)"/>

  <text class="strong" x="20" y="34">Default: <tspan class="code">--profiling=true</tspan></text>
  <rect class="box" x="20" y="50" width="284" height="44" rx="8"/>
  <text class="code" x="162" y="77" text-anchor="middle">kubectl get --raw /debug/pprof/</text>
  <rect class="box" x="350" y="50" width="170" height="44" rx="8"/>
  <text class="code" x="435" y="77" text-anchor="middle">kube-apiserver</text>
  <rect class="ok" x="570" y="50" width="250" height="44" rx="8"/>
  <text x="695" y="77" text-anchor="middle">HTML index of profile types</text>

  <line class="sep" x1="20" y1="122" x2="820" y2="122"/>

  <text class="strong" x="20" y="154">After the change: <tspan class="code">--profiling=false</tspan></text>
  <rect class="box" x="20" y="170" width="284" height="44" rx="8"/>
  <text class="code" x="162" y="197" text-anchor="middle">kubectl get --raw /debug/pprof/</text>
  <rect class="box" x="350" y="170" width="170" height="44" rx="8"/>
  <text class="code" x="435" y="197" text-anchor="middle">kube-apiserver</text>
  <rect class="drop" x="570" y="170" width="250" height="44" rx="8"/>
  <text x="695" y="197" text-anchor="middle">Error: <tspan class="code">NotFound</tspan></text>

</svg>
