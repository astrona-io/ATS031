<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Authentication, authorization and admission</title>
  <desc id="desc">Every request passes authentication, then authorization, then admission. A request without credentials becomes the user system:anonymous. RBAC lets it read /readyz and denies listing pods with 403 Forbidden.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M150 82 H198" marker-end="url(#arrow)"/>
  <path class="line" d="M370 82 H418" marker-end="url(#arrow)"/>
  <path class="line" d="M590 82 H638" marker-end="url(#arrow)"/>
  <path class="line" d="M190 280 H258" marker-end="url(#arrow)"/>
  <path class="okline" d="M440 274 L538 258" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M440 286 L538 308" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="60" width="130" height="44" rx="8"/>
  <text x="85" y="87" text-anchor="middle">request</text>
  <rect class="ask" x="200" y="60" width="170" height="44" rx="8"/>
  <text x="285" y="87" text-anchor="middle">Authentication</text>
  <rect class="ask" x="420" y="60" width="170" height="44" rx="8"/>
  <text x="505" y="87" text-anchor="middle">Authorization</text>
  <rect class="ask" x="640" y="60" width="170" height="44" rx="8"/>
  <text x="725" y="87" text-anchor="middle">Admission</text>

  <text class="label" x="285" y="128" text-anchor="middle">who is the caller?</text>
  <text class="label" x="505" y="128" text-anchor="middle">what may the caller do?</text>
  <text class="label" x="725" y="128" text-anchor="middle">change or reject</text>
  <text class="code" x="285" y="152" text-anchor="middle">--anonymous-auth</text>
  <text class="code" x="505" y="152" text-anchor="middle">--authorization-mode</text>
  <text class="code" x="505" y="172" text-anchor="middle">=Node,RBAC</text>

  <line class="sep" x1="20" y1="200" x2="820" y2="200"/>
  <text class="strong" x="20" y="232">A request without credentials</text>
  <rect class="box" x="20" y="258" width="170" height="44" rx="8"/>
  <text x="105" y="285" text-anchor="middle"><tspan class="code">curl</tspan>, no credentials</text>
  <rect class="ask" x="260" y="258" width="180" height="44" rx="8"/>
  <text class="code" x="350" y="285" text-anchor="middle">system:anonymous</text>
  <rect class="ok" x="540" y="236" width="280" height="40" rx="8"/>
  <text x="680" y="261" text-anchor="middle"><tspan class="code">/readyz</tspan> answers <tspan class="code">ok</tspan></text>
  <rect class="drop" x="540" y="292" width="280" height="40" rx="8"/>
  <text x="680" y="317" text-anchor="middle">list pods: <tspan class="code">403</tspan> Forbidden</text>

</svg>
