<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Edit a static pod manifest through a copy</title>
  <desc id="desc">The manifest is copied with cp -p to /etc/kubernetes/edit, which the kubelet does not watch. The copy is edited there and then moved back into /etc/kubernetes/manifests in one rename. The kubelet restarts the pod and you check the pod arguments.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M290 112 H548" marker-end="url(#arrow)"/>
  <path class="line" d="M670 134 V188" marker-end="url(#arrow)"/>
  <path class="okline" d="M550 212 H292" marker-end="url(#arrowok)"/>

  <rect class="frame" x="20" y="40" width="300" height="220" rx="10"/>
  <text class="code label" x="36" y="62">/etc/kubernetes/manifests</text>
  <text class="label" x="36" y="80">watched by the kubelet</text>
  <rect class="box" x="50" y="90" width="240" height="44" rx="8"/>
  <text class="code" x="170" y="117" text-anchor="middle">kube-scheduler.yaml</text>
  <rect class="ok" x="50" y="190" width="240" height="44" rx="8"/>
  <text x="170" y="217" text-anchor="middle">new manifest in place</text>

  <rect class="frame" x="520" y="40" width="300" height="220" rx="10"/>
  <text class="code label" x="536" y="62">/etc/kubernetes/edit</text>
  <text class="label" x="536" y="80">not watched</text>
  <rect class="box" x="550" y="90" width="240" height="44" rx="8"/>
  <text class="code" x="670" y="117" text-anchor="middle">kube-scheduler.yaml</text>
  <rect class="ask" x="550" y="190" width="240" height="44" rx="8"/>
  <text x="670" y="217" text-anchor="middle">edited copy</text>

  <text class="label" x="420" y="104" text-anchor="middle">1. <tspan class="code">cp -p</tspan></text>
  <text class="label" x="682" y="166">2. edit</text>
  <text class="label" x="420" y="204" text-anchor="middle">3. <tspan class="code">mv</tspan> (one rename)</text>

  <text x="20" y="296">4. The kubelet sees the changed file and restarts the pod.</text>
  <text x="20" y="320">5. Check the arguments of the running pod.</text>

</svg>
