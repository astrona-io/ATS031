<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">How the kubelet runs static pods</title>
  <desc id="desc">The kubelet on the control plane node watches /etc/kubernetes/manifests and starts one pod for each file. It also creates a read-only mirror pod in the API. Editing the mirror pod with kubectl has no effect on the component.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M360 102 H292" marker-end="url(#arrow)"/>
  <path class="okline" d="M445 124 V206" marker-end="url(#arrowok)"/>
  <path class="line" d="M530 102 H608" marker-end="url(#arrow)"/>
  <path class="dashed" d="M720 210 V144" marker-end="url(#arrowbad)"/>

  <rect class="frame" x="20" y="40" width="530" height="280" rx="10"/>
  <text class="label" x="36" y="62">control plane node</text>

  <rect class="box" x="40" y="80" width="252" height="170" rx="8"/>
  <text class="code strong" x="56" y="104">/etc/kubernetes/manifests</text>
  <text class="code" x="56" y="134">etcd.yaml</text>
  <text class="code" x="56" y="158">kube-apiserver.yaml</text>
  <text class="code" x="56" y="182">kube-controller-manager.yaml</text>
  <text class="code" x="56" y="206">kube-scheduler.yaml</text>
  <text class="code" x="56" y="230" opacity="0.55">.kubelet-keep (ignored)</text>
  <text class="label" x="326" y="94" text-anchor="middle">watches</text>

  <rect class="box" x="360" y="80" width="170" height="44" rx="8"/>
  <text class="code" x="445" y="107" text-anchor="middle">kubelet</text>
  <text class="label good" x="455" y="170">starts and restarts</text>

  <rect class="ok" x="345" y="206" width="190" height="44" rx="8"/>
  <text x="440" y="233" text-anchor="middle">static pod containers</text>

  <text class="label" x="569" y="94" text-anchor="middle">creates</text>
  <rect class="ask" x="610" y="80" width="210" height="64" rx="8"/>
  <text x="715" y="106" text-anchor="middle">mirror pod in the API</text>
  <text class="label" x="715" y="128" text-anchor="middle">read only</text>

  <rect class="box" x="630" y="210" width="180" height="44" rx="8"/>
  <text class="code" x="720" y="237" text-anchor="middle">kubectl edit</text>
  <text x="590" y="282">Editing the mirror pod does</text>
  <text x="590" y="304">not change the component.</text>
  <text class="label" x="40" y="282">The kubelet reads every file whose name</text>
  <text class="label" x="40" y="302">does not start with a dot.</text>

</svg>
