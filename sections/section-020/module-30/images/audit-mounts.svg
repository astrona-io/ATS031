<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Audit policy and log mounts of the API server</title>
  <desc id="desc">Two hostPath volumes connect the node and the kube-apiserver container. The policy directory is mounted read only into the container, and the audit flags point at container paths. The log directory is mounted from the node, so the audit log survives a restart and can be read on the node.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M330 125 H448" marker-end="url(#arrow)"/>
  <path class="okline" d="M450 255 H332" marker-end="url(#arrowok)"/>

  <rect class="frame" x="20" y="30" width="800" height="310" rx="10"/>
  <text class="label" x="36" y="54">control plane node</text>

  <rect class="box" x="44" y="90" width="286" height="70" rx="8"/>
  <text class="code" x="60" y="118">/etc/kubernetes/policy/</text>
  <text class="code" x="60" y="140">audit-policy.yaml</text>

  <rect class="box" x="44" y="220" width="286" height="70" rx="8"/>
  <text class="code" x="60" y="248">/var/log/kubernetes/audit/</text>
  <text class="code" x="60" y="270">audit.log</text>

  <text class="label" x="390" y="116" text-anchor="middle">mount</text>
  <text class="label" x="390" y="146" text-anchor="middle">read only</text>
  <text class="label good" x="390" y="246" text-anchor="middle">events</text>
  <text class="label" x="390" y="276" text-anchor="middle">mount</text>

  <rect class="policy" x="450" y="74" width="346" height="242" rx="10"/>
  <text class="strong" x="470" y="102"><tspan class="code">kube-apiserver</tspan> container</text>
  <text class="label" x="470" y="126">flags use paths inside the container</text>
  <text class="code" x="470" y="160">--audit-policy-file</text>
  <text class="code" x="470" y="184">--audit-log-path</text>
  <text class="code" x="470" y="208">--audit-log-maxage=30</text>
  <text class="code" x="470" y="232">--audit-log-maxbackup=10</text>
  <text class="code" x="470" y="256">--audit-log-maxsize=100</text>
  <text class="label" x="470" y="290">no volume: the log stays in the</text>
  <text class="label" x="470" y="306">container and is lost on restart</text>

</svg>
