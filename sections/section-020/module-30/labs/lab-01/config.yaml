apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: audit-policy
    description: kube-apiserver uses an audit policy file with the same content as the staged policy
    type: file
    source: vm/validate-audit-policy.sh
    points: 1
  - name: audit-log-retention
    description: kube-apiserver sets --audit-log-maxage, --audit-log-maxbackup and --audit-log-maxsize to values above zero
    type: file
    source: vm/validate-audit-log-retention.sh
    points: 1
  - name: audit-events-written
    description: A test request appears in the audit log file on the control plane node
    type: file
    source: vm/validate-audit-events-written.sh
    points: 2
