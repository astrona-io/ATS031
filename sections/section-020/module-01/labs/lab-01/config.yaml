apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: scheduler-bind-address
    description: kube-scheduler runs with --bind-address=127.0.0.1 and port 10259 answers only on the loopback address
    type: file
    source: validation/validate-scheduler-bind-address.sh
    points: 2
  - name: benchmark-review-record
    description: ConfigMap benchmark-review records the corrected scheduler control
    type: file
    source: validation/validate-benchmark-review-record.sh
    points: 1
