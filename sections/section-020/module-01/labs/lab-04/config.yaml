apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-01-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-{ARCH}
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: effective-values
    description: ConfigMap kubelet-review records the effective anonymous, authorization and read-only port values of the worker kubelet
    type: file
    source: vm/validate-effective-values.sh
    points: 2
  - name: config-file-mode
    description: /var/lib/kubelet/config.yaml on the worker has mode 600 or stricter and owner root:root
    type: file
    source: vm/validate-config-file-mode.sh
    points: 1
