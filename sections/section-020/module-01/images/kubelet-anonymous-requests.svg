<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Two anonymous requests to the kubelet</title>
  <desc id="desc">On the node, curl sends an anonymous request to the kubelet HTTPS port 10250 and gets status 401 because the kubelet requires authentication. A second anonymous request to the read-only port 10255 makes no connection, which curl prints as 000, because the port is closed.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="14" width="800" height="262" rx="10"/>
  <text class="label" x="36" y="36">node <tspan class="code">astro-ats-031-playground-020-01</tspan></text>

  <path class="line" d="M190 92 H528" marker-end="url(#arrow)"/>
  <path class="okline" d="M530 118 H192" marker-end="url(#arrowok)"/>
  <text class="label" x="360" y="84" text-anchor="middle">GET /pods, no credentials</text>
  <text class="label good" x="360" y="138" text-anchor="middle">401: authentication required</text>

  <path class="dashed" d="M190 212 H520" marker-end="url(#arrowbad)"/>
  <text class="label" x="360" y="204" text-anchor="middle">GET /pods, no credentials</text>
  <text class="label bad" x="360" y="236" text-anchor="middle">000: no connection, port closed</text>

  <rect class="box" x="50" y="70" width="140" height="170" rx="8"/>
  <text class="code" x="120" y="160" text-anchor="middle">curl</text>

  <rect class="box" x="600" y="56" width="190" height="200" rx="8"/>
  <text class="strong" x="740" y="84" text-anchor="middle">kubelet</text>
  <rect class="ok" x="530" y="80" width="150" height="50" rx="8"/>
  <text class="code" x="605" y="102" text-anchor="middle">:10250</text>
  <text class="label" x="605" y="120" text-anchor="middle">HTTPS</text>
  <rect class="drop" x="530" y="190" width="150" height="50" rx="8"/>
  <text class="code" x="605" y="212" text-anchor="middle">:10255</text>
  <text class="label" x="605" y="230" text-anchor="middle">read-only, disabled</text>
</svg>
