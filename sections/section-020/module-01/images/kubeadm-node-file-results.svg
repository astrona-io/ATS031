<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">File checks on the playground node</title>
  <desc id="desc">Pass: the four static pod manifests and the conf files with mode 600 and owner root, and the etcd data directory with mode 700. Fail: the etcd data directory is owned by root instead of the etcd user, and the kubelet config.yaml has mode 644. Warning: the certificate ca.crt has mode 644, which is a manual check.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="strong good" x="30" y="34">PASS</text>
  <text class="strong bad" x="306" y="34">FAIL</text>
  <text class="strong" x="582" y="34" fill="#b7791f" style="fill:#b7791f">WARN (manual)</text>

  <rect class="ok" x="30" y="50" width="250" height="62" rx="8"/>
  <text class="code" x="44" y="76">manifests/*.yaml</text>
  <text x="44" y="98">mode 600, owner root:root</text>
  <rect class="ok" x="30" y="126" width="250" height="62" rx="8"/>
  <text class="code" x="44" y="152">/etc/kubernetes/*.conf</text>
  <text x="44" y="174">mode 600, owner root:root</text>
  <rect class="ok" x="30" y="202" width="250" height="62" rx="8"/>
  <text class="code" x="44" y="228">/var/lib/etcd</text>
  <text x="44" y="250">mode 700</text>

  <rect class="drop" x="306" y="50" width="250" height="62" rx="8"/>
  <text class="code" x="320" y="76">/var/lib/etcd</text>
  <text x="320" y="98">owner root, not the etcd user</text>
  <rect class="drop" x="306" y="126" width="250" height="62" rx="8"/>
  <text class="code" x="320" y="152">kubelet config.yaml</text>
  <text x="320" y="174">mode 644, wider than 600</text>

  <rect class="ask" x="582" y="50" width="228" height="62" rx="8"/>
  <text class="code" x="596" y="76">pki/ca.crt</text>
  <text x="596" y="98">mode 644, holds no secret</text>
  <text class="label" x="582" y="140">A person decides whether</text>
  <text class="label" x="582" y="160">to change it.</text>
</svg>
