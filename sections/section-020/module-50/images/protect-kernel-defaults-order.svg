<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Safe and unsafe order for protectKernelDefaults</title>
  <desc id="desc">Unsafe order: the kernel values are set only by the kubelet at start, protectKernelDefaults is set to true, the node reboots and the kernel defaults return, so the kubelet fails with invalid kernel flag. Safe order: write the values to 90-kubelet.conf, load them with sysctl -p, set protectKernelDefaults to true, and after a reboot the kubelet starts and the node is Ready.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <text class="label bad" x="20" y="30">Unsafe order</text>
  <text class="label good" x="20" y="150">Safe order</text>

  <path class="line" d="M204 76 H228" marker-end="url(#arrow)"/>
  <path class="line" d="M414 76 H438" marker-end="url(#arrow)"/>
  <path class="dashed" d="M624 76 H648" marker-end="url(#arrowbad)"/>
  <path class="line" d="M204 196 H228" marker-end="url(#arrow)"/>
  <path class="line" d="M414 196 H438" marker-end="url(#arrow)"/>
  <path class="okline" d="M624 196 H648" marker-end="url(#arrowok)"/>

  <rect class="box" x="20" y="44" width="184" height="64" rx="8"/>
  <text x="112" y="71" text-anchor="middle">Values set by the</text>
  <text x="112" y="92" text-anchor="middle">kubelet at start</text>

  <rect class="ask" x="230" y="44" width="184" height="64" rx="8"/>
  <text class="code" x="322" y="71" text-anchor="middle">protectKernelDefaults</text>
  <text x="322" y="92" text-anchor="middle">set to true</text>

  <rect class="box" x="440" y="44" width="184" height="64" rx="8"/>
  <text x="532" y="71" text-anchor="middle">Node reboots, kernel</text>
  <text x="532" y="92" text-anchor="middle">defaults return</text>

  <rect class="drop" x="650" y="44" width="184" height="64" rx="8"/>
  <text x="742" y="71" text-anchor="middle">kubelet fails</text>
  <text class="code" x="742" y="92" text-anchor="middle">invalid kernel flag</text>

  <rect class="box" x="20" y="164" width="184" height="64" rx="8"/>
  <text x="112" y="191" text-anchor="middle">Write values to</text>
  <text class="code" x="112" y="212" text-anchor="middle">90-kubelet.conf</text>

  <rect class="box" x="230" y="164" width="184" height="64" rx="8"/>
  <text class="code" x="322" y="191" text-anchor="middle">sysctl -p</text>
  <text x="322" y="212" text-anchor="middle">loads the file</text>

  <rect class="ask" x="440" y="164" width="184" height="64" rx="8"/>
  <text class="code" x="532" y="191" text-anchor="middle">protectKernelDefaults</text>
  <text x="532" y="212" text-anchor="middle">set to true</text>

  <rect class="ok" x="650" y="164" width="184" height="64" rx="8"/>
  <text x="742" y="191" text-anchor="middle">After a reboot the</text>
  <text x="742" y="212" text-anchor="middle">kubelet starts, Ready</text>
</svg>
