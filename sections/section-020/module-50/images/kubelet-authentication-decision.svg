<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="title desc">
  <title id="title">How the kubelet handles a request without credentials</title>
  <desc id="desc">A request without credentials reaches port 10250. If anonymous.enabled is false, the kubelet answers 401 Unauthorized. If it is true, the authorization mode decides: AlwaysAllow returns 200 and the pod list, Webhook sends a SubjectAccessReview so RBAC decides, and RBAC gives system:anonymous no permission, so the answer is 403 Forbidden.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M420 70 V108" marker-end="url(#arrow)"/>
  <path class="line" d="M320 140 H222" marker-end="url(#arrow)"/>
  <path class="line" d="M420 170 V228" marker-end="url(#arrow)"/>
  <path class="dashed" d="M320 260 H222" marker-end="url(#arrowbad)"/>
  <path class="line" d="M520 260 H618" marker-end="url(#arrow)"/>
  <path class="line" d="M720 290 V338" marker-end="url(#arrow)"/>

  <text class="label" x="271" y="130" text-anchor="middle">false</text>
  <text class="label" x="432" y="204">true</text>
  <text class="label bad" x="271" y="250" text-anchor="middle">AlwaysAllow</text>
  <text class="label" x="569" y="250" text-anchor="middle">Webhook</text>
  <text class="label" x="732" y="320">no permission</text>

  <rect class="box" x="320" y="16" width="200" height="54" rx="8"/>
  <text x="420" y="39" text-anchor="middle">Request to <tspan class="code">:10250</tspan></text>
  <text x="420" y="59" text-anchor="middle">no credentials</text>

  <rect class="ask" x="320" y="110" width="200" height="60" rx="8"/>
  <text x="420" y="135" text-anchor="middle">Anonymous allowed?</text>
  <text class="code" x="420" y="156" text-anchor="middle">anonymous.enabled</text>

  <rect class="box" x="20" y="110" width="200" height="60" rx="8"/>
  <text class="strong" x="120" y="135" text-anchor="middle">401 Unauthorized</text>
  <text x="120" y="156" text-anchor="middle">credentials required</text>

  <rect class="ask" x="320" y="230" width="200" height="60" rx="8"/>
  <text x="420" y="255" text-anchor="middle">Authorization mode</text>
  <text class="code" x="420" y="276" text-anchor="middle">authorization.mode</text>

  <rect class="drop" x="20" y="230" width="200" height="60" rx="8"/>
  <text class="strong" x="120" y="255" text-anchor="middle">200 OK</text>
  <text x="120" y="276" text-anchor="middle">pod list returned</text>

  <rect class="box" x="620" y="230" width="200" height="60" rx="8"/>
  <text class="code" x="720" y="255" text-anchor="middle">SubjectAccessReview</text>
  <text x="720" y="276" text-anchor="middle">RBAC decides</text>

  <rect class="box" x="620" y="340" width="200" height="60" rx="8"/>
  <text class="strong" x="720" y="365" text-anchor="middle">403 Forbidden</text>
  <text class="code" x="720" y="386" text-anchor="middle">system:anonymous</text>
</svg>
