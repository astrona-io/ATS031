<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">The remediation loop</title>
  <desc id="desc">Six steps: audit and record the state before, pick the findings to fix, back up the files, change one setting and check the file, restart the kubelet and wait, audit again and compare with the first record. The comparison, a Ready node and a working application are the evidence.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M260 75 H308" marker-end="url(#arrow)"/>
  <path class="line" d="M540 75 H588" marker-end="url(#arrow)"/>
  <path class="line" d="M705 110 V168" marker-end="url(#arrow)"/>
  <path class="line" d="M590 205 H542" marker-end="url(#arrow)"/>
  <path class="line" d="M310 205 H262" marker-end="url(#arrow)"/>
  <path class="okline" d="M145 240 V288" marker-end="url(#arrowok)"/>

  <rect class="ask" x="30" y="40" width="230" height="70" rx="8"/>
  <text class="strong" x="145" y="68" text-anchor="middle">1. Audit</text>
  <text class="code" x="145" y="90" text-anchor="middle">kube-bench-before.txt</text>

  <rect class="box" x="310" y="40" width="230" height="70" rx="8"/>
  <text class="strong" x="425" y="68" text-anchor="middle">2. Pick findings</text>
  <text x="425" y="90" text-anchor="middle">note the ones you skip</text>

  <rect class="box" x="590" y="40" width="230" height="70" rx="8"/>
  <text class="strong" x="705" y="68" text-anchor="middle">3. Back up files</text>
  <text class="code" x="705" y="90" text-anchor="middle">kubelet-config.yaml.bak</text>

  <rect class="box" x="590" y="170" width="230" height="70" rx="8"/>
  <text class="strong" x="705" y="198" text-anchor="middle">4. Change one setting</text>
  <text x="705" y="220" text-anchor="middle">check the file first</text>

  <rect class="box" x="310" y="170" width="230" height="70" rx="8"/>
  <text class="strong" x="425" y="198" text-anchor="middle">5. Restart the kubelet</text>
  <text x="425" y="220" text-anchor="middle">wait until it answers</text>

  <rect class="ask" x="30" y="170" width="230" height="70" rx="8"/>
  <text class="strong" x="145" y="198" text-anchor="middle">6. Audit again</text>
  <text x="145" y="220" text-anchor="middle">compare with step 1</text>

  <rect class="ok" x="30" y="290" width="230" height="60" rx="8"/>
  <text class="strong" x="145" y="315" text-anchor="middle">Evidence</text>
  <text x="145" y="336" text-anchor="middle">diff, node Ready, probe answers</text>
</svg>
