apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-05-06
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: coredns-write-access
    description: The default service account of the outpost namespace can no longer update or patch the coredns ConfigMap
    type: file
    source: validation/validate-coredns-write-access.sh
    points: 1
  - name: coredns-rbac-kept
    description: After the grant is removed, the coredns service account keeps its system:coredns ClusterRoleBinding and can still watch endpoints, services, pods, namespaces and endpointslices
    type: file
    source: validation/validate-coredns-rbac-kept.sh
    points: 1
  - name: pod-records
    description: The Corefile uses pods verified or pods disabled instead of pods insecure, and Service names still resolve
    type: file
    source: validation/validate-pod-records.sh
    points: 1
