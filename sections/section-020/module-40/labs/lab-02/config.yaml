apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-04-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: server-recorded
    description: ConfigMap etcd-connection records the etcd address that the running API server uses
    type: file
    source: vm/validate-server-recorded.sh
    points: 1
  - name: credentials-recorded
    description: ConfigMap etcd-connection records the client certificate and key that the API server uses for etcd
    type: file
    source: vm/validate-credentials-recorded.sh
    points: 1
  - name: ca-recorded
    description: ConfigMap etcd-connection records the CA file that the API server uses to check etcd
    type: file
    source: vm/validate-ca-recorded.sh
    points: 1
