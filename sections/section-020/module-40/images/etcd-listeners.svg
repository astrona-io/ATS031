<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">The etcd listeners on the playground node</title>
  <desc id="desc">On the loopback address 127.0.0.1, etcd listens on the client port 2379 and the metrics port 2381. On the node address 10.0.2.15, it listens on the peer port 2380 and again on the client port 2379. kube-apiserver uses 127.0.0.1:2379. Another host can connect to 10.0.2.15:2379, so TLS settings protect that port.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="30" width="600" height="300" rx="10"/>
  <text class="label" x="34" y="52">node <tspan class="code">astro-ats-031-playground-020-04</tspan></text>

  <rect class="frame" x="250" y="66" width="350" height="116" rx="8"/>
  <text class="label" x="264" y="86"><tspan class="code">127.0.0.1</tspan> (loopback, this node only)</text>
  <rect class="frame" x="250" y="198" width="350" height="116" rx="8"/>
  <text class="label" x="264" y="218"><tspan class="code">10.0.2.15</tspan> (node address)</text>

  <path class="okline" d="M200 150 L266 134" marker-end="url(#arrowok)"/>
  <path class="line" d="M668 266 H587" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="128" width="160" height="44" rx="8"/>
  <text class="code" x="120" y="155" text-anchor="middle">kube-apiserver</text>

  <rect class="ok" x="268" y="100" width="150" height="62" rx="8"/>
  <text class="code strong" x="343" y="125" text-anchor="middle">2379</text>
  <text x="343" y="147" text-anchor="middle">client, TLS</text>
  <rect class="box" x="432" y="100" width="150" height="62" rx="8"/>
  <text class="code strong" x="507" y="125" text-anchor="middle">2381</text>
  <text x="507" y="147" text-anchor="middle">metrics, plain HTTP</text>

  <rect class="box" x="268" y="232" width="150" height="62" rx="8"/>
  <text class="code strong" x="343" y="257" text-anchor="middle">2380</text>
  <text x="343" y="279" text-anchor="middle">peer, TLS</text>
  <rect class="ask" x="432" y="232" width="150" height="62" rx="8"/>
  <text class="code strong" x="507" y="257" text-anchor="middle">2379</text>
  <text x="507" y="279" text-anchor="middle">client, TLS</text>

  <rect class="box" x="670" y="244" width="150" height="44" rx="8"/>
  <text x="745" y="271" text-anchor="middle">another host</text>
  <text class="label" x="745" y="312" text-anchor="middle">can connect, but must</text>
  <text class="label" x="745" y="330" text-anchor="middle">pass the TLS checks</text>
</svg>
