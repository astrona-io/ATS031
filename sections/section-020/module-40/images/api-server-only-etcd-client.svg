<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The API server is the only client of etcd</title>
  <desc id="desc">kubectl, the kubelet and the scheduler send HTTPS requests to kube-apiserver on port 6443. Only kube-apiserver connects to etcd, with a client certificate on port 2379. etcd members replicate to each other with peer certificates on port 2380.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="270" y="96" width="560" height="104" rx="10"/>
  <text class="label" x="816" y="116" text-anchor="end">control plane node</text>

  <path class="okline" d="M210 72 L318 138" marker-end="url(#arrowok)"/>
  <path class="okline" d="M210 252 L318 166" marker-end="url(#arrowok)"/>
  <path class="okline" d="M460 152 H618" marker-end="url(#arrowok)"/>
  <path class="okline" d="M715 174 V258" marker-end="url(#arrowok)"/>

  <text class="label" x="262" y="80">HTTPS 6443</text>
  <text class="label" x="272" y="250">HTTPS 6443</text>
  <text class="label" x="539" y="142" text-anchor="middle">client certificate</text>
  <text class="label" x="539" y="172" text-anchor="middle">port 2379</text>
  <text class="label" x="705" y="214" text-anchor="end">peer certificate</text>
  <text class="label" x="705" y="232" text-anchor="end">port 2380</text>

  <rect class="box" x="30" y="50" width="180" height="44" rx="8"/>
  <text class="code" x="120" y="77" text-anchor="middle">kubectl</text>
  <rect class="box" x="30" y="230" width="180" height="44" rx="8"/>
  <text x="120" y="257" text-anchor="middle">kubelet and scheduler</text>
  <rect class="ok" x="290" y="130" width="170" height="44" rx="8"/>
  <text class="code" x="375" y="157" text-anchor="middle">kube-apiserver</text>
  <rect class="box" x="620" y="130" width="190" height="44" rx="8"/>
  <text class="code" x="715" y="157" text-anchor="middle">etcd</text>
  <rect class="box" x="620" y="260" width="190" height="44" rx="8"/>
  <text x="715" y="287" text-anchor="middle">other etcd members</text>
</svg>
