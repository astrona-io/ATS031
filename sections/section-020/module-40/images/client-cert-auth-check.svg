<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">What --client-cert-auth=true does</title>
  <desc id="desc">A curl request without a client certificate reaches etcd on port 2379, etcd closes the handshake, and curl reports a TLS error. A curl request with the health-check client certificate, signed by the etcd CA, is accepted and gets the health response.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="150" x2="810" y2="150"/>

  <text class="strong" x="30" y="38">Request without a client certificate</text>
  <path class="dashed" d="M230 88 H378" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M560 88 H628" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="304" y="78" text-anchor="middle">no certificate</text>
  <text class="label bad" x="594" y="78" text-anchor="middle">closed</text>
  <rect class="box" x="30" y="60" width="200" height="56" rx="8"/>
  <text class="code" x="130" y="84" text-anchor="middle">curl -sSk</text>
  <text x="130" y="104" text-anchor="middle">no certificate flags</text>
  <rect class="policy" x="380" y="60" width="180" height="56" rx="8"/>
  <text x="470" y="84" text-anchor="middle"><tspan class="code">etcd</tspan> port 2379</text>
  <text x="470" y="104" text-anchor="middle">certificate required</text>
  <rect class="drop" x="630" y="66" width="180" height="44" rx="8"/>
  <text x="720" y="93" text-anchor="middle">TLS error</text>

  <text class="strong" x="30" y="188">Request with a certificate signed by the etcd CA</text>
  <path class="okline" d="M230 238 H378" marker-end="url(#arrowok)"/>
  <path class="okline" d="M560 238 H628" marker-end="url(#arrowok)"/>
  <text class="label good" x="304" y="228" text-anchor="middle">valid certificate</text>
  <text class="label good" x="594" y="228" text-anchor="middle">accepted</text>
  <rect class="box" x="30" y="210" width="200" height="56" rx="8"/>
  <text class="code" x="130" y="234" text-anchor="middle">sudo curl --cert</text>
  <text class="code" x="130" y="254" text-anchor="middle">healthcheck-client</text>
  <rect class="policy" x="380" y="210" width="180" height="56" rx="8"/>
  <text x="470" y="234" text-anchor="middle"><tspan class="code">etcd</tspan> port 2379</text>
  <text x="470" y="254" text-anchor="middle">certificate required</text>
  <rect class="ok" x="630" y="216" width="180" height="44" rx="8"/>
  <text x="720" y="243" text-anchor="middle">health response</text>
</svg>
