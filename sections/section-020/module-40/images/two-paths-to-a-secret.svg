<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Two paths to the same Secret</title>
  <desc id="desc">kubectl reads the Secret launch-code through kube-apiserver, which authenticates and authorizes the request with RBAC, reads etcd with its client certificate and returns the value base64 encoded. etcdctl reads the key /registry/secrets/starfleet/launch-code directly from etcd with only an etcd client certificate, and sees the value warp-nine-launch as plain text.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="strong" x="30" y="38">Through the API server</text>
  <text class="strong" x="30" y="208">Directly to etcd</text>

  <path class="okline" d="M190 88 H238" marker-end="url(#arrowok)"/>
  <path class="okline" d="M450 88 H675 V150" marker-end="url(#arrowok)"/>
  <text class="label good" x="562" y="78" text-anchor="middle">client certificate</text>
  <path class="line" d="M190 258 H538" marker-end="url(#arrow)"/>
  <text class="label bad" x="364" y="248" text-anchor="middle">only an etcd client certificate is checked</text>
  <text class="label bad" x="364" y="280" text-anchor="middle">no Kubernetes authentication or RBAC</text>

  <rect class="box" x="30" y="66" width="160" height="44" rx="8"/>
  <text class="code" x="110" y="93" text-anchor="middle">kubectl</text>
  <text class="label" x="110" y="134" text-anchor="middle">gets the value</text>
  <text class="label" x="110" y="150" text-anchor="middle">base64 encoded</text>
  <rect class="ask" x="240" y="56" width="210" height="64" rx="8"/>
  <text class="code" x="345" y="80" text-anchor="middle">kube-apiserver</text>
  <text x="345" y="102" text-anchor="middle">authentication, RBAC</text>

  <rect class="box" x="30" y="236" width="160" height="44" rx="8"/>
  <text class="code" x="110" y="263" text-anchor="middle">etcdctl</text>

  <rect class="drop" x="540" y="152" width="270" height="150" rx="8"/>
  <text class="code strong" x="675" y="180" text-anchor="middle">etcd</text>
  <text class="code" x="675" y="208" text-anchor="middle">/registry/secrets/</text>
  <text class="code" x="675" y="226" text-anchor="middle">starfleet/launch-code</text>
  <text x="675" y="256" text-anchor="middle">value stored as plain text:</text>
  <text class="code" x="675" y="280" text-anchor="middle">warp-nine-launch</text>
</svg>
