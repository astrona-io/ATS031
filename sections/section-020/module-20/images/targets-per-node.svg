<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-labelledby="title desc">
  <title id="title">Which targets to run on which node</title>
  <desc id="desc">On a kubeadm control plane node, a complete review runs the targets master, etcd, controlplane, node and policies. On a worker node it runs the node target. The node target runs on every node that has a kubelet.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="30" width="590" height="150" rx="10"/>
  <text class="label" x="34" y="52">control plane node (kubeadm)</text>
  <rect class="frame" x="630" y="30" width="190" height="150" rx="10"/>
  <text class="label" x="644" y="52">worker node</text>

  <rect class="box" x="34" y="80" width="108" height="40" rx="8"/>
  <text class="code" x="88" y="105" text-anchor="middle">master</text>
  <rect class="box" x="148" y="80" width="108" height="40" rx="8"/>
  <text class="code" x="202" y="105" text-anchor="middle">etcd</text>
  <rect class="box" x="262" y="80" width="108" height="40" rx="8"/>
  <text class="code" x="316" y="105" text-anchor="middle">controlplane</text>
  <rect class="ok" x="376" y="80" width="108" height="40" rx="8"/>
  <text class="code" x="430" y="105" text-anchor="middle">node</text>
  <rect class="box" x="490" y="80" width="108" height="40" rx="8"/>
  <text class="code" x="544" y="105" text-anchor="middle">policies</text>
  <rect class="ok" x="671" y="80" width="108" height="40" rx="8"/>
  <text class="code" x="725" y="105" text-anchor="middle">node</text>

  <text class="label" x="88" y="146" text-anchor="middle">components</text>
  <text class="label" x="202" y="146" text-anchor="middle">data store</text>
  <text class="label" x="316" y="146" text-anchor="middle">configuration</text>
  <text class="label" x="430" y="146" text-anchor="middle">kubelet</text>
  <text class="label" x="544" y="146" text-anchor="middle">RBAC, policies</text>
  <text class="label" x="725" y="146" text-anchor="middle">kubelet</text>

  <text x="420" y="214" text-anchor="middle">The <tspan class="code">node</tspan> target runs on every node that has a kubelet, the control plane node too.</text>
</svg>
