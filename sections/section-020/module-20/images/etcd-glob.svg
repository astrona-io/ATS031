<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-labelledby="title desc">
  <title id="title">How a file named etcd.txt changes checks 1.1.7 and 1.1.8</title>
  <desc id="desc">The audits of checks 1.1.7 and 1.1.8 contain the unquoted pattern *etcd*. Run from a directory that holds etcd.txt, the shell replaces the pattern with that file name, and both checks fail. Run from a directory with no matching file, the pattern stays as written, and both checks pass.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="dashed" d="M290 76 H548" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M290 196 H548" marker-end="url(#arrowok)"/>

  <text class="strong" x="40" y="36">Run from a directory that holds <tspan class="code">etcd.txt</tspan></text>
  <text class="strong" x="40" y="156">Run from a directory with no matching file</text>

  <text class="label bad" x="420" y="66" text-anchor="middle">shell turns <tspan class="code">*etcd*</tspan> into <tspan class="code">etcd.txt</tspan></text>
  <text class="label good" x="420" y="186" text-anchor="middle">pattern stays as written</text>

  <rect class="box" x="40" y="52" width="250" height="48" rx="8"/>
  <text x="165" y="81" text-anchor="middle">audit with unquoted <tspan class="code">*etcd*</tspan></text>
  <rect class="drop" x="550" y="52" width="250" height="48" rx="8"/>
  <text class="code" x="675" y="81" text-anchor="middle">[FAIL] 1.1.7 and 1.1.8</text>

  <rect class="box" x="40" y="172" width="250" height="48" rx="8"/>
  <text x="165" y="201" text-anchor="middle">audit with unquoted <tspan class="code">*etcd*</tspan></text>
  <rect class="ok" x="550" y="172" width="250" height="48" rx="8"/>
  <text class="code" x="675" y="201" text-anchor="middle">[PASS] 1.1.7 and 1.1.8</text>
</svg>
