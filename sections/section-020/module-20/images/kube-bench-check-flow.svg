<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">How kube-bench produces one result</title>
  <desc id="desc">A definition file for one benchmark edition holds the audit command. The audit command reads the processes and files of the node. A test compares the output with the expected value and gives PASS, FAIL, WARN or INFO. A failing check also prints its remediation text.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M260 68 H303" marker-end="url(#arrow)"/>
  <path class="line" d="M535 68 H578" marker-end="url(#arrow)"/>
  <path class="line" d="M695 96 V188" marker-end="url(#arrow)"/>
  <path class="line" d="M580 218 H537" marker-end="url(#arrow)"/>
  <path class="line" d="M305 218 H262" marker-end="url(#arrow)"/>

  <text class="label" x="556" y="58" text-anchor="middle">reads</text>
  <text class="label" x="707" y="148">output</text>
  <text class="label bad" x="283" y="208" text-anchor="middle">FAIL</text>

  <rect class="box" x="30" y="40" width="230" height="56" rx="8"/>
  <text class="strong" x="145" y="63" text-anchor="middle">Definition file</text>
  <text class="code" x="145" y="84" text-anchor="middle">cis-1.10/master.yaml</text>

  <rect class="box" x="305" y="40" width="230" height="56" rx="8"/>
  <text class="strong" x="420" y="63" text-anchor="middle">Audit command</text>
  <text x="420" y="84" text-anchor="middle">a shell command</text>

  <rect class="frame" x="580" y="40" width="230" height="56" rx="8"/>
  <text class="strong" x="695" y="63" text-anchor="middle">Node</text>
  <text x="695" y="84" text-anchor="middle">processes and files</text>

  <rect class="ask" x="580" y="190" width="230" height="56" rx="8"/>
  <text class="strong" x="695" y="213" text-anchor="middle">Test</text>
  <text x="695" y="234" text-anchor="middle">compare with expected value</text>

  <rect class="box" x="305" y="190" width="230" height="56" rx="8"/>
  <text class="strong" x="420" y="213" text-anchor="middle">Result</text>
  <text class="code" x="420" y="234" text-anchor="middle">PASS FAIL WARN INFO</text>

  <rect class="drop" x="30" y="190" width="230" height="56" rx="8"/>
  <text class="strong" x="145" y="213" text-anchor="middle">Remediation text</text>
  <text x="145" y="234" text-anchor="middle">what to change</text>
</svg>
