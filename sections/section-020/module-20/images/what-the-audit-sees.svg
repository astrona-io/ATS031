<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">What kube-bench can see from where it runs</title>
  <desc id="desc">The binary run as root on the node sees every process and file of the node. In an ordinary pod, kube-bench sees only its own container. In a pod with hostPID true and host mounts, it sees the node processes and the host directories it mounts.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M110 130 L72 198" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 130 L208 198" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M380 145 L342 198" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M440 145 L478 198" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M650 145 L612 198" marker-end="url(#arrowok)"/>
  <path class="okline" d="M710 145 L748 198" marker-end="url(#arrowok)"/>

  <text class="strong" x="150" y="32" text-anchor="middle">Binary on the node (root)</text>
  <text class="strong" x="420" y="32" text-anchor="middle">Ordinary pod</text>
  <text class="strong" x="690" y="32" text-anchor="middle">Pod with hostPID and mounts</text>

  <rect class="frame" x="20" y="50" width="260" height="210" rx="10"/>
  <rect class="frame" x="290" y="50" width="260" height="210" rx="10"/>
  <rect class="frame" x="560" y="50" width="260" height="210" rx="10"/>
  <text class="label" x="32" y="70">node</text>
  <text class="label" x="302" y="70">node</text>
  <text class="label" x="572" y="70">node</text>

  <rect class="frame" x="330" y="78" width="180" height="82" rx="8"/>
  <text class="label" x="342" y="96">pod</text>
  <rect class="frame" x="600" y="78" width="180" height="82" rx="8"/>
  <text class="label" x="612" y="96">pod</text>

  <rect class="ok" x="80" y="90" width="140" height="40" rx="8"/>
  <text class="code" x="150" y="115" text-anchor="middle">kube-bench</text>
  <rect class="box" x="350" y="105" width="140" height="40" rx="8"/>
  <text class="code" x="420" y="130" text-anchor="middle">kube-bench</text>
  <rect class="ok" x="620" y="105" width="140" height="40" rx="8"/>
  <text class="code" x="690" y="130" text-anchor="middle">kube-bench</text>

  <rect class="box" x="30" y="200" width="115" height="40" rx="8"/>
  <text x="87" y="225" text-anchor="middle">processes</text>
  <rect class="box" x="155" y="200" width="115" height="40" rx="8"/>
  <text x="212" y="225" text-anchor="middle">files</text>
  <rect class="box" x="300" y="200" width="115" height="40" rx="8"/>
  <text x="357" y="225" text-anchor="middle">processes</text>
  <rect class="box" x="425" y="200" width="115" height="40" rx="8"/>
  <text x="482" y="225" text-anchor="middle">files</text>
  <rect class="box" x="570" y="200" width="115" height="40" rx="8"/>
  <text x="627" y="225" text-anchor="middle">processes</text>
  <rect class="box" x="695" y="200" width="115" height="40" rx="8"/>
  <text x="752" y="225" text-anchor="middle">mounted files</text>

  <text class="good" x="150" y="290" text-anchor="middle">sees every process and file</text>
  <text class="bad" x="420" y="290" text-anchor="middle">sees only its own container</text>
  <text class="good" x="690" y="290" text-anchor="middle">sees what it shares and mounts</text>
</svg>
