<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Why check 1.1.10 passes for the binary and warns in the Job</title>
  <desc id="desc">On the node, the kube-bench binary run with sudo reads /var/lib/cni/networks and check 1.1.10 passes. The Job pod does not mount that directory, so the audit finds no files and check 1.1.10 reports WARN.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M160 126 V212 H318" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M680 120 V212 H522" marker-end="url(#arrowbad)"/>

  <text class="label good" x="172" y="172">reads</text>
  <text class="label bad" x="692" y="172">not mounted</text>

  <rect class="frame" x="20" y="14" width="800" height="244" rx="10"/>
  <text class="label" x="34" y="36">node <tspan class="code">astro-ats-031-playground-020-02</tspan></text>

  <rect class="ok" x="60" y="70" width="200" height="56" rx="8"/>
  <text class="code" x="160" y="93" text-anchor="middle">kube-bench</text>
  <text x="160" y="114" text-anchor="middle">binary, run with sudo</text>

  <rect class="frame" x="560" y="48" width="240" height="96" rx="8"/>
  <text class="label" x="572" y="66">Job pod</text>
  <rect class="box" x="600" y="76" width="160" height="44" rx="8"/>
  <text class="code" x="680" y="103" text-anchor="middle">kube-bench</text>

  <rect class="box" x="320" y="190" width="200" height="44" rx="8"/>
  <text class="code" x="420" y="217" text-anchor="middle">/var/lib/cni/networks</text>

  <rect class="ok" x="60" y="276" width="200" height="40" rx="8"/>
  <text class="code" x="160" y="301" text-anchor="middle">[PASS] 1.1.10</text>
  <rect class="ask" x="580" y="276" width="200" height="40" rx="8"/>
  <text class="code" x="680" y="301" text-anchor="middle">[WARN] 1.1.10</text>
</svg>
