apiVersion: astrona.io/v1
metadata:
  name: ats-031-capstone-020
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: api-profiling
    description: The kube-apiserver command contains --profiling=false
    type: file
    source: validation/validate-api-profiling.sh
    points: 1
  - name: etcd-data-dir
    description: The etcd data directory /var/lib/etcd has mode 700
    type: file
    source: validation/validate-etcd-data-dir.sh
    points: 1
  - name: secret-encryption
    description: launch-code is stored with aescbc in etcd and still readable through the API
    type: file
    source: validation/validate-secret-encryption.sh
    points: 2
  - name: kubelet-hardening
    description: The worker kubelet denies anonymous requests, uses Webhook and closes port 10255
    type: file
    source: validation/validate-kubelet-hardening.sh
    points: 2
  - name: cis-evidence
    description: ConfigMap cis-evidence marks six findings fixed with different before and after text
    type: file
    source: validation/validate-cis-evidence.sh
    points: 1
