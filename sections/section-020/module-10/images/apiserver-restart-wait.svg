<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">What happens while the API server restarts</title>
  <desc id="desc">After the new manifest is installed, the old API server may still answer for a few seconds. Then kubectl fails while the kubelet restarts the API server. Then the pod object shows the new flag, and then readyz returns ok and the wait loop ends. The probe pods in the starfleet namespace keep answering requests the whole time. On the playground this took 40 to 70 seconds.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M30 256 H806" marker-end="url(#arrow)"/>
  <text class="label" x="30" y="280">new manifest installed</text>
  <text class="label" x="806" y="280" text-anchor="end">40 to 70 seconds on the playground</text>

  <text class="strong" x="30" y="34">API server</text>
  <rect class="ask" x="30" y="48" width="185" height="70" rx="8"/>
  <text x="122" y="78" text-anchor="middle">old API server</text>
  <text x="122" y="99" text-anchor="middle">may still answer</text>
  <rect class="drop" x="225" y="48" width="185" height="70" rx="8"/>
  <text x="317" y="78" text-anchor="middle"><tspan class="code">kubectl</tspan> fails:</text>
  <text x="317" y="99" text-anchor="middle">API server restarts</text>
  <rect class="box" x="420" y="48" width="185" height="70" rx="8"/>
  <text x="512" y="78" text-anchor="middle">pod object shows</text>
  <text class="code" x="512" y="99" text-anchor="middle">--profiling=false</text>
  <rect class="ok" x="615" y="48" width="195" height="70" rx="8"/>
  <text x="712" y="78" text-anchor="middle"><tspan class="code">/readyz</tspan> returns <tspan class="code">ok</tspan></text>
  <text x="712" y="99" text-anchor="middle">the wait loop ends</text>
  <text class="label bad" x="122" y="140" text-anchor="middle">an early ok is not success</text>

  <text class="strong" x="30" y="178">Application</text>
  <rect class="ok" x="30" y="192" width="780" height="44" rx="8"/>
  <text x="420" y="219" text-anchor="middle"><tspan class="code">probe</tspan> pods in <tspan class="code">starfleet</tspan> keep answering requests the whole time</text>
</svg>
