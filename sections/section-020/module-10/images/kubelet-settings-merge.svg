<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">How the kubelet builds its effective settings</title>
  <desc id="desc">The kubelet merges three sources: the configuration file /var/lib/kubelet/config.yaml, the flags from kubeadm-flags.env which override the file, and the compiled defaults for fields that nothing sets. The kubelet process runs with the merged settings, and the configz endpoint reports them.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="14" width="800" height="272" rx="10"/>
  <text class="label" x="36" y="36">node</text>

  <path class="line" d="M300 82 L378 138" marker-end="url(#arrow)"/>
  <path class="line" d="M300 150 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M300 218 L378 162" marker-end="url(#arrow)"/>
  <path class="line" d="M530 150 H578" marker-end="url(#arrow)"/>
  <path class="line" d="M680 174 V212" marker-end="url(#arrow)"/>
  <text class="label" x="338" y="96" text-anchor="middle">base</text>
  <text class="label" x="339" y="140" text-anchor="middle">override</text>
  <text class="label" x="338" y="222" text-anchor="middle">fill gaps</text>

  <rect class="box" x="50" y="56" width="250" height="52" rx="8"/>
  <text class="code" x="175" y="80" text-anchor="middle">config.yaml</text>
  <text class="label" x="175" y="99" text-anchor="middle">/var/lib/kubelet</text>
  <rect class="ask" x="50" y="124" width="250" height="52" rx="8"/>
  <text x="175" y="148" text-anchor="middle">flags</text>
  <text class="code" x="175" y="167" text-anchor="middle">kubeadm-flags.env</text>
  <rect class="box" x="50" y="192" width="250" height="52" rx="8"/>
  <text x="175" y="223" text-anchor="middle">compiled defaults</text>

  <rect class="ok" x="380" y="126" width="150" height="48" rx="8"/>
  <text x="455" y="155" text-anchor="middle">merged settings</text>
  <rect class="box" x="580" y="126" width="200" height="48" rx="8"/>
  <text x="680" y="155" text-anchor="middle"><tspan class="code">kubelet</tspan> process</text>
  <rect class="ok" x="560" y="214" width="240" height="48" rx="8"/>
  <text x="680" y="236" text-anchor="middle"><tspan class="code">configz</tspan> endpoint</text>
  <text class="label" x="680" y="254" text-anchor="middle">reports the effective values</text>
</svg>
