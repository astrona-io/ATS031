apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-020-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Section 020 works on node files, static pods and the kubelet, so the lab
  # runs a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: scheduler-bind-address
    description: The running kube-scheduler has --bind-address=127.0.0.1 and its pod is ready
    type: file
    source: vm/validate-scheduler-bind-address.sh
    points: 1
  - name: scheduler-loopback-only
    description: Port 10259 answers on 127.0.0.1 and refuses connections on the node address
    type: file
    source: vm/validate-scheduler-loopback-only.sh
    points: 1
  - name: benchmark-review-record
    description: ConfigMap benchmark-review records the corrected scheduler control
    type: file
    source: vm/validate-benchmark-review-record.sh
    points: 1
