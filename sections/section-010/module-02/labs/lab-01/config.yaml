apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: default-deny-all
    description: A default-deny-all policy selects every pod for ingress and egress, and the idler pod can neither send, receive nor resolve names
    type: file
    source: validation/validate-default-deny-all.sh
    points: 1
  - name: forge-ingress-from-smith
    description: The forge pod admits TCP 8080 only from the smith pod, and the visitor pod in dock times out
    type: file
    source: validation/validate-forge-ingress-from-smith.sh
    points: 1
  - name: smith-egress-to-forge
    description: The smith pod reaches the forge pod on TCP 8080 and nothing else
    type: file
    source: validation/validate-smith-egress-to-forge.sh
    points: 1
