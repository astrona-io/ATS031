apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: default-deny-all
    description: default-deny-all isolates outpost for ingress and egress
    type: file
    source: validation/validate-default-deny-all.sh
    points: 1
  - name: probe-ingress-from-shuttle
    description: probe in outpost admits shuttle on TCP 8080
    type: file
    source: validation/validate-probe-ingress-from-shuttle.sh
    points: 1
  - name: shuttle-egress-to-probe
    description: shuttle in outpost reaches probe and DNS only
    type: file
    source: validation/validate-shuttle-egress-to-probe.sh
    points: 2
