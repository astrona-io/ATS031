provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-010/module-03
  title: 'Select Peers And Ports Precisely'
placement:
  position: after
  reading: sections/section-010/module-03/course-07-summary.md
questions:
- id: ats031-010-03-q01
  type: single_choice
  difficulty: beginner
  learning_objective: 'Select a namespace by name with the automatic label.'
  source_readings:
  - sections/section-010/module-03/course-01-selectors-recap-and-the-namespace-name-label.md
  prompt: 'Which label does Kubernetes set on every namespace so that a `namespaceSelector` can select it by name?'
  options:
  - id: a
    text: '`name`'
    explanation: 'Namespaces have no `name` label unless someone adds it.'
  - id: b
    text: '`kubernetes.io/metadata.name`'
    explanation: 'Correct. The control plane sets it automatically to the namespace name.'
  - id: c
    text: '`app`'
    explanation: 'This is a common pod label, not a namespace label.'
  correct_option: b
  explanation: 'The label `kubernetes.io/metadata.name` holds the name of the namespace.'
- id: ats031-010-03-q02
  type: single_choice
  difficulty: beginner
  learning_objective: 'State where a podSelector without a namespaceSelector looks.'
  source_readings:
  - sections/section-010/module-03/course-01-selectors-recap-and-the-namespace-name-label.md
  prompt: 'A peer entry has only `podSelector: {matchLabels: {app: shuttle}}`. In which namespace does it select pods?'
  options:
  - id: a
    text: 'In every namespace.'
    explanation: 'That needs a `namespaceSelector: {}` in the same entry.'
  - id: b
    text: 'In the namespace of the policy.'
    explanation: 'Correct. Without a namespace selector the peer stays in the policy namespace.'
  - id: c
    text: 'In `default`.'
    explanation: 'The default namespace has no special role here.'
  correct_option: b
  explanation: 'A pod selector alone selects pods in the policy namespace only.'
- id: ats031-010-03-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: 'Allow ingress from a pod in another namespace.'
  source_readings:
  - sections/section-010/module-03/course-02-cross-namespace-ingress.md
  prompt: '`probe` in `starfleet` must accept `shuttle` pods from `outpost` only. Which peer entry does that?'
  options:
  - id: a
    text: '`podSelector` with `app: shuttle`'
    explanation: 'This selects pods in `starfleet`, not in `outpost`.'
  - id: b
    text: '`namespaceSelector` with `kubernetes.io/metadata.name: outpost` and `podSelector` with `app: shuttle` in one entry'
    explanation: 'Correct. Both conditions apply to the same entry.'
  - id: c
    text: '`namespaceSelector` with `name: outpost`'
    explanation: 'The namespace has no `name` label, so this matches nothing.'
  correct_option: b
  explanation: 'A cross-namespace peer needs the namespace name label and, to narrow it, a pod selector in the same entry.'
- id: ats031-010-03-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: 'Find the cause of a selector that matches nothing.'
  source_readings:
  - sections/section-010/module-03/course-02-cross-namespace-ingress.md
  prompt: 'A policy uses `namespaceSelector: {matchLabels: {name: outpost}}`. The policy is accepted, and the intended pods are still blocked. Why?'
  options:
  - id: a
    text: 'The API server rejects unknown labels silently.'
    explanation: 'The object is stored; the selector is simply valid but empty.'
  - id: b
    text: 'No namespace carries the label, so the selector matches nothing.'
    explanation: 'Correct. A selector that matches nothing is valid and allows nothing.'
  - id: c
    text: 'The label key is case-insensitive.'
    explanation: 'Label keys are case-sensitive.'
  correct_option: b
  explanation: 'A selector for a missing label is valid and matches no namespace, so the rule allows no one.'
- id: ats031-010-03-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: 'Tell one entry from two entries.'
  source_readings:
  - sections/section-010/module-03/course-03-one-entry-versus-two-entries.md
  prompt: 'A `from` list has `- namespaceSelector: {...outpost}` and, on the next list item, `- podSelector: {app: shuttle}`. Which pods does it allow?'
  options:
  - id: a
    text: 'Only `shuttle` pods in `outpost`.'
    explanation: 'That is one entry with both fields.'
  - id: b
    text: 'All pods in `outpost`, and `shuttle` pods in the policy namespace.'
    explanation: 'Correct. Separate entries are alternatives (OR).'
  - id: c
    text: 'No pods, because the entries cancel each other.'
    explanation: 'Entries never cancel each other; they add up.'
  correct_option: b
  explanation: 'Separate list entries are alternatives. Fields inside one entry must all match.'
- id: ats031-010-03-q06
  type: single_choice
  difficulty: advanced
  learning_objective: 'Repair a two-entry mistake.'
  source_readings:
  - sections/section-010/module-03/course-03-one-entry-versus-two-entries.md
  prompt: 'A rule should allow `shuttle` pods of `starfleet` only. The current rule has two list entries, and `drifter` pods of `starfleet` get through. What is the smallest correct fix?'
  options:
  - id: a
    text: 'Add a second policy that denies `drifter`.'
    explanation: 'There is no deny rule.'
  - id: b
    text: 'Put the `namespaceSelector` and the `podSelector` into one entry.'
    explanation: 'Correct. One entry makes the conditions an AND.'
  - id: c
    text: 'Add `endPort` to the rule.'
    explanation: 'Ports do not select peers.'
  correct_option: b
  explanation: 'The fix is one entry with both selectors. A second policy cannot remove access that the first allows.'
- id: ats031-010-03-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: 'Use ipBlock with except.'
  source_readings:
  - sections/section-010/module-03/course-04-ipblock-and-except.md
  prompt: 'A rule has `ipBlock` with `cidr: 203.0.113.0/24` and `except: [203.0.113.99/32]`. A request arrives from 203.0.113.99. What happens?'
  options:
  - id: a
    text: 'It matches, because the address is in the range.'
    explanation: 'The `except` entry removes it from the match.'
  - id: b
    text: 'It does not match this peer, so this rule does not allow it.'
    explanation: 'Correct. Excluded addresses are not part of the peer.'
  - id: c
    text: 'The whole policy is rejected.'
    explanation: 'An `except` entry inside the `cidr` is valid.'
  correct_option: b
  explanation: 'An `except` address is removed from the peer. Another rule could still allow it.'
- id: ats031-010-03-q08
  type: single_choice
  difficulty: advanced
  learning_objective: 'State a limit of ipBlock.'
  source_readings:
  - sections/section-010/module-03/course-04-ipblock-and-except.md
  prompt: 'Why does a rule for a Service cluster IP address with `ipBlock` usually not match traffic to the Service?'
  options:
  - id: a
    text: 'Policies are applied after the node rewrites the Service address to a pod address.'
    explanation: 'Correct. The plugin compares the pod address and the pod port.'
  - id: b
    text: '`ipBlock` only works with IPv6.'
    explanation: '`ipBlock` supports IPv4 and IPv6.'
  - id: c
    text: 'Services have no IP address.'
    explanation: 'A ClusterIP Service has a cluster IP address.'
  correct_option: a
  explanation: 'The destination address translation happens before the policy check in most plugins, including Calico, so the Service address is not seen.'
- id: ats031-010-03-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: 'Write port forms correctly.'
  source_readings:
  - sections/section-010/module-03/course-05-ports-protocols-and-endport.md
  prompt: 'A service listens on TCP 9000 and UDP 9001. A rule lists only `protocol: TCP, port: 9000`. What happens to the UDP traffic?'
  options:
  - id: a
    text: 'It is allowed, because the port numbers are close.'
    explanation: 'Ports are matched exactly.'
  - id: b
    text: 'It is not allowed, because each protocol needs its own item.'
    explanation: 'Correct. TCP and UDP are separate.'
  - id: c
    text: 'It is allowed, because UDP is the default protocol.'
    explanation: 'The default protocol is TCP.'
  correct_option: b
  explanation: 'The default protocol is TCP, and a rule for TCP does not cover UDP.'
- id: ats031-010-03-q10
  type: single_choice
  difficulty: advanced
  learning_objective: 'Apply policy to Service traffic and replicas.'
  source_readings:
  - sections/section-010/module-03/course-06-policies-on-services-and-replicas.md
  prompt: 'A Service forwards port 80 to container port 8080. Which port goes in the policy, and does it follow new replicas?'
  options:
  - id: a
    text: 'Port 80, and new replicas need a new policy.'
    explanation: 'The plugin sees the pod port after translation, and policies follow labels.'
  - id: b
    text: 'Port 8080, and new replicas with the selected label are covered at once.'
    explanation: 'Correct. The policy selects pods by label, so new pods are covered from the start.'
  - id: c
    text: 'Port 80, and new replicas are covered at once.'
    explanation: 'The Service port is not what the plugin checks.'
  correct_option: b
  explanation: 'Policy checks the pod port. It applies to every pod that matches the selector, including pods created later.'
