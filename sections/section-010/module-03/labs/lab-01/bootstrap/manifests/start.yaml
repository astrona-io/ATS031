apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-code
  namespace: dock
data:
  server.py: |
    import socket
    import threading

    def serve_tcp():
        listener = socket.socket()
        listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        listener.bind(("0.0.0.0", 9000))
        listener.listen()
        while True:
            connection, _ = listener.accept()
            connection.sendall(b"telemetry tcp\n")
            connection.close()

    def serve_udp():
        listener = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        listener.bind(("0.0.0.0", 9001))
        while True:
            _, sender = listener.recvfrom(512)
            listener.sendto(b"telemetry udp\n", sender)

    threading.Thread(target=serve_tcp, daemon=True).start()
    serve_udp()
---
apiVersion: v1
kind: Pod
metadata:
  name: telemetry
  namespace: dock
  labels:
    app: telemetry
spec:
  containers:
  - name: telemetry
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - /app/server.py
    ports:
    - name: feed
      containerPort: 9000
      protocol: TCP
    - name: pulse
      containerPort: 9001
      protocol: UDP
    volumeMounts:
    - name: app
      mountPath: /app
      readOnly: true
  volumes:
  - name: app
    configMap:
      name: telemetry-code
  restartPolicy: Never
