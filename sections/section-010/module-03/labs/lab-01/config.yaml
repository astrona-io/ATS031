apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: probe-from-outpost-policy
    description: NetworkPolicy probe-from-outpost selects outpost shuttle in one entry
    type: file
    source: validation/validate-probe-from-outpost-policy.sh
    points: 1
  - name: only-outpost-shuttle
    description: Only shuttle in outpost reaches probe in starfleet
    type: file
    source: validation/validate-only-outpost-shuttle.sh
    points: 2
