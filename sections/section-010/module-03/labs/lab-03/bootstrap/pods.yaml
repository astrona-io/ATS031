apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: ranges-training
- apiVersion: v1
  kind: Pod
  metadata:
    name: server
    namespace: ranges-training
    labels:
      app: range-server
  spec:
    containers:
    - name: client
      image: python:3.13-alpine
      command:
      - python3
      - -c
      - "import socketserver,threading,time\nclass H(socketserver.BaseRequestHandler):\n def handle(self):\
        \ self.request.sendall(b'range-service\\n')\nfor port in range(8079,8084):\n server=socketserver.TCPServer(('0.0.0.0',port),H);threading.Thread(target=server.serve_forever,daemon=True).start()\n\
        time.sleep(36000)"
    terminationGracePeriodSeconds: 1
- apiVersion: v1
  kind: Pod
  metadata:
    name: allowed
    namespace: ranges-training
    labels:
      app: allowed
  spec:
    containers:
    - name: client
      image: python:3.13-alpine
      command:
      - sleep
      - '36000'
    terminationGracePeriodSeconds: 1
- apiVersion: v1
  kind: Pod
  metadata:
    name: excluded
    namespace: ranges-training
    labels:
      app: excluded
  spec:
    containers:
    - name: client
      image: python:3.13-alpine
      command:
      - sleep
      - '36000'
    terminationGracePeriodSeconds: 1
