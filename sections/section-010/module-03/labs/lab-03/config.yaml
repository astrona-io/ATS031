apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: division-labels
    description: The survey and salvage namespaces carry division=science and the outpost namespace does not
    type: file
    source: validation/validate-division-labels.sh
    points: 1
  - name: archive-admits-division
    description: The archive pod accepts TCP 8080 from namespaces labelled division=science and the outpost namespace times out
    type: file
    source: validation/validate-archive-admits-division.sh
    points: 1
