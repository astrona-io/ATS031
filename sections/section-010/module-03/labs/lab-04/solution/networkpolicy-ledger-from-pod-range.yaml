apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-from-pod-range
  namespace: starfleet-031-010-03-04
spec:
  podSelector:
    matchLabels:
      app: ledger
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 192.168.0.0/16
        except:
        - <ROGUE_IP>/32
    ports:
    - protocol: TCP
      port: 7070
