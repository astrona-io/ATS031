apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-from-starfleet
  namespace: outpost-031-010-03-02
spec:
  podSelector:
    matchLabels:
      app: probe
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: starfleet-031-010-03-02
      podSelector:
        matchLabels:
          app: shuttle
    ports:
    - protocol: TCP
      port: 8080
