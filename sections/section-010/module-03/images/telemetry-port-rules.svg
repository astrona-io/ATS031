<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Port items of the telemetry-ports policy</title>
  <desc id="desc">From the shuttle pod in starfleet, a TCP request to port 9000 matches the item TCP 9000 to 9009 and reaches the feed listener, and a UDP message to port 9001 matches the item UDP pulse and reaches the pulse listener. A TCP request to port 9100 matches no item, so the plugin drops it and the request times out.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="policy" x="260" y="30" width="260" height="264" rx="10"/>
  <rect class="frame" x="600" y="30" width="220" height="264" rx="10"/>
  <path class="okline" d="M170 140 L298 102" marker-end="url(#arrowok)"/>
  <path class="okline" d="M480 102 H638" marker-end="url(#arrowok)"/>
  <path class="okline" d="M170 160 L298 182" marker-end="url(#arrowok)"/>
  <path class="okline" d="M480 182 H638" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M170 176 L300 250 H438" marker-end="url(#arrowbad)"/>
  <rect x="442" y="230" width="10" height="40" rx="2" fill="#c53030"/>
  <text class="label bad" x="390" y="240" text-anchor="middle">TCP 9100</text>
  <text class="label bad" x="390" y="282" text-anchor="middle">no item matches: timeout</text>
  <rect class="box" x="20" y="126" width="150" height="64" rx="8"/>
  <text class="code" x="95" y="152" text-anchor="middle">shuttle</text>
  <text x="95" y="174" text-anchor="middle">in <tspan class="code">starfleet</tspan></text>
  <text class="code" x="390" y="56" text-anchor="middle">telemetry-ports</text>
  <rect class="ask" x="300" y="80" width="180" height="44" rx="8"/>
  <text x="390" y="107" text-anchor="middle">TCP 9000 to 9009</text>
  <rect class="ask" x="300" y="160" width="180" height="44" rx="8"/>
  <text x="390" y="187" text-anchor="middle">UDP <tspan class="code">pulse</tspan></text>
  <text class="label" x="616" y="54"><tspan class="code">telemetry</tspan> pod</text>
  <rect class="ok" x="640" y="80" width="160" height="44" rx="8"/>
  <text x="720" y="107" text-anchor="middle">TCP 9000 <tspan class="code">feed</tspan></text>
  <rect class="ok" x="640" y="160" width="160" height="44" rx="8"/>
  <text x="720" y="187" text-anchor="middle">UDP 9001 <tspan class="code">pulse</tspan></text>
  <rect class="box" x="640" y="230" width="160" height="44" rx="8" opacity="0.55"/>
  <text x="720" y="257" text-anchor="middle" opacity="0.55">9100: no listener</text>
</svg>
