<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-labelledby="title desc">
  <title id="title">The policy checks the pod port after DNAT</title>
  <desc id="desc">The shuttle pod sends a request to the probe Service on port 80. The kube-proxy rules on the node rewrite it with destination network address translation to a probe pod address and port 8080. The policy check then sees port 8080, so a rule with port 80 never matches and a rule with port 8080 matches.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M156 82 H184" marker-end="url(#arrowok)"/>
  <path class="okline" d="M322 82 H350" marker-end="url(#arrowok)"/>
  <path class="okline" d="M488 82 H516" marker-end="url(#arrowok)"/>
  <path class="okline" d="M654 82 H682" marker-end="url(#arrowok)"/>
  <rect class="box" x="20" y="50" width="136" height="64" rx="8"/>
  <text x="88" y="76" text-anchor="middle">client pod</text>
  <text class="code" x="88" y="98" text-anchor="middle">shuttle</text>
  <rect class="box" x="186" y="50" width="136" height="64" rx="8"/>
  <text x="254" y="76" text-anchor="middle">Service</text>
  <text class="code" x="254" y="98" text-anchor="middle">probe:80</text>
  <rect class="box" x="352" y="50" width="136" height="64" rx="8"/>
  <text class="code" x="420" y="76" text-anchor="middle">kube-proxy</text>
  <text x="420" y="98" text-anchor="middle">rules: DNAT</text>
  <rect class="ask" x="518" y="50" width="136" height="64" rx="8"/>
  <text x="586" y="76" text-anchor="middle">policy check</text>
  <text class="code" x="586" y="98" text-anchor="middle">pod IP, 8080</text>
  <rect class="ok" x="684" y="50" width="136" height="64" rx="8"/>
  <text x="752" y="76" text-anchor="middle"><tspan class="code">probe</tspan> pod</text>
  <text x="752" y="98" text-anchor="middle">port 8080</text>
  <text class="label" x="420" y="140" text-anchor="middle">rewrites the Service address and port 80 to a pod address and port 8080</text>
  <line class="sep" x1="30" y1="162" x2="810" y2="162"/>
  <rect class="drop" x="186" y="180" width="300" height="40" rx="8"/>
  <text x="336" y="205" text-anchor="middle">Rule with <tspan class="code">port: 80</tspan>: never matches</text>
  <rect class="ok" x="520" y="180" width="300" height="40" rx="8"/>
  <text x="670" y="205" text-anchor="middle">Rule with <tspan class="code">port: 8080</tspan>: matches</text>
</svg>
