<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 264" width="840" height="264" role="img" aria-labelledby="title desc">
  <title id="title">A label change moves a pod in and out of a rule</title>
  <desc id="desc">While the shuttle pod has the label app: shuttle, its request reaches the probe pods. After the label changes to app: other, the request times out. After the label is restored to app: shuttle, the request reaches the probe pods again.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M250 92 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M520 92 H588" marker-end="url(#arrow)"/>
  <text class="label" x="285" y="80" text-anchor="middle">relabel</text>
  <text class="label" x="555" y="80" text-anchor="middle">restore</text>
  <path class="okline" d="M150 122 V168" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M420 122 V168" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M690 122 V168" marker-end="url(#arrowok)"/>
  <text class="strong" x="150" y="40" text-anchor="middle">Before</text>
  <rect class="box" x="50" y="62" width="200" height="60" rx="8"/>
  <text class="code" x="150" y="86" text-anchor="middle">shuttle</text>
  <text class="code" x="150" y="108" text-anchor="middle">app: shuttle</text>
  <rect class="ok" x="50" y="170" width="200" height="44" rx="8"/>
  <text class="good" x="150" y="197" text-anchor="middle">reaches <tspan class="code">probe</tspan></text>
  <text class="strong" x="420" y="40" text-anchor="middle">After the relabel</text>
  <rect class="box" x="320" y="62" width="200" height="60" rx="8"/>
  <text class="code" x="420" y="86" text-anchor="middle">shuttle</text>
  <text class="code" x="420" y="108" text-anchor="middle">app: other</text>
  <rect class="drop" x="320" y="170" width="200" height="44" rx="8"/>
  <text class="bad" x="420" y="197" text-anchor="middle">timeout</text>
  <text class="strong" x="690" y="40" text-anchor="middle">After the restore</text>
  <rect class="box" x="590" y="62" width="200" height="60" rx="8"/>
  <text class="code" x="690" y="86" text-anchor="middle">shuttle</text>
  <text class="code" x="690" y="108" text-anchor="middle">app: shuttle</text>
  <rect class="ok" x="590" y="170" width="200" height="44" rx="8"/>
  <text class="good" x="690" y="197" text-anchor="middle">reaches <tspan class="code">probe</tspan></text>
  <text class="label" x="420" y="246" text-anchor="middle">The peer selects <tspan class="code">app: shuttle</tspan>, so the result follows the current label of the pod</text>
</svg>
