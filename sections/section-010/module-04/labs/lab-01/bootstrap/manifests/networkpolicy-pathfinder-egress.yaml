apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pathfinder-egress
  namespace: starfleet-031-010-04-01
spec:
  podSelector:
    matchLabels:
      app: pathfinder
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: datastore
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - ipBlock:
        cidr: <API_SERVER_IP>/32
    ports:
    - protocol: TCP
      port: <API_SERVER_PORT>
