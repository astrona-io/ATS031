apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastore-ingress
  namespace: starfleet-031-010-04-01
spec:
  podSelector:
    matchLabels:
      app: datastore
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: pathfinder
    ports:
    - protocol: TCP
      port: 6379
