apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scout-to-probe
  namespace: starfleet-031-010-04-01
spec:
  podSelector:
    matchLabels:
      app: scout
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: starfleet-031-010-04-01
      podSelector:
        matchLabels:
          app: probe
    ports:
    - protocol: TCP
      port: 8080
