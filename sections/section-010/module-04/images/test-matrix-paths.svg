<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Expected paths of the starfleet test matrix</title>
  <desc id="desc">The scout pod in starfleet must reach CoreDNS for dns, the probe Service for probe, and the API server for api. The drifter pod in outpost must stay blocked from the probe pods and from the scout pod. Green solid lines must work, red dashed lines must stay blocked.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M470 84 C 540 84, 560 66, 618 66" marker-end="url(#arrowok)"/>
  <text class="label good" x="540" y="66" text-anchor="middle">dns</text>
  <path class="okline" d="M470 104 C 540 104, 560 166, 618 166" marker-end="url(#arrowok)"/>
  <text class="label good" x="540" y="148" text-anchor="middle">api</text>
  <path class="okline" d="M390 118 V246" marker-end="url(#arrowok)"/>
  <text class="label good" x="400" y="188">probe</text>
  <path class="dashed" d="M180 272 C 230 272, 250 274, 308 274" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M180 248 C 230 220, 250 100, 308 100" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="236" y="170" text-anchor="middle">blocked</text>
  <text class="label bad" x="236" y="300" text-anchor="middle">blocked</text>

  <rect class="frame" x="20" y="210" width="180" height="110" rx="10"/>
  <text class="label" x="34" y="232">namespace <tspan class="code">outpost</tspan></text>
  <rect class="box" x="40" y="236" width="140" height="48" rx="8"/>
  <text x="110" y="265" text-anchor="middle"><tspan class="code">drifter</tspan> pod</text>

  <rect class="frame" x="280" y="30" width="290" height="290" rx="10"/>
  <text class="label" x="294" y="52">namespace <tspan class="code">starfleet</tspan></text>
  <rect class="box" x="310" y="70" width="160" height="48" rx="8"/>
  <text x="390" y="99" text-anchor="middle"><tspan class="code">scout</tspan> pod</text>
  <rect class="box" x="310" y="248" width="220" height="52" rx="8"/>
  <text x="420" y="279" text-anchor="middle"><tspan class="code">probe</tspan> Service and pods</text>

  <rect class="box" x="620" y="40" width="200" height="52" rx="8"/>
  <text x="720" y="71" text-anchor="middle">CoreDNS pods</text>
  <rect class="box" x="620" y="140" width="200" height="52" rx="8"/>
  <text x="720" y="171" text-anchor="middle">API server</text>

  <path class="okline" d="M620 258 H660"/>
  <text x="670" y="263">must work</text>
  <path class="dashed" d="M620 290 H660"/>
  <text x="670" y="295">must stay blocked</text>
</svg>
