<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Node traffic and a hostNetwork pod under a baseline</title>
  <desc id="desc">On one node, the kubelet sends a readiness probe to the probe pod on port 8080 and Calico lets it pass. The drifter pod in outpost is dropped when it requests the probe pod, which has its own pod address and is covered by policy. The beacon pod runs with hostNetwork true on the node address, port 19099, so pod policy does not apply and the drifter request reaches it.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M180 190 C 230 10, 560 10, 668 148" marker-end="url(#arrowok)"/>
  <text class="label good" x="420" y="28" text-anchor="middle">reachable on port 19099</text>
  <path class="dashed" d="M180 212 C 250 212, 270 298, 328 298" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="232" y="300" text-anchor="middle">dropped</text>
  <path class="okline" d="M430 138 V268" marker-end="url(#arrowok)"/>
  <text class="label good" x="442" y="200">readiness probe</text>

  <rect class="frame" x="20" y="150" width="180" height="110" rx="10"/>
  <text class="label" x="34" y="172">namespace <tspan class="code">outpost</tspan></text>
  <rect class="box" x="40" y="184" width="140" height="48" rx="8"/>
  <text x="110" y="213" text-anchor="middle"><tspan class="code">drifter</tspan> pod</text>

  <rect class="frame" x="270" y="50" width="550" height="330" rx="12"/>
  <text class="label" x="806" y="74" text-anchor="end">node</text>
  <rect class="box" x="330" y="90" width="200" height="48" rx="8"/>
  <text x="430" y="119" text-anchor="middle">kubelet</text>

  <rect class="box" x="590" y="150" width="210" height="64" rx="8"/>
  <text x="695" y="176" text-anchor="middle"><tspan class="code">beacon</tspan> pod</text>
  <text class="label" x="695" y="198" text-anchor="middle">node address, port 19099</text>
  <rect class="ask" x="590" y="240" width="210" height="64" rx="8"/>
  <text x="695" y="266" text-anchor="middle"><tspan class="code">hostNetwork: true</tspan></text>
  <text class="label" x="695" y="288" text-anchor="middle">pod policy does not apply</text>

  <rect class="frame" x="296" y="232" width="264" height="132" rx="10"/>
  <text class="label" x="310" y="354">pod network: policy applies</text>
  <rect class="box" x="330" y="270" width="200" height="60" rx="8"/>
  <text x="430" y="294" text-anchor="middle"><tspan class="code">probe</tspan> pod</text>
  <text class="label" x="430" y="316" text-anchor="middle">pod address, port 8080</text>
</svg>
