<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">API server egress for the scout pod</title>
  <desc id="desc">The scout pod sends a request to the kubernetes Service cluster IP on port 443. The node rewrites the address to the API server endpoint on port 6443. The scout-egress policy allows that endpoint with an ipBlock /32 rule on TCP 6443, while other pods in starfleet have no rule and are dropped. At the API server, RBAC decides what the request may do.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M215 100 H318" marker-end="url(#arrow)"/>
  <text class="label" x="266" y="88" text-anchor="middle">request</text>
  <path class="line" d="M425 124 V200" marker-end="url(#arrow)"/>
  <text class="label" x="437" y="166">node rewrites to the endpoint</text>
  <path class="okline" d="M530 234 H608" marker-end="url(#arrowok)"/>
  <text class="label good" x="569" y="224" text-anchor="middle">allowed</text>
  <path class="dashed" d="M215 300 H300" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="258" y="322" text-anchor="middle">dropped</text>
  <path class="line" d="M705 268 V292" marker-end="url(#arrow)"/>

  <rect class="frame" x="20" y="40" width="220" height="300" rx="10"/>
  <text class="label" x="34" y="62">namespace <tspan class="code">starfleet</tspan></text>
  <rect class="box" x="45" y="76" width="170" height="48" rx="8"/>
  <text x="130" y="105" text-anchor="middle"><tspan class="code">scout</tspan> pod</text>
  <rect class="box" x="45" y="276" width="170" height="48" rx="8"/>
  <text x="130" y="305" text-anchor="middle">other pods</text>

  <rect class="box" x="320" y="64" width="210" height="60" rx="8"/>
  <text x="425" y="88" text-anchor="middle"><tspan class="code">kubernetes</tspan> Service</text>
  <text class="label" x="425" y="110" text-anchor="middle">cluster IP, port 443</text>

  <rect class="policy" x="320" y="202" width="210" height="64" rx="8"/>
  <text x="425" y="228" text-anchor="middle"><tspan class="code">scout-egress</tspan> policy</text>
  <text class="code" x="425" y="250" text-anchor="middle">ipBlock /32, TCP 6443</text>

  <rect class="drop" x="304" y="280" width="226" height="44" rx="8"/>
  <text x="417" y="307" text-anchor="middle">no rule for other pods</text>

  <rect class="frame" x="585" y="174" width="240" height="176" rx="10"/>
  <text class="label" x="599" y="196">control plane node</text>
  <rect class="ok" x="610" y="208" width="190" height="60" rx="8"/>
  <text x="705" y="232" text-anchor="middle">API server</text>
  <text class="label" x="705" y="254" text-anchor="middle">endpoint, port 6443</text>
  <rect class="ask" x="610" y="294" width="190" height="44" rx="8"/>
  <text x="705" y="321" text-anchor="middle">RBAC decides the action</text>
</svg>
