apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-02-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: egress-denied
    description: 'Every pod in the dock namespace is isolated for egress: requests to pod addresses and DNS lookups time out'
    type: file
    source: validation/validate-egress-denied.sh
    points: 1
  - name: ingress-still-open
    description: The baseline names only Egress, so other pods still reach the pods in the dock namespace
    type: file
    source: validation/validate-ingress-still-open.sh
    points: 1
