apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-from-smith
  namespace: outpost-031-010-02-01
spec:
  podSelector:
    matchLabels:
      app: forge
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: smith
    ports:
    - protocol: TCP
      port: 8080
