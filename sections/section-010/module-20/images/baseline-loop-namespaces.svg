<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">One baseline for labelled namespaces</title>
  <desc id="desc">The loop selects the namespaces with the label baseline=deny and applies networkpolicy-default-deny-all.yaml to each with kubectl apply -n. starfleet and dock carry the label and get default-deny-all. outpost has no label, gets no policy and stays open.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M330 170 H378" marker-end="url(#arrow)"/>
  <path class="okline" d="M540 170 H560 V75 H588" marker-end="url(#arrowok)"/>
  <path class="okline" d="M560 170 V180 H588" marker-end="url(#arrowok)"/>

  <rect class="box" x="30" y="140" width="300" height="60" rx="8"/>
  <text x="180" y="164" text-anchor="middle">one file, no <tspan class="code">namespace</tspan> field</text>
  <text class="code" x="180" y="186" text-anchor="middle">networkpolicy-default-deny-all.yaml</text>

  <rect class="ask" x="380" y="134" width="160" height="72" rx="8"/>
  <text x="460" y="158" text-anchor="middle">loop over</text>
  <text class="code" x="460" y="178" text-anchor="middle">-l baseline=deny</text>
  <text class="code" x="460" y="197" text-anchor="middle">kubectl apply -n</text>

  <rect class="policy" x="590" y="30" width="230" height="90" rx="10"/>
  <text class="label" x="604" y="52">Namespace <tspan class="code">starfleet</tspan></text>
  <text class="code" x="604" y="78">baseline=deny</text>
  <text class="good" x="604" y="104">gets <tspan class="code">default-deny-all</tspan></text>

  <rect class="policy" x="590" y="135" width="230" height="90" rx="10"/>
  <text class="label" x="604" y="157">Namespace <tspan class="code">dock</tspan></text>
  <text class="code" x="604" y="183">baseline=deny</text>
  <text class="good" x="604" y="209">gets <tspan class="code">default-deny-all</tspan></text>

  <rect class="frame" x="590" y="240" width="230" height="90" rx="10"/>
  <text class="label" x="604" y="262">Namespace <tspan class="code">outpost</tspan></text>
  <text x="604" y="288">no label, not selected</text>
  <text class="bad" x="604" y="314">no policy: stays open</text>
</svg>
