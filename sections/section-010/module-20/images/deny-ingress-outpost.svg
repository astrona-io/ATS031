<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Default deny ingress in outpost</title>
  <desc id="desc">The default-deny-ingress policy isolates every pod in outpost for ingress. New requests to the probe pods from the shuttle pod in starfleet and from the shuttle pod in outpost are dropped. The shuttle pod in outpost can still send a request to the probe pods in dock, and the reply comes back.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="40" width="190" height="120" rx="10"/>
  <text class="label" x="44" y="62">Namespace <tspan class="code">starfleet</tspan></text>
  <rect class="policy" x="280" y="40" width="310" height="290" rx="10"/>
  <text class="label" x="294" y="62">Namespace <tspan class="code">outpost</tspan></text>
  <text class="label" x="294" y="316"><tspan class="code">default-deny-ingress</tspan> isolates ingress here</text>
  <rect class="frame" x="630" y="180" width="190" height="150" rx="10"/>
  <text class="label" x="644" y="202">Namespace <tspan class="code">dock</tspan></text>

  <path class="dashed" d="M195 100 H333" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M435 240 V126" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M535 254 H648" marker-end="url(#arrowok)"/>
  <path class="okline" d="M650 272 H537" marker-end="url(#arrowok)"/>
  <text class="label bad" x="250" y="92" text-anchor="middle">dropped</text>
  <text class="label bad" x="447" y="188">dropped</text>
  <text class="label good" x="592" y="246" text-anchor="middle">request</text>
  <text class="label good" x="592" y="292" text-anchor="middle">reply</text>

  <rect class="box" x="45" y="78" width="150" height="44" rx="8"/>
  <text x="120" y="105" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <rect class="drop" x="335" y="78" width="200" height="44" rx="8"/>
  <text x="435" y="105" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>
  <rect class="box" x="335" y="240" width="200" height="44" rx="8"/>
  <text x="435" y="267" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <rect class="ok" x="650" y="240" width="150" height="44" rx="8"/>
  <text x="725" y="267" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>

  <path class="okline" d="M40 364 H80" marker-end="url(#arrowok)"/>
  <text class="label" x="90" y="369">allowed: egress is open, and the reply belongs to that connection</text>
  <path class="dashed" d="M560 364 H600" marker-end="url(#arrowbad)"/>
  <text class="label" x="610" y="369">dropped: new incoming</text>
</svg>
