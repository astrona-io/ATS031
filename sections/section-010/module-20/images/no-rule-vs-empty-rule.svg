<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320" role="img" aria-labelledby="title desc">
  <title id="title">No rule versus an empty rule</title>
  <desc id="desc">Left: a policy with policyTypes Ingress and no ingress section allows no source, so requests to the selected pods are dropped. Right: the same policy with the empty rule ingress: [{}] allows every source.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="420" y1="20" x2="420" y2="310"/>
  <text class="strong" x="30" y="36">Baseline: no ingress section</text>
  <rect class="box" x="30" y="52" width="370" height="140" rx="8"/>
  <text class="code" x="50" y="78">spec:</text>
  <text class="code" x="66" y="98">podSelector: {}</text>
  <text class="code" x="66" y="118">policyTypes:</text>
  <text class="code" x="66" y="138">- Ingress</text>
  <text class="code label" x="66" y="158"># no ingress section</text>
  <path class="dashed" d="M180 242 H258" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="219" y="232" text-anchor="middle">dropped</text>
  <rect class="box" x="30" y="220" width="150" height="44" rx="8"/>
  <text x="105" y="247" text-anchor="middle">any source pod</text>
  <rect class="drop" x="260" y="220" width="140" height="44" rx="8"/>
  <text x="330" y="247" text-anchor="middle">selected pods</text>
  <text x="30" y="300">No source is allowed.</text>
  <text class="strong" x="450" y="36">Not a baseline: one empty rule</text>
  <rect class="box" x="450" y="52" width="370" height="140" rx="8"/>
  <text class="code" x="470" y="78">spec:</text>
  <text class="code" x="486" y="98">podSelector: {}</text>
  <text class="code" x="486" y="118">policyTypes:</text>
  <text class="code" x="486" y="138">- Ingress</text>
  <text class="code bad" x="486" y="158">ingress:</text>
  <text class="code bad" x="486" y="178">- {}</text>
  <path class="okline" d="M600 242 H678" marker-end="url(#arrowok)"/>
  <text class="label good" x="639" y="232" text-anchor="middle">allowed</text>
  <rect class="box" x="450" y="220" width="150" height="44" rx="8"/>
  <text x="525" y="247" text-anchor="middle">any source pod</text>
  <rect class="ok" x="680" y="220" width="140" height="44" rx="8"/>
  <text x="750" y="247" text-anchor="middle">selected pods</text>
  <text x="450" y="300">Every source is allowed.</text>

</svg>
