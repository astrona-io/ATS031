<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">An open cluster</title>
  <desc id="desc">No NetworkPolicy exists. The shuttle pod in the dock namespace sends requests to the probe Service in starfleet and to the probe Service in outpost, and both requests reach the probe pods.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="40" width="230" height="220" rx="10"/>
  <text class="label" x="44" y="62">Namespace <tspan class="code">dock</tspan></text>
  <rect class="frame" x="540" y="30" width="270" height="110" rx="10"/>
  <text class="label" x="554" y="52">Namespace <tspan class="code">starfleet</tspan></text>
  <rect class="frame" x="540" y="160" width="270" height="110" rx="10"/>
  <text class="label" x="554" y="182">Namespace <tspan class="code">outpost</tspan></text>

  <path class="okline" d="M220 140 H400 V92 H588" marker-end="url(#arrowok)"/>
  <path class="okline" d="M220 160 H400 V222 H588" marker-end="url(#arrowok)"/>
  <text class="code good" x="494" y="84" text-anchor="middle">probe.starfleet</text>
  <text class="code good" x="494" y="214" text-anchor="middle">probe.outpost</text>

  <rect class="box" x="70" y="128" width="150" height="44" rx="8"/>
  <text x="145" y="155" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <rect class="ok" x="590" y="70" width="170" height="44" rx="8"/>
  <text x="675" y="97" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>
  <rect class="ok" x="590" y="200" width="170" height="44" rx="8"/>
  <text x="675" y="227" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>

  <text x="30" y="302">No NetworkPolicy exists, so no pod is isolated and every request passes.</text>
</svg>
