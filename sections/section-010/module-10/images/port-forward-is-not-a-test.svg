<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Why kubectl port-forward does not test a policy</title>
  <desc id="desc">A request from the shuttle pod goes through the packet filter on the node, where NetworkPolicy rules apply, before it reaches the probe pod. A kubectl port-forward connection from your terminal is opened by the kubelet on the node and goes into the probe pod without passing that pod-to-pod filter, so it says nothing about a policy.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .box, .ok { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .amber { fill: #b7791f; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="250" y="24" width="570" height="312" rx="12"/>
  <text class="label" x="266" y="48">node</text>

  <!-- Path 1: a real request from a pod -->
  <path class="okline" d="M190 96 H416" marker-end="url(#arrowok)"/>
  <path class="okline" d="M440 96 H560 V150 H616" marker-end="url(#arrowok)"/>
  <text class="label good" x="300" y="86" text-anchor="middle">request</text>

  <!-- Path 2: kubectl port-forward -->
  <path class="line" d="M190 266 H286" marker-end="url(#arrow)"/>
  <path class="line" d="M410 266 H560 V214 H616" marker-end="url(#arrow)"/>
  <text class="label" x="484" y="290" text-anchor="middle">skips the filter</text>

  <rect class="box" x="30" y="72" width="160" height="48" rx="8"/>
  <text x="110" y="101" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>

  <rect class="policy" x="418" y="60" width="20" height="72" rx="3"/>
  <text class="label amber" x="428" y="152" text-anchor="middle">packet filter</text>
  <text class="label amber" x="428" y="170" text-anchor="middle">(NetworkPolicy)</text>

  <rect class="ok" x="620" y="134" width="170" height="96" rx="8"/>
  <text x="705" y="187" text-anchor="middle"><tspan class="code">probe</tspan> pod</text>

  <rect class="box" x="30" y="242" width="160" height="48" rx="8"/>
  <text x="110" y="263" text-anchor="middle">your terminal</text>
  <text class="code" x="110" y="281" text-anchor="middle">port-forward</text>

  <rect class="box" x="290" y="242" width="120" height="48" rx="8"/>
  <text class="code" x="350" y="271" text-anchor="middle">kubelet</text>

  <text class="good strong" x="30" y="150">Tests the policy</text>
  <text class="label strong" x="30" y="320">Does not test the policy</text>
</svg>
