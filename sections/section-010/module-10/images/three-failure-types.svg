<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Three ways a request fails</title>
  <desc id="desc">Timeout: the network plugin dropped the packets and no reply comes back. Connection refused: the destination answered with a reset because no process listens on that port. Resolution error: the DNS lookup failed before any connection was made.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="140" x2="810" y2="140"/>
  <line class="sep" x1="30" y1="270" x2="810" y2="270"/>

  <text class="strong" x="30" y="38">Timeout</text>
  <rect class="box" x="30" y="56" width="120" height="44" rx="8"/>
  <text x="90" y="83" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <path class="dashed" d="M150 78 H258" marker-end="url(#arrowbad)"/>
  <rect x="262" y="50" width="10" height="56" rx="2" fill="#c53030"/>
  <text class="label bad" x="267" y="124" text-anchor="middle">packet filter</text>
  <rect class="box" x="330" y="56" width="160" height="44" rx="8" opacity="0.55"/>
  <text x="410" y="83" text-anchor="middle" opacity="0.55">destination pod</text>
  <text x="520" y="72">The network plugin dropped the packets.</text>
  <text x="520" y="94">No reply comes back, so the client gives up.</text>

  <text class="strong" x="30" y="168">Connection refused</text>
  <rect class="box" x="30" y="186" width="120" height="44" rx="8"/>
  <text x="90" y="213" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <path class="line" d="M150 200 H328" marker-end="url(#arrow)"/>
  <path class="line" d="M330 216 H152" marker-end="url(#arrow)"/>
  <text class="label" x="240" y="192" text-anchor="middle">request</text>
  <text class="label bad" x="240" y="238" text-anchor="middle">reset</text>
  <rect class="ask" x="330" y="186" width="160" height="44" rx="8"/>
  <text x="410" y="213" text-anchor="middle">pod, port closed</text>
  <text x="520" y="202">The destination answered with a reset.</text>
  <text x="520" y="224">No process listens on that port.</text>

  <text class="strong" x="30" y="298">Resolution error</text>
  <rect class="box" x="30" y="316" width="120" height="44" rx="8"/>
  <text x="90" y="343" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <path class="dashed" d="M150 338 H328" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="240" y="330" text-anchor="middle">name lookup fails</text>
  <rect class="drop" x="330" y="316" width="160" height="44" rx="8"/>
  <text x="410" y="343" text-anchor="middle">cluster DNS</text>
  <text x="520" y="332">The DNS step failed before any connection.</text>
  <text x="520" y="354">The client never learned an address.</text>
</svg>
