<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Default deny with allowances</title>
  <desc id="desc">The default-deny-all policy isolates every pod in starfleet for ingress and egress. The shuttle pod still reaches CoreDNS in kube-system on port 53 and the probe pods on TCP port 8080, because shuttle-egress and probe-shuttle allow those connections. The request from shuttle to blocked-server and the request from drifter in outpost to the probe pods are dropped.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="policy" x="30" y="30" width="540" height="300" rx="10"/>
  <text class="label" x="46" y="54">Namespace <tspan class="code">starfleet</tspan></text>
  <text class="label" x="46" y="316"><tspan class="code">default-deny-all</tspan> isolates every pod here</text>

  <rect class="frame" x="610" y="30" width="210" height="100" rx="10"/>
  <text class="label" x="624" y="52">Namespace <tspan class="code">kube-system</tspan></text>
  <rect class="frame" x="610" y="200" width="210" height="130" rx="10"/>
  <text class="label" x="624" y="222">Namespace <tspan class="code">outpost</tspan></text>

  <path class="okline" d="M130 160 V86 H638" marker-end="url(#arrowok)"/>
  <path class="okline" d="M200 182 H280 V122 H398" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M200 194 H280 V262 H398" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M640 262 H590 V134 H542" marker-end="url(#arrowbad)"/>

  <text class="label good" x="400" y="78" text-anchor="middle">UDP and TCP 53</text>
  <text class="label good" x="340" y="114" text-anchor="middle">TCP 8080</text>
  <text class="label bad" x="340" y="254" text-anchor="middle">dropped</text>

  <rect class="box" x="60" y="160" width="140" height="44" rx="8"/>
  <text x="130" y="187" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <rect class="ok" x="400" y="100" width="140" height="44" rx="8"/>
  <text x="470" y="127" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>
  <rect class="drop" x="400" y="240" width="140" height="44" rx="8"/>
  <text class="code" x="470" y="267" text-anchor="middle">blocked-server</text>
  <rect class="ok" x="640" y="64" width="150" height="44" rx="8"/>
  <text x="715" y="91" text-anchor="middle">CoreDNS pod</text>
  <rect class="box" x="640" y="240" width="150" height="44" rx="8"/>
  <text x="715" y="267" text-anchor="middle"><tspan class="code">drifter</tspan> pod</text>

  <path class="okline" d="M40 358 H80" marker-end="url(#arrowok)"/>
  <text class="label" x="90" y="363">allowed by <tspan class="code">shuttle-egress</tspan> and <tspan class="code">probe-shuttle</tspan></text>
  <path class="dashed" d="M480 358 H520" marker-end="url(#arrowbad)"/>
  <text class="label" x="530" y="363">dropped: no policy allows it</text>
</svg>
