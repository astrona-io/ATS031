<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Result of the probe-shuttle policy</title>
  <desc id="desc">In the starfleet namespace, the NetworkPolicy probe-shuttle protects the probe pods. The shuttle pod reaches them on TCP port 8080. The request from the drifter pod in the outpost namespace is dropped and times out.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="490" height="230" rx="10"/>
  <text class="label" x="46" y="54">Namespace <tspan class="code">starfleet</tspan></text>
  <rect class="frame" x="560" y="30" width="250" height="230" rx="10"/>
  <text class="label" x="576" y="54">Namespace <tspan class="code">outpost</tspan></text>

  <rect class="policy" x="300" y="72" width="200" height="168" rx="10"/>
  <text class="label" x="400" y="96" text-anchor="middle">NetworkPolicy</text>
  <text class="label code" x="400" y="114" text-anchor="middle">probe-shuttle</text>

  <path class="okline" d="M200 162 H318" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M610 162 H502" marker-end="url(#arrowbad)"/>
  <text class="label good" x="259" y="152" text-anchor="middle">TCP 8080</text>
  <text class="label good" x="259" y="182" text-anchor="middle">allowed</text>
  <text class="label bad" x="555" y="152" text-anchor="middle">dropped</text>
  <text class="label bad" x="555" y="182" text-anchor="middle">timeout</text>

  <rect class="box" x="60" y="130" width="140" height="64" rx="8"/>
  <text x="130" y="156" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <text class="code" x="130" y="178" text-anchor="middle">app: shuttle</text>

  <rect class="ok" x="320" y="130" width="160" height="64" rx="8"/>
  <text x="400" y="156" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>
  <text class="code" x="400" y="178" text-anchor="middle">app: probe</text>

  <rect class="box" x="612" y="130" width="170" height="64" rx="8"/>
  <text x="697" y="156" text-anchor="middle"><tspan class="code">drifter</tspan> pod</text>
  <text class="code" x="697" y="178" text-anchor="middle">app: drifter</text>
</svg>
