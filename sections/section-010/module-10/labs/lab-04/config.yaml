apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-01-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: lander-reaches-depot
    description: The lander pod reaches the depot pod on TCP port 8080 while default-deny-all stays in place
    type: file
    source: validation/validate-lander-reaches-depot.sh
    points: 1
  - name: baseline-and-narrow-rules
    description: default-deny-all is unchanged, only the three original policies exist, and the repaired depot-ingress rule admits only the lander pod on TCP 8080
    type: file
    source: validation/validate-baseline-and-narrow-rules.sh
    points: 1
  - name: other-paths-blocked
    description: The stray pod still times out to the depot pod, and the lander pod still times out to the stray pod
    type: file
    source: validation/validate-other-paths-blocked.sh
    points: 1
