<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Path of a DNS lookup from the scout pod</title>
  <desc id="desc">The scout pod sends a DNS query to the kube-dns Service address from resolv.conf. The node rewrites the address to a CoreDNS pod address. The scout-dns policy then allows UDP and TCP port 53 to the CoreDNS pods labelled k8s-app: kube-dns in kube-system, and other add-on pods in kube-system stay blocked.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M210 102 H318" marker-end="url(#arrow)"/>
  <text class="label" x="264" y="88" text-anchor="middle">DNS query</text>
  <path class="line" d="M420 126 V218" marker-end="url(#arrow)"/>
  <text class="label" x="432" y="170">node rewrites to a CoreDNS pod address</text>
  <path class="okline" d="M520 250 H613" marker-end="url(#arrowok)"/>
  <text class="label good" x="562" y="236" text-anchor="middle">allowed</text>
  <path class="dashed" d="M520 268 C 560 268, 570 312, 613 312" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="556" y="334" text-anchor="middle">dropped</text>

  <rect class="frame" x="20" y="40" width="220" height="110" rx="10"/>
  <text class="label" x="34" y="62">namespace <tspan class="code">starfleet</tspan></text>
  <rect class="box" x="50" y="78" width="160" height="48" rx="8"/>
  <text x="130" y="107" text-anchor="middle"><tspan class="code">scout</tspan> pod</text>

  <rect class="box" x="320" y="66" width="200" height="60" rx="8"/>
  <text x="420" y="90" text-anchor="middle"><tspan class="code">kube-dns</tspan> Service</text>
  <text class="label" x="420" y="112" text-anchor="middle">address from <tspan class="code">resolv.conf</tspan></text>

  <rect class="policy" x="320" y="220" width="200" height="60" rx="8"/>
  <text x="420" y="244" text-anchor="middle"><tspan class="code">scout-dns</tspan> policy</text>
  <text class="label" x="420" y="266" text-anchor="middle">UDP 53 and TCP 53</text>

  <rect class="frame" x="590" y="186" width="230" height="164" rx="10"/>
  <text class="label" x="604" y="208">namespace <tspan class="code">kube-system</tspan></text>
  <rect class="ok" x="615" y="222" width="190" height="54" rx="8"/>
  <text x="710" y="244" text-anchor="middle">CoreDNS pod</text>
  <text class="code" x="710" y="264" text-anchor="middle">k8s-app: kube-dns</text>
  <rect class="box" x="615" y="290" width="190" height="44" rx="8"/>
  <text x="710" y="317" text-anchor="middle">other add-on pods</text>
</svg>
