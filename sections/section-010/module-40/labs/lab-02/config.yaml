apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-04-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: dns-rule
    description: The navigator-dns policy selects only the navigator pod and allows egress only on UDP 53 and TCP 53 to the kube-dns pods, selected in one peer entry; no other policy is added
    type: file
    source: validation/validate-dns-rule.sh
    points: 1
  - name: navigator-resolves
    description: The navigator pod resolves names through CoreDNS while default-deny-all stays in place
    type: file
    source: validation/validate-navigator-resolves.sh
    points: 1
  - name: dns-only
    description: 'The navigator pod reaches nothing else: the CoreDNS metrics port 9153 and the cargo pod time out, and the cargo pod still cannot resolve names'
    type: file
    source: validation/validate-dns-only.sh
    points: 1
