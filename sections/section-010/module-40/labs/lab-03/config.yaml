apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-04-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: api-endpoint-rule
    description: The operator-to-api-server policy has an egress rule whose ipBlock contains the API server endpoint address and whose port is the endpoint port, not the Service port 443
    type: file
    source: validation/validate-api-endpoint-rule.sh
    points: 1
  - name: operator-reaches-api
    description: The operator pod reaches the API server through the kubernetes Service on port 443
    type: file
    source: validation/validate-operator-reaches-api.sh
    points: 1
  - name: api-rule-narrow
    description: The rule is one /32 address on one port, the helper pod cannot reach the API server and the operator pod reaches nothing else
    type: file
    source: validation/validate-api-rule-narrow.sh
    points: 1
