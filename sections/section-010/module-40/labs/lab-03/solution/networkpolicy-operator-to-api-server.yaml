apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-to-api-server
  namespace: starfleet-031-010-04-03
spec:
  podSelector:
    matchLabels:
      app: operator
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: <API_SERVER_IP>/32
    ports:
    - protocol: TCP
      port: <API_SERVER_PORT>
