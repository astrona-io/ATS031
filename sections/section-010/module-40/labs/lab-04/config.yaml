apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-04-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: starfleet-rows
    description: The three traffic rows sent from pods in starfleet-031-010-04-04 (rover-to-hangar, rover-to-vault, tanker-to-hangar) in the test-matrix ConfigMap match the live result (open or blocked)
    type: file
    source: validation/validate-starfleet-rows.sh
    points: 1
  - name: outpost-rows
    description: The two traffic rows sent from the drone pod in outpost-031-010-04-04 (drone-to-hangar, drone-to-vault) in the test-matrix ConfigMap match the live result (open or blocked)
    type: file
    source: validation/validate-outpost-rows.sh
    points: 1
  - name: dns-rows
    description: The two DNS rows in the test-matrix ConfigMap match the live result (resolved or unresolved)
    type: file
    source: validation/validate-dns-rows.sh
    points: 1
