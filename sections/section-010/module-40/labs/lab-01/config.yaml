apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-04-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: dns-egress
    description: pathfinder-egress allows UDP 53 and TCP 53 to the kube-dns pods in kube-system, and the pathfinder pod resolves names
    type: file
    source: validation/validate-dns-egress.sh
    points: 1
  - name: pathfinder-dependencies
    description: The pathfinder pod reaches the datastore on TCP 6379 and the API server through the kubernetes Service, keeps the /32 API server rule, and still times out to the stranger pod
    type: file
    source: validation/validate-pathfinder-dependencies.sh
    points: 1
  - name: datastore-ingress
    description: The datastore-ingress policy isolates the datastore for ingress and admits only the pathfinder pod on TCP 6379; the stranger pod times out
    type: file
    source: validation/validate-datastore-ingress.sh
    points: 1
