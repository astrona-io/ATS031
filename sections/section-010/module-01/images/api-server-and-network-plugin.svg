<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Who enforces a NetworkPolicy</title>
  <desc id="desc">kubectl apply sends the NetworkPolicy to kube-apiserver, which validates it and stores it in etcd but filters no traffic. The calico-node agent on every node watches NetworkPolicy objects and programs packet filter rules for the pods on its node.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 72 H258" marker-end="url(#arrow)"/>
  <path class="line" d="M440 72 H508" marker-end="url(#arrow)"/>
  <path class="line" d="M350 94 V140"/>
  <path class="line" d="M220 140 H620"/>
  <path class="line" d="M220 140 V203" marker-end="url(#arrow)"/>
  <path class="line" d="M620 140 V203" marker-end="url(#arrow)"/>
  <path class="line" d="M220 249 V289" marker-end="url(#arrow)"/>
  <path class="line" d="M620 249 V289" marker-end="url(#arrow)"/>

  <text class="label" x="350" y="36" text-anchor="middle">validates and stores, filters nothing</text>
  <text class="label" x="474" y="64" text-anchor="middle">store</text>
  <text class="label" x="362" y="124">watches NetworkPolicy objects</text>
  <text class="label" x="232" y="274">programs</text>
  <text class="label" x="632" y="274">programs</text>

  <rect class="box" x="30" y="50" width="160" height="44" rx="8"/>
  <text class="code" x="110" y="77" text-anchor="middle">kubectl apply</text>
  <rect class="box" x="260" y="50" width="180" height="44" rx="8"/>
  <text class="code strong" x="350" y="77" text-anchor="middle">kube-apiserver</text>
  <rect class="box" x="510" y="50" width="120" height="44" rx="8"/>
  <text class="code" x="570" y="77" text-anchor="middle">etcd</text>

  <rect class="frame" x="30" y="165" width="380" height="195" rx="10"/>
  <text class="label" x="46" y="188">Node 1</text>
  <rect class="frame" x="430" y="165" width="380" height="195" rx="10"/>
  <text class="label" x="446" y="188">Node 2</text>

  <rect class="box" x="110" y="205" width="220" height="44" rx="8"/>
  <text x="220" y="232" text-anchor="middle"><tspan class="code">calico-node</tspan> agent</text>
  <rect class="box" x="510" y="205" width="220" height="44" rx="8"/>
  <text x="620" y="232" text-anchor="middle"><tspan class="code">calico-node</tspan> agent</text>

  <rect class="ask" x="70" y="291" width="300" height="44" rx="8"/>
  <text x="220" y="318" text-anchor="middle">Packet filter rules for its pods</text>
  <rect class="ask" x="470" y="291" width="300" height="44" rx="8"/>
  <text x="620" y="318" text-anchor="middle">Packet filter rules for its pods</text>
</svg>
