apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: hub-policy
    description: The hub-from-tender policy selects the hub pods for ingress and admits only pods labelled app=tender on TCP 8080
    type: file
    source: validation/validate-hub-policy.sh
    points: 1
  - name: tender-allowed
    description: The tender pod reaches the hub Service and every hub replica
    type: file
    source: validation/validate-tender-allowed.sh
    points: 1
  - name: others-denied
    description: The idler pod and the stranger pod in outpost time out to hub, while both still reach other pods, so the hub policy causes the block
    type: file
    source: validation/validate-others-denied.sh
    points: 1
