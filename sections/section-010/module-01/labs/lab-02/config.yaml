apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: scanner-egress-policy
    description: The scanner-egress policy allows UDP and TCP 53 to CoreDNS and TCP 8080 to the archive pods, and nothing wider
    type: file
    source: validation/validate-scanner-egress-policy.sh
    points: 1
  - name: scanner-reaches-archive
    description: The scanner pod resolves the archive Service name and gets a reply from the Service
    type: file
    source: validation/validate-scanner-reaches-archive.sh
    points: 1
  - name: decoy-blocked
    description: The scanner pod times out to the healthy decoy pod, which still answers the idler pod
    type: file
    source: validation/validate-decoy-blocked.sh
    points: 1
