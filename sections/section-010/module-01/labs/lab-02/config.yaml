apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: shuttle-egress-policy
    description: NetworkPolicy shuttle-egress allows only DNS and probe on TCP 8080
    type: file
    source: validation/validate-shuttle-egress-policy.sh
    points: 1
  - name: blocked-server
    description: Pod blocked-server is running with its own label
    type: file
    source: validation/validate-blocked-server.sh
    points: 1
  - name: shuttle-egress-enforced
    description: Shuttle resolves and reaches probe and times out on blocked-server
    type: file
    source: validation/validate-shuttle-egress-enforced.sh
    points: 2
