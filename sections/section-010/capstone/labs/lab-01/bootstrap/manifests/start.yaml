apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: Namespace
metadata:
  name: dock
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet
data:
  server.py: "from http.server import BaseHTTPRequestHandler, HTTPServer\nfrom pathlib\
    \ import Path\nimport os\nimport socket\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        marker = {\"/ready\": \"/tmp/not-ready\", \"/health\"\
    : \"/tmp/unhealthy\"}.get(self.path)\n        status = 503 if marker and Path(marker).exists()\
    \ else 200\n        settings = Path(\"/settings/greeting\")\n        greeting\
    \ = settings.read_text().strip() if settings.exists() else os.getenv(\"GREETING\"\
    , \"hello\")\n        body = f\"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\
    \ greeting={greeting}\\n\"\n        self.send_response(status)\n        self.send_header(\"\
    Content-Type\", \"text/plain\")\n        self.end_headers()\n        self.wfile.write(body.encode())\n\
    \nHTTPServer((\"0.0.0.0\", 8080), Handler).serve_forever()\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
      release: probe
  template:
    metadata:
      labels:
        app: probe
        release: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
    release: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: outpost
  labels:
    app: shuttle
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: telemetry
  namespace: dock
  labels:
    app: telemetry
spec:
  containers:
  - name: telemetry
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -m
    - http.server
    - "8080"
  restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: dock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dock
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scout-pod-reader
  namespace: dock
subjects:
- kind: ServiceAccount
  name: scout
  namespace: dock
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-code
  namespace: dock
data:
  check.py: |
    import os
    import socket
    import ssl
    import struct
    import urllib.request

    def dns():
        server = [line.split()[1] for line in open("/etc/resolv.conf") if line.startswith("nameserver")][0]
        query = struct.pack(">HHHHHH", 4660, 256, 1, 0, 0, 0)
        for label in "kubernetes.default.svc.cluster.local".split("."):
            query += bytes([len(label)]) + label.encode()
        query += b"\x00" + struct.pack(">HH", 1, 1)
        with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sender:
            sender.settimeout(3)
            sender.sendto(query, (server, 53))
            answer = sender.recv(512)
        assert len(answer) > 12 and answer[3] & 15 == 0

    def api():
        directory = "/var/run/secrets/kubernetes.io/serviceaccount"
        token = open(directory + "/token").read()
        context = ssl.create_default_context(cafile=directory + "/ca.crt")
        url = "https://%s:%s/api/v1/namespaces/dock/pods" % (os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"])
        request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
        urllib.request.urlopen(request, timeout=3, context=context).read()

    results = []
    for name, step in (("dns", dns), ("api", api),):
        try:
            step()
            results.append(name + "=ok")
        except Exception:
            results.append(name + "=fail")
    print(" ".join(results))

---
apiVersion: v1
kind: Pod
metadata:
  name: scout
  namespace: dock
  labels:
    app: scout
spec:
  serviceAccountName: scout
  containers:
  - name: scout
    image: docker.io/library/python:3.13-alpine
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: app
      mountPath: /app
      readOnly: true
  volumes:
  - name: app
    configMap:
      name: scout-code
  restartPolicy: Never
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-from-outpost
  namespace: starfleet
spec:
  podSelector:
    matchLabels:
      app: probe
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: outpost
    - podSelector:
        matchLabels:
          app: shuttle
    ports:
    - protocol: TCP
      port: 8080
