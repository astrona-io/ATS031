apiVersion: astrona.io/v1
metadata:
  name: ats-031-capstone-010
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: default-deny-all
    description: default-deny-all in starfleet, outpost and dock denies ingress and egress
    type: file
    source: validation/validate-default-deny-all.sh
    points: 1
  - name: probe-from-outpost
    description: probe-from-outpost admits only shuttle from outpost on TCP 8080
    type: file
    source: validation/validate-probe-from-outpost.sh
    points: 1
  - name: shuttle-egress
    description: Shuttle egress allows probe, DNS and the external range only
    type: file
    source: validation/validate-shuttle-egress.sh
    points: 1
  - name: scout-egress
    description: Scout egress allows DNS and the API server endpoint only
    type: file
    source: validation/validate-scout-egress.sh
    points: 1
  - name: traffic-enforced
    description: Allowed requests succeed and the three denied requests time out
    type: file
    source: validation/validate-traffic-enforced.sh
    points: 2
