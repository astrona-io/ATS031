apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: assay-policy-repaired
    description: The assay-from-starfleet policy has one peer entry that combines a namespaceSelector for starfleet with a podSelector for app=sampler, on TCP 8080
    type: file
    source: validation/validate-assay-policy-repaired.sh
    points: 1
  - name: only-starfleet-sampler
    description: Only the sampler pod in starfleet reaches the assay; the idler in starfleet and the sampler pods in dock and outpost time out, and no other policy exists
    type: file
    source: validation/validate-only-starfleet-sampler.sh
    points: 1
