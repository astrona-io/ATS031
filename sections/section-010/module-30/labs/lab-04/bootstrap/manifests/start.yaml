apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-031-010-03-04
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-031-010-03-04
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-code
  namespace: starfleet-031-010-03-04
data:
  server.py: |
    import os
    import socket
    import threading

    NAME = os.environ.get("SERVER_NAME", socket.gethostname())


    def answer(connection, port):
        try:
            connection.settimeout(1)
            try:
                connection.recv(4096)
            except OSError:
                pass
            body = ("%s port=%d\n" % (NAME, port)).encode()
            head = "HTTP/1.0 200 OK\r\nContent-Type: text/plain\r\nContent-Length: %d\r\n\r\n" % len(body)
            connection.sendall(head.encode() + body)
        except OSError:
            pass
        finally:
            connection.close()


    def serve_tcp(port):
        listener = socket.socket()
        listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        listener.bind(("0.0.0.0", port))
        listener.listen(16)
        while True:
            connection, _ = listener.accept()
            threading.Thread(target=answer, args=(connection, port), daemon=True).start()


    def serve_udp(port):
        listener = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        listener.bind(("0.0.0.0", port))
        while True:
            _, sender = listener.recvfrom(512)
            listener.sendto(("%s udp port=%d\n" % (NAME, port)).encode(), sender)


    threads = []
    for value in os.environ.get("TCP_PORTS", "").split(","):
        if value:
            threads.append(threading.Thread(target=serve_tcp, args=(int(value),), daemon=True))
    for value in os.environ.get("UDP_PORTS", "").split(","):
        if value:
            threads.append(threading.Thread(target=serve_udp, args=(int(value),), daemon=True))
    for thread in threads:
        thread.start()
    for thread in threads:
        thread.join()
  client.py: |
    import socket
    import sys
    import threading

    mode, target = sys.argv[1], sys.argv[2]
    port = int(sys.argv[3]) if len(sys.argv) > 3 else 0
    try:
        if mode == "tcp":
            connection = socket.create_connection((target, port), timeout=3)
            connection.sendall(b"GET / HTTP/1.0\r\n\r\n")
            reply = connection.recv(4096).decode(errors="replace").strip().splitlines()
            print("open " + (reply[-1] if reply else ""))
        elif mode == "udp":
            connection = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            connection.settimeout(3)
            connection.sendto(b"ping", (target, port))
            reply, _ = connection.recvfrom(512)
            print("open " + reply.decode(errors="replace").strip())
        elif mode == "dns":
            answer = {}

            def look_up():
                try:
                    answer["address"] = socket.gethostbyname(target)
                except OSError:
                    pass

            lookup = threading.Thread(target=look_up, daemon=True)
            lookup.start()
            lookup.join(6)
            print("resolved " + answer["address"] if "address" in answer else "unresolved")
        else:
            sys.exit("usage: client.py tcp|udp <address> <port> | client.py dns <name>")
    except socket.timeout:
        print("blocked")
    except ConnectionRefusedError:
        print("refused")
    except OSError as error:
        print("error " + str(error))
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger
  namespace: starfleet-031-010-03-04
  labels:
    app: ledger
spec:
  containers:
  - name: app
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - /app/server.py
    env:
    - name: SERVER_NAME
      value: ledger
    - name: TCP_PORTS
      value: '7070'
    - name: UDP_PORTS
      value: ''
    ports:
    - containerPort: 7070
      protocol: TCP
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
    - name: code
      mountPath: /app
      readOnly: true
    readinessProbe:
      tcpSocket:
        port: 7070
      periodSeconds: 2
  volumes:
  - name: code
    configMap:
      name: server-code
  terminationGracePeriodSeconds: 1
---
