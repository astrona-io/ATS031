apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-03-05
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: tcp-port-range
    description: The surveyor pod reaches the meter pod on TCP 7000 to 7002 through one endPort range, and the loiterer pod times out
    type: file
    source: validation/validate-tcp-port-range.sh
    points: 1
  - name: udp-named-port
    description: The surveyor pod gets a UDP reply on the port named tick, and TCP 7100 stays closed
    type: file
    source: validation/validate-udp-named-port.sh
    points: 1
