apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-010-03-06
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: service-port-repaired
    description: The visitor pod reaches the kiosk Service on port 80 and every kiosk replica on TCP 8080
    type: file
    source: validation/validate-service-port-repaired.sh
    points: 1
  - name: metrics-range
    description: The collector pod reaches TCP 9100 to 9102 on every kiosk replica through one endPort range, and nothing else is opened
    type: file
    source: validation/validate-metrics-range.sh
    points: 1
