<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="title desc">
  <title id="title">One peer entry versus two peer entries</title>
  <desc id="desc">With two entries in the from list, the selectors combine with OR: the shuttle and drifter pods in outpost and the shuttle pod in starfleet are allowed, and only the shuttle pod in dock times out. With one entry that holds both selectors, they combine with AND: only the shuttle pod in outpost is allowed.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="198" x2="810" y2="198"/>
  <line class="sep" x1="30" y1="248" x2="810" y2="248"/>
  <line class="sep" x1="30" y1="298" x2="810" y2="298"/>
  <text class="strong" x="440" y="36" text-anchor="middle">Two entries: OR</text>
  <text class="strong" x="690" y="36" text-anchor="middle">One entry: AND</text>
  <rect class="box" x="325" y="50" width="230" height="64" rx="8"/>
  <text class="code" x="352" y="77">- namespaceSelector</text>
  <text class="code" x="352" y="99">- podSelector</text>
  <rect class="box" x="575" y="50" width="230" height="64" rx="8"/>
  <text class="code" x="602" y="77">- namespaceSelector</text>
  <text class="code" x="617.6" y="99">podSelector</text>
  <text class="label" x="30" y="140">Client pod</text>
  <text x="30" y="170"><tspan class="code">shuttle</tspan> in <tspan class="code">outpost</tspan></text>
  <text class="label" x="30" y="188">right label, right namespace</text>
  <rect class="ok" x="370" y="154" width="140" height="32" rx="8"/>
  <text class="good" x="440" y="175" text-anchor="middle">allowed</text>
  <rect class="ok" x="620" y="154" width="140" height="32" rx="8"/>
  <text class="good" x="690" y="175" text-anchor="middle">allowed</text>
  <text x="30" y="220"><tspan class="code">drifter</tspan> in <tspan class="code">outpost</tspan></text>
  <text class="label" x="30" y="238">right namespace, wrong label</text>
  <rect class="ok" x="370" y="204" width="140" height="32" rx="8"/>
  <text class="good" x="440" y="225" text-anchor="middle">allowed</text>
  <rect class="drop" x="620" y="204" width="140" height="32" rx="8"/>
  <text class="bad" x="690" y="225" text-anchor="middle">timeout</text>
  <text x="30" y="270"><tspan class="code">shuttle</tspan> in <tspan class="code">starfleet</tspan></text>
  <text class="label" x="30" y="288">right label, wrong namespace</text>
  <rect class="ok" x="370" y="254" width="140" height="32" rx="8"/>
  <text class="good" x="440" y="275" text-anchor="middle">allowed</text>
  <rect class="drop" x="620" y="254" width="140" height="32" rx="8"/>
  <text class="bad" x="690" y="275" text-anchor="middle">timeout</text>
  <text x="30" y="320"><tspan class="code">shuttle</tspan> in <tspan class="code">dock</tspan></text>
  <text class="label" x="30" y="338">neither matches</text>
  <rect class="drop" x="370" y="304" width="140" height="32" rx="8"/>
  <text class="bad" x="440" y="325" text-anchor="middle">timeout</text>
  <rect class="drop" x="620" y="304" width="140" height="32" rx="8"/>
  <text class="bad" x="690" y="325" text-anchor="middle">timeout</text>
  <text class="label bad" x="440" y="388" text-anchor="middle">Too wide: three clients get in</text>
  <text class="label good" x="690" y="388" text-anchor="middle">Strict: only the intended pod</text>
</svg>
