<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">A podSelector alone stays in the policy namespace</title>
  <desc id="desc">The policy in starfleet has a peer with only a podSelector for app: shuttle. The shuttle pod in starfleet reaches the probe pods on TCP port 8080. The shuttle pod in outpost has the same label but is in another namespace, so its request times out.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="20" width="300" height="250" rx="10"/>
  <rect class="frame" x="420" y="20" width="400" height="250" rx="10"/>
  <rect class="policy" x="440" y="56" width="360" height="94" rx="8"/>
  <path class="dashed" d="M280 138 L436 120" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M620 210 V150" marker-end="url(#arrowok)"/>
  <text class="label good" x="632" y="186">allowed</text>
  <text class="label bad" x="330" y="118">timeout</text>
  <text class="label" x="36" y="44">namespace outpost</text>
  <rect class="box" x="60" y="110" width="220" height="56" rx="8"/>
  <text class="code" x="170" y="132" text-anchor="middle">shuttle</text>
  <text class="code" x="170" y="154" text-anchor="middle">app: shuttle</text>
  <text class="label bad" x="170" y="210" text-anchor="middle">Same label, wrong namespace</text>
  <text class="label" x="436" y="44">namespace starfleet</text>
  <text x="620" y="78" text-anchor="middle">peer: <tspan class="code">podSelector</tspan> only</text>
  <rect class="ok" x="500" y="88" width="240" height="46" rx="8"/>
  <text x="620" y="116" text-anchor="middle"><tspan class="code">probe</tspan> pods, TCP port 8080</text>
  <rect class="box" x="520" y="210" width="200" height="46" rx="8"/>
  <text class="code" x="620" y="238" text-anchor="middle">shuttle</text>
</svg>
