<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The playground namespaces and workloads</title>
  <desc id="desc">The starfleet and outpost namespaces each run a probe Service on port 80 that forwards to two probe pods on port 8080, plus a shuttle and a drifter client pod. The dock namespace runs a shuttle client pod and the telemetry pod, which listens on TCP port 9000 named feed and UDP port 9001 named pulse.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="20" width="260" height="290" rx="10"/>
  <rect class="frame" x="290" y="20" width="260" height="290" rx="10"/>
  <rect class="frame" x="560" y="20" width="260" height="290" rx="10"/>
  <path class="line" d="M150 114 V148" marker-end="url(#arrow)"/>
  <text class="label" x="160" y="136">to port 8080</text>
  <text class="label" x="36" y="44">namespace starfleet</text>
  <rect class="box" x="40" y="62" width="220" height="52" rx="8"/>
  <text x="150" y="93" text-anchor="middle">Service <tspan class="code">probe</tspan>, port 80</text>
  <rect class="ok" x="40" y="150" width="220" height="64" rx="8"/>
  <text x="150" y="176" text-anchor="middle">two <tspan class="code">probe</tspan> pods</text>
  <text class="code" x="150" y="198" text-anchor="middle">app: probe, port 8080</text>
  <rect class="box" x="40" y="240" width="105" height="48" rx="8"/>
  <text class="code" x="92.5" y="269" text-anchor="middle">shuttle</text>
  <rect class="box" x="155" y="240" width="105" height="48" rx="8"/>
  <text class="code" x="207.5" y="269" text-anchor="middle">drifter</text>
  <path class="line" d="M420 114 V148" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="136">to port 8080</text>
  <text class="label" x="306" y="44">namespace outpost</text>
  <rect class="box" x="310" y="62" width="220" height="52" rx="8"/>
  <text x="420" y="93" text-anchor="middle">Service <tspan class="code">probe</tspan>, port 80</text>
  <rect class="ok" x="310" y="150" width="220" height="64" rx="8"/>
  <text x="420" y="176" text-anchor="middle">two <tspan class="code">probe</tspan> pods</text>
  <text class="code" x="420" y="198" text-anchor="middle">app: probe, port 8080</text>
  <rect class="box" x="310" y="240" width="105" height="48" rx="8"/>
  <text class="code" x="362.5" y="269" text-anchor="middle">shuttle</text>
  <rect class="box" x="425" y="240" width="105" height="48" rx="8"/>
  <text class="code" x="477.5" y="269" text-anchor="middle">drifter</text>
  <text class="label" x="576" y="44">namespace dock</text>
  <rect class="box" x="580" y="62" width="220" height="52" rx="8"/>
  <text x="690" y="93" text-anchor="middle"><tspan class="code">shuttle</tspan> client pod</text>
  <rect class="ok" x="580" y="150" width="220" height="90" rx="8"/>
  <text class="code" x="690" y="178" text-anchor="middle">telemetry</text>
  <text x="690" y="200" text-anchor="middle">TCP 9000, named feed</text>
  <text x="690" y="222" text-anchor="middle">UDP 9001, named pulse</text>
</svg>
