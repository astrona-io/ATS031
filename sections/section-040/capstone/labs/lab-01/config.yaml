apiVersion: astrona.io/v1
metadata:
  name: ats-031-capstone-040
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/curlimages/curl:8.11.1
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: metadata-blocked
    description: Only agent reaches 169.254.169.254; shuttle, drifter and tender are denied
    type: file
    source: validation/validate-metadata-blocked.sh
    points: 1
  - name: kubelet-ports-blocked
    description: No client pod reaches port 10250 on either node or port 10255 on the worker
    type: file
    source: validation/validate-kubelet-ports-blocked.sh
    points: 2
  - name: runtime-socket-removed
    description: runtime-peek no longer mounts the runtime socket and stays rolled out
    type: file
    source: validation/validate-runtime-socket-removed.sh
    points: 1
