apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: Namespace
metadata:
  name: dock
---
apiVersion: v1
kind: Namespace
metadata:
  name: metadata-stub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-imds-code
  namespace: metadata-stub
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # FAKE metadata server for a training playground. Every value is invented.
    CREDENTIALS = {
        "Code": "Success",
        "Type": "FAKE-PLAYGROUND-CREDENTIAL",
        "AccessKeyId": "FAKEKEYFAKEKEYFAKE00",
        "SecretAccessKey": "fake-secret-not-a-real-key",
        "Token": "fake-session-token-not-real",
        "Expiration": "2099-01-01T00:00:00Z",
        "Note": "This is fake data from the training playground",
    }
    PAGES = {
        "/latest/meta-data/": "ami-id
    instance-id
    hostname
    iam/
    ",
        "/latest/meta-data/ami-id": "ami-fake00000000
    ",
        "/latest/meta-data/instance-id": "i-fake0000000000000
    ",
        "/latest/meta-data/hostname": "fake-node.playground.invalid
    ",
        "/latest/meta-data/iam/security-credentials/": "fake-node-role
    ",
        "/latest/meta-data/iam/security-credentials/fake-node-role": json.dumps(CREDENTIALS, indent=2) + "
    ",
    }


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = PAGES.get(self.path)
            status = 200 if body is not None else 404
            data = (body if body is not None else "not found
    ").encode()
            self.send_response(status)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)


    HTTPServer((os.environ["BIND_ADDRESS"], int(os.environ.get("PORT", "80"))), Handler).serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: fake-imds
  namespace: metadata-stub
  labels:
    app: fake-imds
spec:
  hostNetwork: true
  restartPolicy: Always
  containers:
  - name: server
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - /app/server.py
    env:
    - name: BIND_ADDRESS
      value: 169.254.169.254
    - name: PORT
      value: '80'
    readinessProbe:
      httpGet:
        host: 169.254.169.254
        path: /latest/meta-data/
        port: 80
      periodSeconds: 2
    volumeMounts:
    - name: code
      mountPath: /app
      readOnly: true
  volumes:
  - name: code
    configMap:
      name: fake-imds-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - -m
        - http.server
        - '8080'
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
