apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-peek
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-peek
  template:
    metadata:
      labels:
        app: runtime-peek
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: client
        image: docker.io/curlimages/curl:8.11.1
        command:
        - sleep
        - '7200'
        volumeMounts:
        - name: runtime-socket
          mountPath: /run/containerd/containerd.sock
      volumes:
      - name: runtime-socket
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
