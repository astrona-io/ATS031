apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-031-040-01-02
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-031-040-01-02
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet-031-040-01-02
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import os
    import socket


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-031-040-01-02
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-031-040-01-02
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
# The stand-in for a metadata endpoint: a web server reached by its pod IP.
apiVersion: v1
kind: Pod
metadata:
  name: metadata-simulator
  namespace: starfleet-031-040-01-02
  labels:
    app: metadata-simulator
spec:
  containers:
  - name: web
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -m
    - http.server
    - '8080'
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: courier
  namespace: starfleet-031-040-01-02
  labels:
    app: courier
spec:
  containers:
  - name: client
    image: docker.io/curlimages/curl:8.11.1
    command:
    - sleep
    - '7200'
---
# A web server in another namespace that courier does not need.
apiVersion: v1
kind: Pod
metadata:
  name: beacon
  namespace: outpost-031-040-01-02
  labels:
    app: beacon
spec:
  containers:
  - name: web
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -m
    - http.server
    - '8080'
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-031-040-01-02
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: docker.io/curlimages/curl:8.11.1
    command:
    - sleep
    - '7200'
