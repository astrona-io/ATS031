<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Workload identity and node identity are separate</title>
  <desc id="desc">The pod uses its ServiceAccount, and RBAC decides what it may do in the Kubernetes API. The node has its own cloud identity, and the provider decides what it may do. A request from the pod to the metadata service returns node credentials, so the pod gains the node's authority, which RBAC never checks.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <text class="strong" x="30" y="34">Workload identity</text>
  <text class="strong" x="220" y="184">Node identity</text>
  <line class="sep" x1="30" y1="134" x2="810" y2="134"/>

  <path class="line" d="M180 74 H218" marker-end="url(#arrow)"/>
  <path class="line" d="M380 74 H438" marker-end="url(#arrow)"/>
  <path class="okline" d="M590 74 H638" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M105 98 V198" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="115" y="160">HTTP request</text>
  <path class="dashed" d="M180 224 H218" marker-end="url(#arrowbad)"/>
  <path class="line" d="M380 224 H438" marker-end="url(#arrow)"/>
  <path class="okline" d="M590 224 H638" marker-end="url(#arrowok)"/>

  <rect class="box" x="30" y="52" width="150" height="44" rx="8"/>
  <text x="105" y="79" text-anchor="middle">Pod</text>
  <rect class="box" x="220" y="52" width="160" height="44" rx="8"/>
  <text x="300" y="79" text-anchor="middle">ServiceAccount</text>
  <rect class="ask" x="440" y="52" width="150" height="44" rx="8"/>
  <text x="515" y="79" text-anchor="middle">RBAC check</text>
  <rect class="box" x="640" y="52" width="170" height="44" rx="8"/>
  <text x="725" y="79" text-anchor="middle">Kubernetes API</text>

  <rect class="box" x="30" y="202" width="150" height="44" rx="8"/>
  <text x="105" y="229" text-anchor="middle">Metadata service</text>
  <rect class="drop" x="220" y="202" width="160" height="44" rx="8"/>
  <text x="300" y="229" text-anchor="middle">Node credentials</text>
  <rect class="ask" x="440" y="202" width="150" height="44" rx="8"/>
  <text x="515" y="229" text-anchor="middle">Provider check</text>
  <rect class="box" x="640" y="194" width="170" height="60" rx="8"/>
  <text x="725" y="218" text-anchor="middle">Registry, disks,</text>
  <text x="725" y="240" text-anchor="middle">storage</text>

  <text class="label" x="30" y="284">Cutting the ServiceAccount's RBAC permissions does not change the bottom row.</text>
</svg>
