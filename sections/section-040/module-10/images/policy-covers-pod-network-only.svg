<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">A NetworkPolicy filters only the pod network</title>
  <desc id="desc">The shuttle pod sends traffic through its pod interface, where Calico enforces NetworkPolicy, so the policy applies. A host-network pod and a process on the node share the node's network namespace, so a pod policy does not select them and their traffic reaches the destination without that filter.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <rect class="frame" x="20" y="30" width="560" height="280" rx="10"/>
  <text class="label" x="36" y="52">node</text>

  <path class="okline" d="M190 96 H248" marker-end="url(#arrowok)"/>
  <path class="okline" d="M410 96 H638" marker-end="url(#arrowok)"/>
  <text class="label good" x="525" y="86" text-anchor="middle">policy applies</text>
  <path class="line" stroke-dasharray="6 5" d="M240 206 H638" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="196" text-anchor="middle">not selected by pod policy</text>
  <path class="line" stroke-dasharray="6 5" d="M240 272 H638" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="262" text-anchor="middle">not selected by pod policy</text>

  <rect class="box" x="50" y="74" width="140" height="44" rx="8"/>
  <text x="120" y="101" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <rect class="policy" x="250" y="66" width="160" height="60" rx="8"/>
  <text x="330" y="91" text-anchor="middle">Calico filter</text>
  <text x="330" y="112" text-anchor="middle">on pod interface</text>

  <rect class="box" x="50" y="184" width="190" height="44" rx="8"/>
  <text x="145" y="211" text-anchor="middle">host-network pod</text>
  <rect class="box" x="50" y="250" width="190" height="44" rx="8"/>
  <text x="145" y="277" text-anchor="middle">process on the node</text>

  <rect class="box" x="640" y="66" width="180" height="228" rx="8"/>
  <text x="730" y="176" text-anchor="middle">Destination</text>
  <text x="730" y="198" text-anchor="middle">address and port</text>
</svg>
