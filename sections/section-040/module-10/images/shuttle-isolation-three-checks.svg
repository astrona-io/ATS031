<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Three checks prove the shuttle-isolation boundary</title>
  <desc id="desc">The shuttle-isolation egress policy selects the shuttle pod. Check 1: shuttle to metadata-simulator times out. Check 2: drifter in outpost still gets the listing from metadata-simulator, so the server works. Check 3: shuttle reaches the probe pods on port 8080 through the probe Service, after a DNS lookup to CoreDNS on port 53, so the allowed dependencies still work.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <rect class="frame" x="20" y="30" width="560" height="230" rx="10"/>
  <text class="label" x="36" y="52">namespace starfleet</text>
  <rect class="frame" x="610" y="30" width="230" height="100" rx="10"/>
  <text class="label" x="626" y="52">namespace outpost</text>
  <rect class="frame" x="20" y="290" width="270" height="110" rx="10"/>
  <text class="label" x="36" y="390">namespace kube-system</text>

  <path class="dashed" d="M182 124 L358 84" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="262" y="90" text-anchor="middle">1</text>
  <path class="okline" d="M650 90 H562" marker-end="url(#arrowok)"/>
  <text class="label good" x="628" y="82" text-anchor="middle">2</text>
  <path class="okline" d="M182 150 L358 196" marker-end="url(#arrowok)"/>
  <text class="label good" x="262" y="186" text-anchor="middle">3</text>
  <path class="okline" d="M115 170 V306" marker-end="url(#arrowok)"/>
  <text class="label good" x="125" y="240">DNS</text>

  <rect class="policy" x="38" y="76" width="154" height="94" rx="10"/>
  <text class="code" x="115" y="96" text-anchor="middle">shuttle-isolation</text>
  <rect class="box" x="50" y="114" width="130" height="44" rx="8"/>
  <text x="115" y="141" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>

  <rect class="box" x="360" y="62" width="200" height="56" rx="8"/>
  <text class="code" x="460" y="86" text-anchor="middle">metadata-simulator</text>
  <text x="460" y="107" text-anchor="middle">port 8080</text>
  <rect class="box" x="360" y="170" width="200" height="56" rx="8"/>
  <text x="460" y="194" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>
  <text x="460" y="215" text-anchor="middle">port 8080</text>

  <rect class="box" x="650" y="68" width="150" height="44" rx="8"/>
  <text x="725" y="95" text-anchor="middle"><tspan class="code">drifter</tspan> pod</text>

  <rect class="box" x="50" y="308" width="200" height="56" rx="8"/>
  <text x="150" y="332" text-anchor="middle">CoreDNS</text>
  <text x="150" y="353" text-anchor="middle">port 53, UDP and TCP</text>

  <text x="330" y="310"><tspan class="bad strong">1</tspan>  <tspan class="code">shuttle</tspan> to <tspan class="code">metadata-simulator</tspan>: timeout</text>
  <text x="330" y="338"><tspan class="good strong">2</tspan>  <tspan class="code">drifter</tspan> to <tspan class="code">metadata-simulator</tspan>: listing</text>
  <text x="330" y="366"><tspan class="good strong">3</tspan>  <tspan class="code">shuttle</tspan> to <tspan class="code">probe</tspan> Service: response</text>
  <text class="label" x="330" y="394">Run each check on its own, not chained with &amp;&amp;.</text>
</svg>
