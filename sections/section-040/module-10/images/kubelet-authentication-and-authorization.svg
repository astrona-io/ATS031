<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="title desc">
  <title id="title">How the kubelet checks a caller on port 10250</title>
  <desc id="desc">A caller reaches the kubelet API on port 10250. Authentication first decides whether an anonymous caller is accepted and who the caller is. Authorization then decides what the caller may do. With the Webhook mode the kubelet asks the API server, so RBAC applies. With AlwaysAllow every authenticated caller may do everything.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M140 150 H178" marker-end="url(#arrow)"/>
  <path class="line" d="M360 150 H398" marker-end="url(#arrow)"/>
  <path class="okline" d="M560 136 H585 V80 H608" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M560 164 H585 V222 H608" marker-end="url(#arrowbad)"/>

  <rect class="box" x="30" y="128" width="110" height="44" rx="8"/>
  <text x="85" y="155" text-anchor="middle">Caller</text>

  <rect class="ask" x="180" y="114" width="180" height="72" rx="8"/>
  <text class="strong" x="270" y="140" text-anchor="middle">Authentication</text>
  <text x="270" y="164" text-anchor="middle">Who is the caller?</text>

  <rect class="ask" x="400" y="114" width="160" height="72" rx="8"/>
  <text class="strong" x="480" y="140" text-anchor="middle">Authorization</text>
  <text x="480" y="164" text-anchor="middle">What may it do?</text>

  <rect class="ok" x="610" y="48" width="220" height="64" rx="8"/>
  <text class="code" x="720" y="73" text-anchor="middle">Webhook</text>
  <text x="720" y="96" text-anchor="middle">API server applies RBAC</text>

  <rect class="drop" x="610" y="180" width="220" height="84" rx="8"/>
  <text class="code" x="720" y="204" text-anchor="middle">AlwaysAllow</text>
  <text x="720" y="227" text-anchor="middle">Every authenticated caller</text>
  <text x="720" y="248" text-anchor="middle">may do everything</text>

  <text class="label" x="270" y="214" text-anchor="middle">secure: anonymous off</text>
  <text class="label" x="30" y="284">A secure node has anonymous access off and Webhook authorization on.</text>
</svg>
