<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">A pod steals the node's cloud credentials</title>
  <desc id="desc">A pod with no Kubernetes rights sends a GET request without credentials to the metadata service at 169.254.169.254 port 80. The service returns the role credentials of the node. The pod then calls the cloud provider API, for example storage buckets or an image registry, as the node.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="780" height="150" rx="10"/>
  <text class="label" x="46" y="52">virtual machine (Kubernetes node)</text>

  <path class="line" d="M240 92 H496" marker-end="url(#arrow)"/>
  <text class="label" x="368" y="82" text-anchor="middle">1. GET, no credentials</text>
  <path class="dashed" d="M500 124 H244" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="372" y="146" text-anchor="middle">2. role credentials of the node</text>
  <path class="dashed" d="M150 132 V250 H286" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="162" y="210">3. API call as the node</text>

  <rect class="box" x="60" y="80" width="180" height="56" rx="8"/>
  <text x="150" y="104" text-anchor="middle">pod</text>
  <text x="150" y="124" text-anchor="middle" class="label">no Kubernetes rights</text>

  <rect class="ask" x="500" y="80" width="280" height="56" rx="8"/>
  <text x="640" y="104" text-anchor="middle">metadata service</text>
  <text x="640" y="124" text-anchor="middle" class="code">169.254.169.254:80</text>

  <rect class="drop" x="290" y="222" width="280" height="56" rx="8"/>
  <text x="430" y="246" text-anchor="middle">cloud provider API</text>
  <text x="430" y="266" text-anchor="middle" class="label">storage buckets, image registry</text>
</svg>
