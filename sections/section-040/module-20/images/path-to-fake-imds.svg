<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">The path from a client pod to fake-imds</title>
  <desc id="desc">On the worker node, a client pod such as shuttle, drifter or tender sends a request through its pod interface, where Calico checks egress policy. The node delivers the packet locally to the address 169.254.169.254/32 on its loopback interface lo, where the fake-imds pod listens on port 80 in the network of the node. The control plane node has a taint that keeps ordinary pods away.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="610" height="290" rx="10"/>
  <text class="label" x="46" y="52">worker node</text>
  <rect class="frame" x="400" y="66" width="224" height="238" rx="8"/>
  <text class="label" x="414" y="88">network of the node</text>

  <path class="line" d="M252 140 H262" marker-end="url(#arrow)"/>
  <path class="line" d="M378 140 H416" marker-end="url(#arrow)"/>
  <path class="line" d="M512 166 V218" marker-end="url(#arrow)"/>
  <text class="label" x="522" y="198">local delivery</text>

  <rect class="box" x="40" y="106" width="212" height="68" rx="8"/>
  <text x="146" y="132" text-anchor="middle">client pod</text>
  <text x="146" y="154" text-anchor="middle" class="code">shuttle, drifter, tender</text>

  <rect class="policy" x="266" y="100" width="112" height="80" rx="8"/>
  <text x="322" y="128" text-anchor="middle">pod interface</text>
  <text x="322" y="148" text-anchor="middle" class="label">Calico checks</text>
  <text x="322" y="166" text-anchor="middle" class="label">egress policy</text>

  <rect class="box" x="420" y="112" width="186" height="54" rx="8"/>
  <text x="513" y="134" text-anchor="middle" class="code">lo</text>
  <text x="513" y="154" text-anchor="middle" class="code">169.254.169.254/32</text>

  <rect class="ask" x="420" y="222" width="186" height="66" rx="8"/>
  <text x="513" y="246" text-anchor="middle" class="code">fake-imds</text>
  <text x="513" y="266" text-anchor="middle" class="label">hostNetwork, port 80</text>

  <rect class="frame" x="666" y="30" width="150" height="290" rx="10"/>
  <text class="label" x="680" y="52">control plane node</text>
  <text x="741" y="170" text-anchor="middle" class="label">taint keeps</text>
  <text x="741" y="190" text-anchor="middle" class="label">ordinary pods away</text>
</svg>
