<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">An ipBlock with an except entry</title>
  <desc id="desc">The block-metadata policy in the dock namespace selects every pod, such as tender, and allows the range 0.0.0.0/0 except 169.254.169.254/32. Requests to the probe Service, which returns 200, and to cluster DNS stay open. The request to 169.254.169.254 falls into the except entry, is dropped and returns 000.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="20" width="390" height="310" rx="10"/>
  <text class="label" x="46" y="42">namespace <tspan class="code">dock</tspan></text>

  <rect class="policy" x="236" y="56" width="160" height="260" rx="8"/>
  <text x="316" y="80" text-anchor="middle" class="code">block-metadata</text>
  <text x="316" y="98" text-anchor="middle" class="label">allows 0.0.0.0/0</text>

  <path class="okline" d="M200 136 H592" marker-end="url(#arrowok)"/>
  <path class="okline" d="M200 206 H592" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M200 276 H370" marker-end="url(#arrowbad)"/>
  <rect x="374" y="256" width="10" height="40" rx="2" fill="#c53030"/>
  <text class="label bad" x="492" y="266" text-anchor="middle">except</text>
  <text class="label bad code" x="492" y="286" text-anchor="middle">169.254.169.254/32</text>

  <rect class="box" x="50" y="116" width="150" height="180" rx="8"/>
  <text x="125" y="200" text-anchor="middle" class="code">tender</text>
  <text x="125" y="220" text-anchor="middle" class="label">any pod in dock</text>

  <rect class="ok" x="596" y="110" width="220" height="52" rx="8"/>
  <text x="706" y="141" text-anchor="middle"><tspan class="code">probe</tspan> Service: <tspan class="good strong">200</tspan></text>
  <rect class="ok" x="596" y="180" width="220" height="52" rx="8"/>
  <text x="706" y="211" text-anchor="middle">cluster DNS: open</text>
  <rect class="drop" x="596" y="250" width="220" height="52" rx="8"/>
  <text x="706" y="281" text-anchor="middle"><tspan class="code">169.254.169.254</tspan>: <tspan class="bad strong">000</tspan></text>
</svg>
