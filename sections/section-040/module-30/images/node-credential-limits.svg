<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" aria-labelledby="title desc">
  <title id="title">What a node credential may read and write</title>
  <desc id="desc">The node credential system:node:&lt;node name&gt; sends reads through the node authorizer, which allows the node's own pods and their Secrets and refuses Secrets of other nodes. It sends writes through the NodeRestriction admission plugin, which allows the node's own Node object and refuses other nodes and protected labels.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <path class="line" d="M230 170 H270 V88 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M230 190 H270 V272 H318" marker-end="url(#arrow)"/>
  <text class="label" x="294" y="80" text-anchor="middle">read</text>
  <text class="label" x="294" y="264" text-anchor="middle">write</text>

  <path class="okline" d="M500 80 H540 V52 H618" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M500 96 H540 V122 H618" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M500 264 H540 V236 H618" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M500 280 H540 V306 H618" marker-end="url(#arrowbad)"/>
  <text class="label good" x="580" y="44" text-anchor="middle">allowed</text>
  <text class="label bad" x="580" y="114" text-anchor="middle">refused</text>
  <text class="label good" x="580" y="228" text-anchor="middle">allowed</text>
  <text class="label bad" x="580" y="298" text-anchor="middle">refused</text>

  <rect class="box" x="20" y="148" width="210" height="64" rx="8"/>
  <text x="125" y="174" text-anchor="middle">node credential</text>
  <text class="code" x="125" y="196" text-anchor="middle">system:node:&lt;node name&gt;</text>

  <rect class="ask" x="320" y="60" width="180" height="56" rx="8"/>
  <text x="410" y="93" text-anchor="middle">node authorizer</text>
  <rect class="ask" x="320" y="244" width="180" height="56" rx="8"/>
  <text class="code" x="410" y="277" text-anchor="middle">NodeRestriction</text>

  <rect class="ok" x="620" y="30" width="220" height="44" rx="8"/>
  <text x="730" y="57" text-anchor="middle">own pods, their Secrets</text>
  <rect class="drop" x="620" y="100" width="220" height="44" rx="8"/>
  <text x="730" y="127" text-anchor="middle">Secrets of other nodes</text>
  <rect class="ok" x="620" y="214" width="220" height="44" rx="8"/>
  <text x="730" y="241" text-anchor="middle">own Node object</text>
  <rect class="drop" x="620" y="284" width="220" height="44" rx="8"/>
  <text x="730" y="311" text-anchor="middle">other nodes, protected labels</text>

</svg>
