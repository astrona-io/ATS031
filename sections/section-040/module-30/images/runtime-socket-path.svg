<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">From a pod to the container runtime through a socket</title>
  <desc id="desc">On the worker node, the runtime-peek pod runs as user 0 and mounts containerd.sock with a hostPath volume. It sends a request through the socket to containerd, which can start a new privileged container that mounts the node file system. The API server, RBAC and NetworkPolicy never see this request.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <rect class="frame" x="30" y="30" width="780" height="280" rx="10"/>
  <text class="label" x="46" y="54">Worker node</text>

  <path class="line" d="M260 102 H328" marker-end="url(#arrow)"/>
  <path class="line" d="M530 102 H598" marker-end="url(#arrow)"/>
  <path class="dashed" d="M690 134 V218" marker-end="url(#arrowbad)"/>
  <text class="label" x="294" y="90" text-anchor="middle">hostPath</text>
  <text class="label" x="564" y="90" text-anchor="middle">request</text>
  <text class="label bad" x="702" y="182">starts</text>

  <rect class="box" x="60" y="70" width="200" height="64" rx="8"/>
  <text x="160" y="96" text-anchor="middle"><tspan class="code">runtime-peek</tspan> pod</text>
  <text class="label" x="160" y="118" text-anchor="middle">runs as user 0</text>

  <rect class="ask" x="330" y="70" width="200" height="64" rx="8"/>
  <text class="code" x="430" y="96" text-anchor="middle">containerd.sock</text>
  <text class="label" x="430" y="118" text-anchor="middle">Unix socket file</text>

  <rect class="box" x="600" y="70" width="180" height="64" rx="8"/>
  <text x="690" y="96" text-anchor="middle">containerd</text>
  <text class="label" x="690" y="118" text-anchor="middle">container runtime</text>

  <rect class="drop" x="560" y="220" width="220" height="64" rx="8"/>
  <text x="670" y="246" text-anchor="middle">new privileged container</text>
  <text class="label" x="670" y="268" text-anchor="middle">mounts the node file system</text>

  <rect class="box" x="60" y="220" width="420" height="64" rx="8" opacity="0.55"/>
  <text x="270" y="246" text-anchor="middle" opacity="0.7">API server, RBAC, NetworkPolicy</text>
  <text class="label" x="270" y="268" text-anchor="middle">never see the request</text>

</svg>
