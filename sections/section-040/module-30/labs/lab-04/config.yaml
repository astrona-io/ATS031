apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-040-03-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/curlimages/curl:8.11.1
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: host-network-listed
    description: The ConfigMap host-network-pods lists exactly the pods in the two namespaces that use the host network
    type: file
    source: validation/validate-host-network-listed.sh
    points: 2
  - name: admission-blocks-host-network
    description: The dock namespace enforces the baseline Pod Security level, so a new hostNetwork pod is rejected and an ordinary pod is accepted
    type: file
    source: validation/validate-admission-blocks-host-network.sh
    points: 2
