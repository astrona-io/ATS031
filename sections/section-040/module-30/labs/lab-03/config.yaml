apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-040-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/curlimages/curl:8.11.1
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: socket-removed
    description: The image-scanner Deployment template mounts no container runtime path
    type: file
    source: validation/validate-socket-removed.sh
    points: 1
  - name: socket-hidden
    description: The running image-scanner pod mounts no container runtime path and cannot see the containerd socket
    type: file
    source: validation/validate-socket-hidden.sh
    points: 1
  - name: runs-as-non-root
    description: The image-scanner container sets runAsNonRoot and its process does not run as user id 0
    type: file
    source: validation/validate-runs-as-non-root.sh
    points: 1
