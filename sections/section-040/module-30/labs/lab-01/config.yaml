apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-040-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/curlimages/curl:8.11.1
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: config-closed
    description: The kubelet configuration file on the worker sets readOnlyPort to 0 or leaves it out
    type: file
    source: validation/validate-config-closed.sh
    points: 1
  - name: port-closed
    description: The running worker kubelet uses no read-only port and port 10255 does not answer, while port 10250 still serves
    type: file
    source: validation/validate-port-closed.sh
    points: 2
