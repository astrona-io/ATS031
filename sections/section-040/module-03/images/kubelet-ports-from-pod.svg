<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Both kubelet ports seen from a pod</title>
  <desc id="desc">The shuttle pod in the starfleet namespace sends a request with no credential to the worker node. The kubelet HTTPS port 10250 has anonymous access off and answers 401 Unauthorized. The read-only HTTP port 10255 needs no authentication and answers 200 with the pod list of the node.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <rect class="frame" x="30" y="40" width="230" height="220" rx="10"/>
  <text class="label" x="46" y="64">Namespace <tspan class="code">starfleet</tspan></text>
  <rect class="frame" x="440" y="40" width="370" height="220" rx="10"/>
  <text class="label" x="456" y="64">Worker node, <tspan class="code">$WORKER_IP</tspan></text>

  <path class="line" d="M230 140 H330 V102 H468" marker-end="url(#arrow)"/>
  <path class="line" d="M230 164 H330 V202 H468" marker-end="url(#arrow)"/>
  <text class="label good" x="392" y="92" text-anchor="middle">401 refused</text>
  <text class="label bad" x="392" y="192" text-anchor="middle">200 + pod list</text>

  <rect class="box" x="60" y="120" width="170" height="64" rx="8"/>
  <text x="145" y="146" text-anchor="middle"><tspan class="code">shuttle</tspan> pod</text>
  <text class="label" x="145" y="168" text-anchor="middle">no credential</text>

  <rect class="ok" x="470" y="72" width="310" height="60" rx="8"/>
  <text x="625" y="97" text-anchor="middle">kubelet HTTPS, port <tspan class="code">10250</tspan></text>
  <text class="label" x="625" y="119" text-anchor="middle">anonymous access off</text>

  <rect class="drop" x="470" y="172" width="310" height="60" rx="8"/>
  <text x="625" y="197" text-anchor="middle">kubelet read-only HTTP, port <tspan class="code">10255</tspan></text>
  <text class="label" x="625" y="219" text-anchor="middle">no authentication</text>

</svg>
