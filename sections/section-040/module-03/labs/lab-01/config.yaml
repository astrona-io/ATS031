apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-040-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/curlimages/curl:8.11.1
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: kubelet-https-port
    description: drifter cannot reach port 10250 on either node
    type: file
    source: validation/validate-kubelet-https-port.sh
    points: 1
  - name: kubelet-read-only-port
    description: drifter cannot reach port 10255 on the worker
    type: file
    source: validation/validate-kubelet-read-only-port.sh
    points: 1
  - name: whole-namespace
    description: An egress policy selects every pod in drifter's namespace
    type: file
    source: validation/validate-whole-namespace.sh
    points: 1
