<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">A host network pod bypasses pod policy</title>
  <desc id="desc">On the worker node, the block-metadata policy selects every pod in the outpost namespace. The drifter pod sends its request through its pod interface, where the policy drops it, so it prints 000. The hostnet-client pod sets hostNetwork to true, sends from the network of the node, meets no policy check and gets 200 from 169.254.169.254.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="20" width="780" height="300" rx="10"/>
  <text class="label" x="46" y="42">worker node</text>
  <rect class="frame" x="50" y="56" width="230" height="244" rx="8"/>
  <text class="label" x="64" y="78">namespace <tspan class="code">outpost</tspan></text>

  <path class="dashed" d="M250 120 H540" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M250 240 H470 C 530 240, 540 206, 596 206" marker-end="url(#arrowok)"/>
  <text class="label good" x="300" y="230">200, no policy check</text>
  <text class="label" x="300" y="262">sends from the network of the node</text>

  <rect class="box" x="70" y="94" width="180" height="52" rx="8"/>
  <text x="160" y="125" text-anchor="middle" class="code">drifter</text>

  <rect class="policy" x="330" y="90" width="170" height="60" rx="8"/>
  <text x="415" y="114" text-anchor="middle">pod interface</text>
  <text x="415" y="134" text-anchor="middle" class="code">block-metadata</text>
  <rect x="544" y="96" width="10" height="48" rx="2" fill="#c53030"/>
  <text class="label bad" x="566" y="125">000, dropped</text>

  <rect class="box" x="70" y="208" width="180" height="64" rx="8"/>
  <text x="160" y="234" text-anchor="middle" class="code">hostnet-client</text>
  <text x="160" y="256" text-anchor="middle" class="code">hostNetwork: true</text>

  <rect class="ask" x="600" y="176" width="190" height="60" rx="8"/>
  <text x="695" y="201" text-anchor="middle" class="code">169.254.169.254</text>
  <text x="695" y="221" text-anchor="middle" class="label">fake-imds</text>
</svg>
