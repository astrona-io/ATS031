apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-040-02-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/curlimages/curl:8.11.1
    nodes:
      workers: 1
    addons:
      cni: calico
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: starfleet-repaired
    description: Every pod in the starfleet namespace, including a new one, is blocked from 169.254.169.254 and still reaches the probe Service
    type: file
    source: validation/validate-starfleet-repaired.sh
    points: 2
  - name: outpost-repaired
    description: Every pod in the outpost namespace, including a new one, is blocked from 169.254.169.254 and still reaches the probe Service
    type: file
    source: validation/validate-outpost-repaired.sh
    points: 2
  - name: dock-repaired
    description: Every pod in the dock namespace, including a new one, is blocked from 169.254.169.254 and still reaches the probe Service
    type: file
    source: validation/validate-dock-repaired.sh
    points: 2
