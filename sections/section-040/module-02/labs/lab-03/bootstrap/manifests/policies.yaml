# Three metadata policies that look right but do not do their job.
# starfleet: allows 0.0.0.0/0 with no except entry, so the address stays open.
# outpost: the except entry has a typo (196 instead of 169), so the address stays open.
# dock: allows only DNS, so the address is closed but every Service request fails.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metadata-guard
  namespace: starfleet-031-040-02-03
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metadata-guard
  namespace: outpost-031-040-02-03
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.196.254/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metadata-guard
  namespace: dock-031-040-02-03
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
