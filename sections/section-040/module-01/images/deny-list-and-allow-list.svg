<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">A deny-list blocks only what it names, an allow-list blocks everything it does not name</title>
  <desc id="desc">With a deny-list the shuttle pod is blocked from the one metadata address in the except list, but an IPv6 form or a second endpoint stays open. With an allow-list the shuttle pod reaches only cluster DNS and the probe pods, and the metadata address and every other address are dropped.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <line class="sep" x1="420" y1="20" x2="420" y2="360"/>
  <text class="strong" x="30" y="36">Deny-list</text>
  <text class="strong" x="440" y="36">Allow-list</text>

  <path class="dashed" d="M140 190 L228 100" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M140 190 H228" marker-end="url(#arrowok)"/>
  <path class="okline" d="M140 190 L228 280" marker-end="url(#arrowok)"/>

  <path class="okline" d="M550 190 L638 76" marker-end="url(#arrowok)"/>
  <path class="okline" d="M550 190 L638 154" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M550 190 L638 232" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M550 190 L638 310" marker-end="url(#arrowbad)"/>

  <rect class="box" x="30" y="168" width="110" height="44" rx="8"/>
  <text x="85" y="195" text-anchor="middle"><tspan class="code">shuttle</tspan></text>
  <rect class="drop" x="230" y="78" width="170" height="44" rx="8"/>
  <text x="315" y="105" text-anchor="middle">listed address</text>
  <rect class="ask" x="230" y="168" width="170" height="44" rx="8"/>
  <text x="315" y="195" text-anchor="middle">IPv6 form</text>
  <rect class="ask" x="230" y="258" width="170" height="44" rx="8"/>
  <text x="315" y="285" text-anchor="middle">second endpoint</text>
  <text class="label" x="30" y="360">Still open: every address you did not list.</text>

  <rect class="box" x="440" y="168" width="110" height="44" rx="8"/>
  <text x="495" y="195" text-anchor="middle"><tspan class="code">shuttle</tspan></text>
  <rect class="ok" x="640" y="54" width="180" height="44" rx="8"/>
  <text x="730" y="81" text-anchor="middle">cluster DNS, port 53</text>
  <rect class="ok" x="640" y="132" width="180" height="44" rx="8"/>
  <text x="730" y="159" text-anchor="middle"><tspan class="code">probe</tspan> pods, 8080</text>
  <rect class="drop" x="640" y="210" width="180" height="44" rx="8"/>
  <text x="730" y="237" text-anchor="middle">metadata address</text>
  <rect class="drop" x="640" y="288" width="180" height="44" rx="8"/>
  <text x="730" y="315" text-anchor="middle">any other address</text>
  <text class="label" x="440" y="360">Blocked: every address you did not list.</text>
</svg>
