<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Three routes from a pod to authority outside the Kubernetes API</title>
  <desc id="desc">A pod can send HTTP to the metadata service on 169.254.169.254 and get node cloud credentials, send HTTPS to the kubelet API on the node IP and port 10250 to exec, read logs and list pods, or use a hostPath volume to reach the runtime socket and control all containers.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>


  <text class="label" x="95" y="26" text-anchor="middle">pod</text>
  <text class="label" x="420" y="26" text-anchor="middle">endpoint and route</text>
  <text class="label" x="705" y="26" text-anchor="middle">authority it gives</text>

  <path class="line" d="M160 184 H240 V74 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M160 184 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M240 184 V294 H318" marker-end="url(#arrow)"/>
  <path class="dashed" d="M520 74 H598" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M520 184 H598" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M520 294 H598" marker-end="url(#arrowbad)"/>

  <rect class="box" x="30" y="162" width="130" height="44" rx="8"/>
  <text x="95" y="189" text-anchor="middle">Pod</text>

  <rect class="box" x="320" y="44" width="200" height="60" rx="8"/>
  <text x="420" y="68" text-anchor="middle">Metadata service</text>
  <text class="code" x="420" y="90" text-anchor="middle">HTTP 169.254.169.254</text>

  <rect class="box" x="320" y="154" width="200" height="60" rx="8"/>
  <text x="420" y="178" text-anchor="middle">Kubelet API</text>
  <text class="code" x="420" y="200" text-anchor="middle">HTTPS node IP:10250</text>

  <rect class="box" x="320" y="264" width="200" height="60" rx="8"/>
  <text x="420" y="288" text-anchor="middle">Runtime socket</text>
  <text class="code" x="420" y="310" text-anchor="middle">hostPath volume</text>

  <rect class="drop" x="600" y="52" width="210" height="44" rx="8"/>
  <text x="705" y="79" text-anchor="middle">Node cloud credentials</text>
  <rect class="drop" x="600" y="162" width="210" height="44" rx="8"/>
  <text x="705" y="189" text-anchor="middle">Exec, logs, pod list</text>
  <rect class="drop" x="600" y="272" width="210" height="44" rx="8"/>
  <text x="705" y="299" text-anchor="middle">Control of all containers</text>
</svg>
