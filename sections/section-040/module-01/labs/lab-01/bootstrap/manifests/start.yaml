apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-031-040-01-01
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-031-040-01-01
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet-031-040-01-01
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import os
    import socket


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-031-040-01-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-031-040-01-01
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
# The stand-in for a metadata endpoint: a web server reached by its pod IP.
apiVersion: v1
kind: Pod
metadata:
  name: metadata-simulator
  namespace: starfleet-031-040-01-01
  labels:
    app: metadata-simulator
spec:
  containers:
  - name: web
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -m
    - http.server
    - '8080'
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-031-040-01-01
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: docker.io/curlimages/curl:8.11.1
    command:
    - sleep
    - '7200'
---
# relay uses the network namespace of the node, so the policy below does not select it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet-031-040-01-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: client
        image: docker.io/curlimages/curl:8.11.1
        command:
        - sleep
        - '86400'
---
# Every pod in the namespace may use DNS and the probe pods, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starfleet-egress
  namespace: starfleet-031-040-01-01
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: probe
    ports:
    - protocol: TCP
      port: 8080
