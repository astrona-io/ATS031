<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 345" width="840" height="345" role="img" aria-labelledby="title desc">
  <title id="title">One correct input and three mistakes</title>
  <desc id="desc">Only the line with the digest, two spaces and the name of a file in the current directory gives kubectl: OK and exit status 0. The published file passed as it is gives no properly formatted lines. A line with one space is improperly formatted. A missing file cannot be opened. Each mistake gives a nonzero exit status.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <text class="label" x="30" y="34" text-anchor="start">Input to sha256sum --check</text>
  <text class="label" x="440" y="34" text-anchor="start">Result</text>
  <path class="okline" d="M370 77 H438" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M370 152 H438" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M370 227 H438" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M370 302 H438" marker-end="url(#arrowbad)"/>
  <rect class="box" x="30" y="50" width="340" height="54" rx="8"/>
  <text class="code" x="46" y="73" text-anchor="start" xml:space="preserve">&lt;digest&gt;  kubectl</text>
  <text x="46" y="93" text-anchor="start" font-size="13">digest, two spaces, file name</text>
  <rect class="ok" x="440" y="50" width="370" height="54" rx="8"/>
  <text class="code" x="456" y="73" text-anchor="start">kubectl: OK</text>
  <text x="456" y="93" text-anchor="start" font-size="13">exit status 0</text>
  <rect class="box" x="30" y="125" width="340" height="54" rx="8"/>
  <text class="code" x="46" y="148" text-anchor="start" xml:space="preserve">&lt;digest&gt;</text>
  <text x="46" y="168" text-anchor="start" font-size="13">the published file as it is</text>
  <rect class="drop" x="440" y="125" width="370" height="54" rx="8"/>
  <text class="strong" x="456" y="148" text-anchor="start">No properly formatted lines</text>
  <text x="456" y="168" text-anchor="start" font-size="13">nonzero exit status, nothing checked</text>
  <rect class="box" x="30" y="200" width="340" height="54" rx="8"/>
  <text class="code" x="46" y="223" text-anchor="start" xml:space="preserve">&lt;digest&gt; kubectl</text>
  <text x="46" y="243" text-anchor="start" font-size="13">one space only</text>
  <rect class="drop" x="440" y="200" width="370" height="54" rx="8"/>
  <text class="strong" x="456" y="223" text-anchor="start">Improperly formatted line</text>
  <text x="456" y="243" text-anchor="start" font-size="13">nonzero exit status</text>
  <rect class="box" x="30" y="275" width="340" height="54" rx="8"/>
  <text class="code" x="46" y="298" text-anchor="start" xml:space="preserve">&lt;digest&gt;  kubectl</text>
  <text x="46" y="318" text-anchor="start" font-size="13">kubectl is not in the current directory</text>
  <rect class="drop" x="440" y="275" width="370" height="54" rx="8"/>
  <text class="strong" x="456" y="298" text-anchor="start">Could not open the file</text>
  <text x="456" y="318" text-anchor="start" font-size="13">nonzero exit status, not a mismatch</text>
</svg>
