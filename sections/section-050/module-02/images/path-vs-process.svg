<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The path and the process can point at different files</title>
  <desc id="desc">Inside the control plane node container, command -v kubelet leads to /usr/bin/kubelet, the file a shell would start. The kubelet process leads through /proc/pid/exe to the file the process runs. The two are normally the same file. If the file on disk was replaced after the start, the link ends with (deleted).</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="800" height="290" rx="10"/>
  <text class="label" x="36" y="44" text-anchor="start">control plane node container</text>
  <path class="line" d="M280 88 H358" marker-end="url(#arrow)"/>
  <path class="okline" d="M280 214 H358" marker-end="url(#arrowok)"/>
  <path class="line" d="M470 112 V188" stroke-dasharray="5 4"/>
  <rect class="box" x="50" y="64" width="230" height="48" rx="8"/>
  <text class="code" x="165" y="93" text-anchor="middle">command -v kubelet</text>
  <rect class="box" x="360" y="64" width="220" height="48" rx="8"/>
  <text class="code" x="470" y="93" text-anchor="middle">/usr/bin/kubelet</text>
  <text x="600" y="84" text-anchor="start">File a shell would start</text>
  <text x="600" y="104" text-anchor="start" font-size="13">(the file on disk now)</text>
  <rect class="box" x="50" y="190" width="230" height="48" rx="8"/>
  <text x="165" y="219" text-anchor="middle"><tspan class="code">kubelet</tspan> process</text>
  <rect class="ok" x="360" y="190" width="220" height="48" rx="8"/>
  <text class="code" x="470" y="219" text-anchor="middle">/proc/&lt;pid&gt;/exe</text>
  <text x="600" y="210" text-anchor="start">File the process runs</text>
  <text x="600" y="230" text-anchor="start" font-size="13">(the running program)</text>
  <text class="label" x="482" y="154" text-anchor="start">normally the same file</text>
  <text x="50" y="280" text-anchor="start">If the file on disk was replaced after the start, the link ends with <tspan class="code">(deleted)</tspan>.</text>
</svg>
