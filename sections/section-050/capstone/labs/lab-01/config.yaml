apiVersion: astrona.io/v1
metadata:
  name: ats-031-capstone-050
  docs:
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: approved-binaries
    description: The approved directory holds exactly the verified binary with its manifest digest
    type: file
    source: validation/validate-approved-binaries.sh
    points: 1
  - name: relay-pinned
    description: relay runs busybox pinned by digest and its pod runs that digest
    type: file
    source: validation/validate-relay-pinned.sh
    points: 2
  - name: verification-report
    description: ConfigMap verification-report records the signature, binaries, kubelet and pinned image
    type: file
    source: validation/validate-verification-report.sh
    points: 1
