<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Where the allowed-registry policy applies</title>
  <desc id="desc">Three server dry-run requests pass the allowed-registry policy and its allowed-registry-outpost binding. An image from registry.example.com in outpost is denied. A docker.io/library image in outpost is allowed. An image from registry.example.com in starfleet is allowed because the binding does not match that namespace.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M330 70 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M330 165 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M330 260 H378" marker-end="url(#arrow)"/>
  <path class="dashed" d="M580 70 H618" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M580 165 H618" marker-end="url(#arrowok)"/>
  <path class="okline" d="M580 260 H618" marker-end="url(#arrowok)"/>

  <rect class="box" x="30" y="40" width="300" height="60" rx="8"/>
  <text x="44" y="64">in <tspan class="code">outpost</tspan></text>
  <text x="44" y="86" class="code">registry.example.com/drifter:1.0</text>
  <rect class="box" x="30" y="135" width="300" height="60" rx="8"/>
  <text x="44" y="159">in <tspan class="code">outpost</tspan></text>
  <text x="44" y="181" class="code">docker.io/library/busybox:1.37.0</text>
  <rect class="box" x="30" y="230" width="300" height="60" rx="8"/>
  <text x="44" y="254">in <tspan class="code">starfleet</tspan></text>
  <text x="44" y="276" class="code">registry.example.com/drifter:1.0</text>

  <rect class="policy" x="380" y="40" width="200" height="250" rx="10"/>
  <text class="label" x="394" y="122">policy</text>
  <text x="394" y="142" class="code">allowed-registry</text>
  <text class="label" x="394" y="178">binding</text>
  <text x="394" y="198" class="code">allowed-registry-</text>
  <text x="394" y="216" class="code">outpost</text>

  <rect class="drop" x="620" y="48" width="200" height="44" rx="8"/>
  <text x="720" y="75" text-anchor="middle">denied</text>
  <rect class="ok" x="620" y="143" width="200" height="44" rx="8"/>
  <text x="720" y="163" text-anchor="middle">created (dry run)</text>
  <text x="720" y="180" text-anchor="middle" class="label">allowed registry</text>
  <rect class="ok" x="620" y="238" width="200" height="44" rx="8"/>
  <text x="720" y="258" text-anchor="middle">created (dry run)</text>
  <text x="720" y="275" text-anchor="middle" class="label">binding does not match</text>
  <text class="label" x="30" y="26">dry-run requests</text>
</svg>
