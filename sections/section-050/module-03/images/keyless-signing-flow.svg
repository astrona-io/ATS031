<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Keyless signing with Fulcio and Rekor</title>
  <desc id="desc">The signer logs in to the OIDC issuer and gets a token, sends the token to Fulcio and gets a short lived certificate, signs the artifact and drops the key, and writes a log entry to Rekor. The verifier checks the certificate against the Fulcio root, checks the Rekor log entry, and checks the signature with the expected identity and issuer.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M130 84 V168" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="132">login gives a token</text>
  <path class="line" d="M230 182 H328" marker-end="url(#arrow)"/>
  <text class="label" x="279" y="174" text-anchor="middle">OIDC token</text>
  <path class="okline" d="M330 204 H232" marker-end="url(#arrowok)"/>
  <text class="label good" x="279" y="226" text-anchor="middle">certificate</text>
  <path class="line" d="M80 214 V298" marker-end="url(#arrow)"/>
  <text class="label" x="88" y="262">signs, then</text>
  <text class="label" x="88" y="278">drops the key</text>
  <path class="line" d="M180 214 V250 H430 V298" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="270">log entry</text>
  <path class="line" d="M530 182 H725 V298" marker-end="url(#arrow)"/>
  <text class="label" x="735" y="250">Fulcio root</text>
  <path class="okline" d="M630 322 H532" marker-end="url(#arrowok)"/>
  <text class="label good" x="581" y="314" text-anchor="middle">checks</text>
  <path class="okline" d="M725 344 V372 H130 V346" marker-end="url(#arrowok)"/>
  <text class="label good" x="430" y="392" text-anchor="middle">checks signature, expected identity and expected issuer</text>

  <rect class="box" x="30" y="40" width="200" height="44" rx="8"/>
  <text x="130" y="67" text-anchor="middle">OIDC issuer</text>
  <rect class="box" x="30" y="170" width="200" height="44" rx="8"/>
  <text x="130" y="197" text-anchor="middle">signer</text>
  <rect class="ask" x="330" y="170" width="200" height="44" rx="8"/>
  <text x="430" y="197" text-anchor="middle">Fulcio</text>
  <rect class="box" x="30" y="300" width="200" height="44" rx="8"/>
  <text x="130" y="327" text-anchor="middle">artifact and signature</text>
  <rect class="ask" x="330" y="300" width="200" height="44" rx="8"/>
  <text x="430" y="327" text-anchor="middle">Rekor log</text>
  <rect class="ok" x="630" y="300" width="190" height="44" rx="8"/>
  <text x="725" y="327" text-anchor="middle">verifier</text>
  <text class="label" x="330" y="160">certificate authority</text>
  <text x="560" y="62">The certificate holds the identity</text>
  <text x="560" y="82">and the issuer, and is valid</text>
  <text x="560" y="102">for a few minutes.</text>
</svg>
