apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet-031-050-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
      - name: relay
        # Not in preloadImages on purpose: the kubelet pulls it from the registry,
        # so the pod reports a registry digest in its imageID.
        image: docker.io/library/busybox:1.36.1
        command:
        - sh
        - -c
        - sleep 3600
