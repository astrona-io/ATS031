<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">A forged manifest passes the checksum check</title>
  <desc id="desc">The attacker supplies kubectl-tampered and a forged manifest that holds its digest. You run sha256sum -c on the forged manifest. The result is OK, but nothing is proved about who wrote the manifest.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>



  <path class="dashed" d="M190 95 H368" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M190 205 H368" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="279" y="85" text-anchor="middle">tampered binary</text>
  <text class="label bad" x="279" y="195" text-anchor="middle">forged manifest</text>
  <path class="line" d="M560 95 H595 V205 H560"/>
  <path class="line" d="M595 150 H628" marker-end="url(#arrow)"/>
  <rect class="drop" x="20" y="60" width="170" height="180" rx="8"/>
  <text x="105" y="155" text-anchor="middle">Attacker</text>
  <rect class="box" x="370" y="70" width="190" height="50" rx="8"/>
  <text class="code" x="465" y="100" text-anchor="middle">kubectl-tampered</text>
  <rect class="box" x="370" y="180" width="190" height="50" rx="8"/>
  <text class="code" x="465" y="210" text-anchor="middle">forged-checksums.txt</text>
  <rect class="ask" x="630" y="115" width="190" height="70" rx="8"/>
  <text class="code" x="725" y="142" text-anchor="middle">sha256sum -c</text>
  <text x="725" y="168" text-anchor="middle">result: <tspan class="code">OK</tspan></text>
  <text class="label bad" x="725" y="210" text-anchor="middle">nothing is proved</text>
  <text class="label bad" x="725" y="228" text-anchor="middle">about who wrote it</text>
</svg>
