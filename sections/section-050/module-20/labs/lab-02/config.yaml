apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-050-02-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: check-file
    description: SHA256SUMS lists every download with its published digest in the check format
    type: file
    source: validation/validate-check-file.sh
    points: 2
  - name: check-result
    description: download-check records the exit status of the strict check
    type: file
    source: validation/validate-check-result.sh
    points: 1
  - name: failed-download
    description: download-check names the download that failed the strict check, or none
    type: file
    source: validation/validate-failed-download.sh
    points: 1
