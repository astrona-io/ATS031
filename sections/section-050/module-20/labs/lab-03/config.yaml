apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-050-02-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: failing-record
    description: The ConfigMap failing-binary exists in the lab namespace with the key name
    type: file
    source: validation/validate-failing-record.sh
    points: 1
  - name: binary-name
    description: The key name holds the bare file name of one of the seven staged binaries
    type: file
    source: validation/validate-binary-name.sh
    points: 1
  - name: failing-binary
    description: failing-binary names the one download whose bytes differ from its published checksum
    type: file
    source: validation/validate-failing-binary.sh
    points: 1
