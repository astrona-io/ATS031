<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="title desc">
  <title id="title">The offline release mirror on the control plane node</title>
  <desc id="desc">The directory /var/lib/training-release/k8s holds release/stable.txt with the version v1.35.0, a v1.35.0 directory for this architecture with copies of the node binaries, a v1.35.0 directory for the other architecture with a stand-in kubectl, a v1.34.0 directory with stand-ins, the links current and other-arch, and the downloads directory with files to verify.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="800" height="430" rx="10"/>
  <text class="label" x="36" y="44" text-anchor="start">control plane node container</text>
  <path class="line" d="M44 80 V410"/>
  <path class="line" d="M44 110 H58"/>
  <path class="line" d="M44 160 H58"/>
  <path class="line" d="M44 210 H58"/>
  <path class="line" d="M44 260 H58"/>
  <path class="line" d="M44 310 H58"/>
  <path class="line" d="M44 360 H58"/>
  <path class="line" d="M44 410 H58"/>
  <rect class="box" x="60" y="88" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="115" text-anchor="start">release/stable.txt</text>
  <text x="450" y="115" text-anchor="start">The staged stable version: v1.35.0</text>
  <rect class="ok" x="60" y="138" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="165" text-anchor="start">release/v1.35.0/bin/linux/&lt;this arch&gt;/</text>
  <text x="450" y="165" text-anchor="start">Copies of the binaries the node image installed</text>
  <rect class="box" x="60" y="188" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="215" text-anchor="start">release/v1.35.0/bin/linux/&lt;other arch&gt;/</text>
  <text x="450" y="215" text-anchor="start">A stand-in kubectl and its .sha256 file</text>
  <rect class="box" x="60" y="238" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="265" text-anchor="start">release/v1.34.0/bin/linux/&lt;this arch&gt;/</text>
  <text x="450" y="265" text-anchor="start">Stand-ins for the three tools, older release</text>
  <rect class="frame" x="60" y="288" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="315" text-anchor="start">current</text>
  <text x="450" y="315" text-anchor="start">Link to the v1.35.0 directory for this arch</text>
  <rect class="frame" x="60" y="338" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="365" text-anchor="start">other-arch</text>
  <text x="450" y="365" text-anchor="start">Link to the v1.35.0 directory for the other arch</text>
  <rect class="ask" x="60" y="388" width="370" height="44" rx="8"/>
  <text class="code" x="76" y="415" text-anchor="start">downloads/</text>
  <text x="450" y="415" text-anchor="start">Files to verify: some genuine, some not</text>
  <text class="code strong" x="40" y="70" text-anchor="start">/var/lib/training-release/k8s/</text>
</svg>
