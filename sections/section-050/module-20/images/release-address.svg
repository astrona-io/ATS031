<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Three facts select one release directory</title>
  <desc id="desc">The version v1.35.0, the operating system linux and the architecture amd64 together select the directory release/v1.35.0/bin/linux/amd64/. That directory holds the binary kubectl and its digest file kubectl.sha256 side by side.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M240 58 H270 V125 H298" marker-end="url(#arrow)"/>
  <path class="line" d="M240 140 H298" marker-end="url(#arrow)"/>
  <path class="line" d="M240 222 H270 V155 H298" marker-end="url(#arrow)"/>
  <path class="line" d="M590 125 H620 V90 H648" marker-end="url(#arrow)"/>
  <path class="line" d="M590 155 H620 V190 H648" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="30" width="210" height="56" rx="8"/>
  <text x="135" y="54" text-anchor="middle">Version</text>
  <text class="code" x="135" y="74" text-anchor="middle">v1.35.0</text>
  <rect class="box" x="30" y="112" width="210" height="56" rx="8"/>
  <text x="135" y="136" text-anchor="middle">Operating system</text>
  <text class="code" x="135" y="156" text-anchor="middle">linux</text>
  <rect class="box" x="30" y="194" width="210" height="56" rx="8"/>
  <text x="135" y="218" text-anchor="middle">Architecture</text>
  <text class="code" x="135" y="238" text-anchor="middle">amd64</text>
  <rect class="ask" x="300" y="104" width="290" height="72" rx="8"/>
  <text class="strong" x="445" y="132" text-anchor="middle">Release directory</text>
  <text class="code" x="445" y="156" text-anchor="middle">release/v1.35.0/bin/linux/amd64/</text>
  <rect class="box" x="650" y="62" width="170" height="56" rx="8"/>
  <text x="735" y="86" text-anchor="middle">Binary</text>
  <text class="code" x="735" y="106" text-anchor="middle">kubectl</text>
  <rect class="box" x="650" y="162" width="170" height="56" rx="8"/>
  <text x="735" y="186" text-anchor="middle">Digest file</text>
  <text class="code" x="735" y="206" text-anchor="middle">kubectl.sha256</text>
</svg>
