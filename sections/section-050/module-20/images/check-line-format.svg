<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-labelledby="title desc">
  <title id="title">Build the line that sha256sum --check reads</title>
  <desc id="desc">The published file kubectl.sha256 holds only the digest. The echo command adds two spaces and the name kubectl. sha256sum --check reads that line, computes the digest of kubectl again, compares it and prints kubectl: OK with exit status 0.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M190 82 H218" marker-end="url(#arrow)"/>
  <path class="line" d="M430 82 H458" marker-end="url(#arrow)"/>
  <path class="okline" d="M620 82 H648" marker-end="url(#arrowok)"/>
  <rect class="box" x="30" y="50" width="160" height="64" rx="8"/>
  <text x="110" y="76" text-anchor="middle">Published file</text>
  <text class="code" x="110" y="98" text-anchor="middle">kubectl.sha256</text>
  <rect class="box" x="220" y="50" width="210" height="64" rx="8"/>
  <text x="325" y="76" text-anchor="middle">Line built with echo</text>
  <text class="code" x="325" y="98" text-anchor="middle" xml:space="preserve">&lt;digest&gt;  kubectl</text>
  <rect class="box" x="460" y="50" width="160" height="64" rx="8"/>
  <text class="code" x="540" y="76" text-anchor="middle">sha256sum</text>
  <text class="code" x="540" y="98" text-anchor="middle">--check</text>
  <rect class="ok" x="650" y="50" width="160" height="64" rx="8"/>
  <text class="code" x="730" y="76" text-anchor="middle">kubectl: OK</text>
  <text x="730" y="98" text-anchor="middle">exit status 0</text>
  <text class="label" x="110" y="140" text-anchor="middle">digest only, no name</text>
  <text class="label" x="325" y="140" text-anchor="middle">digest, two spaces, file name</text>
  <text class="label" x="540" y="140" text-anchor="middle">computes and compares</text>
  <text class="label" x="730" y="140" text-anchor="middle">printed result and status</text>
</svg>
