<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Signing with the private key and verifying with the public key</title>
  <desc id="desc">On the publisher side, the digest of checksums.txt is signed with the private key, which produces checksums.sig. On your side, openssl dgst -verify checks checksums.sig against checksums.txt with publisher.pub and prints Verified OK or Verification failure.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>



  <rect class="frame" x="20" y="20" width="360" height="290" rx="10"/>
  <text class="label" x="36" y="44">Publisher</text>
  <rect class="frame" x="460" y="20" width="360" height="290" rx="10"/>
  <text class="label" x="476" y="44">You</text>
  <path class="line" d="M130 106 V146" marker-end="url(#arrow)"/>
  <path class="line" d="M270 106 V146" marker-end="url(#arrow)"/>
  <path class="line" d="M200 196 V236" marker-end="url(#arrow)"/>
  <path class="line" d="M550 106 V146" marker-end="url(#arrow)"/>
  <path class="line" d="M330 261 H540 V196" marker-end="url(#arrow)"/>
  <text class="label" x="420" y="253" text-anchor="middle">published</text>
  <path class="line" d="M720 106 V146" marker-end="url(#arrow)"/>
  <path class="line" d="M700 196 V236" marker-end="url(#arrow)"/>
  <rect class="box" x="50" y="60" width="160" height="46" rx="8"/>
  <text class="code" x="130" y="88" text-anchor="middle">checksums.txt</text>
  <rect class="drop" x="230" y="60" width="130" height="46" rx="8"/>
  <text x="295" y="88" text-anchor="middle">private key</text>
  <rect class="box" x="70" y="148" width="260" height="46" rx="8"/>
  <text x="200" y="176" text-anchor="middle">sign the digest</text>
  <rect class="box" x="70" y="238" width="260" height="46" rx="8"/>
  <text class="code" x="200" y="266" text-anchor="middle">checksums.sig</text>
  <rect class="box" x="480" y="60" width="140" height="46" rx="8"/>
  <text class="code" x="550" y="88" text-anchor="middle">checksums.txt</text>
  <rect class="ask" x="640" y="60" width="160" height="46" rx="8"/>
  <text class="code" x="720" y="88" text-anchor="middle">publisher.pub</text>
  <rect class="box" x="510" y="148" width="270" height="46" rx="8"/>
  <text class="code" x="645" y="176" text-anchor="middle">openssl dgst -verify</text>
  <rect class="ok" x="590" y="238" width="220" height="46" rx="8"/>
  <text x="700" y="257" text-anchor="middle"><tspan class="code">Verified OK</tspan> or</text>
  <text class="code" x="700" y="276" text-anchor="middle">Verification failure</text>
</svg>
