<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Where the staged release files are</title>
  <desc id="desc">Your shell on the host runs podman exec into the control plane node container astro-ats-031-playground-050-01-control-plane. Inside it, the directory /var/lib/training-release holds kubectl, kubectl-tampered, checksums.txt, checksums.sig and publisher.pub.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>



  <path class="line" d="M190 180 H368" marker-end="url(#arrow)"/>
  <text class="label code" x="279" y="170" text-anchor="middle">podman exec $NODE</text>
  <rect class="box" x="20" y="150" width="170" height="60" rx="8"/>
  <text x="105" y="176" text-anchor="middle">Your shell</text>
  <text class="label" x="105" y="196" text-anchor="middle">on the host</text>
  <rect class="frame" x="370" y="20" width="460" height="320" rx="10"/>
  <text class="label" x="386" y="44">Node container</text>
  <text class="label code" x="386" y="62">astro-ats-031-playground-050-01-control-plane</text>
  <text class="label code" x="400" y="86">/var/lib/training-release/</text>
  <rect class="box" x="400" y="96" width="410" height="36" rx="6"/>
  <text class="code" x="416" y="119">kubectl</text>
  <text x="794" y="119" text-anchor="end">the binary to deploy</text>
  <rect class="drop" x="400" y="142" width="410" height="36" rx="6"/>
  <text class="code" x="416" y="165">kubectl-tampered</text>
  <text x="794" y="165" text-anchor="end">binary plus extra bytes</text>
  <rect class="box" x="400" y="188" width="410" height="36" rx="6"/>
  <text class="code" x="416" y="211">checksums.txt</text>
  <text x="794" y="211" text-anchor="end">SHA-256 digest of kubectl</text>
  <rect class="box" x="400" y="234" width="410" height="36" rx="6"/>
  <text class="code" x="416" y="257">checksums.sig</text>
  <text x="794" y="257" text-anchor="end">signature over checksums.txt</text>
  <rect class="ask" x="400" y="280" width="410" height="36" rx="6"/>
  <text class="code" x="416" y="303">publisher.pub</text>
  <text x="794" y="303" text-anchor="end">public key, exercise only</text>
</svg>
