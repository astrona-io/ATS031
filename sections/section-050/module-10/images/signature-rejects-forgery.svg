<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">The same signature accepts the real manifest and rejects the forgery</title>
  <desc id="desc">checksums.sig and publisher.pub stay the same in both checks. Checked against checksums.txt, openssl prints Verified OK. Checked against /tmp/forged-checksums.txt, openssl prints Verification failure and exits with a nonzero status.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>



  <path class="line" d="M240 160 H300"/>
  <path class="okline" d="M300 160 V80 H408" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M300 160 V240 H408" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M610 80 H648" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M610 240 H648" marker-end="url(#arrowbad)"/>
  <rect class="frame" x="20" y="90" width="220" height="140" rx="10"/>
  <text class="label" x="36" y="114">The same in both checks</text>
  <rect class="box" x="40" y="126" width="180" height="36" rx="6"/>
  <text class="code" x="130" y="149" text-anchor="middle">checksums.sig</text>
  <rect class="ask" x="40" y="176" width="180" height="36" rx="6"/>
  <text class="code" x="130" y="199" text-anchor="middle">publisher.pub</text>
  <rect class="box" x="410" y="55" width="200" height="50" rx="8"/>
  <text class="code" x="510" y="85" text-anchor="middle">checksums.txt</text>
  <rect class="drop" x="410" y="215" width="200" height="50" rx="8"/>
  <text class="code" x="510" y="245" text-anchor="middle">forged-checksums.txt</text>
  <rect class="ok" x="650" y="55" width="170" height="50" rx="8"/>
  <text class="code" x="735" y="85" text-anchor="middle">Verified OK</text>
  <rect class="drop" x="650" y="208" width="170" height="64" rx="8"/>
  <text class="code" x="735" y="234" text-anchor="middle">Verification failure</text>
  <text class="label bad" x="735" y="256" text-anchor="middle">nonzero exit status</text>
</svg>
