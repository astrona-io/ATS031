apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-050-01-02
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: signed-mirror
    description: artifact-review names a mirror whose manifest has a good signature from the publisher key
    type: file
    source: validation/validate-signed-mirror.sh
    points: 1
  - name: trusted-mirror
    description: the named mirror's relay-agent also matches its signed manifest, so it is the one genuine release
    type: file
    source: validation/validate-trusted-mirror.sh
    points: 1
  - name: review-digest
    description: artifact-review records the relay-agent digest from the authenticated manifest
    type: file
    source: validation/validate-review-digest.sh
    points: 1
