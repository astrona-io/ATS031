apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-050-01-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: installed-binary
    description: The installed fleet-agent matches the signed manifest and only root can write it or its directories
    type: file
    source: validation/validate-installed-binary.sh
    points: 2
  - name: install-record
    description: install-record names the cache that held the genuine copy and the installed digest
    type: file
    source: validation/validate-install-record.sh
    points: 1
