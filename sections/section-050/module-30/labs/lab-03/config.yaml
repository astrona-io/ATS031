apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-050-03-03
  docs:
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: rejected-records
    description: cosign-review names every build record that fails verification with the fleet key
    type: file
    source: validation/validate-rejected-records.sh
    points: 2
  - name: signed-approval
    description: approval.txt has a signature that verifies with a new public key in /var/lib/approval
    type: file
    source: validation/validate-signed-approval.sh
    points: 1
  - name: private-key-removed
    description: The private key cosign.key is gone from /var/lib/approval after signing, and cosign.pub stays
    type: file
    source: validation/validate-private-key-removed.sh
    points: 1
