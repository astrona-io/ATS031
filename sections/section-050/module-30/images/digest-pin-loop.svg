<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Pin an image and confirm what runs</title>
  <desc id="desc">Write the digest you read into the image field as busybox:1.37.0@sha256:&lt;digest&gt;, roll out, read the imageID of the running pod and compare it with the pin. The same digest means the pod runs what you pinned; a different value must be explained first.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 62 H288" marker-end="url(#arrow)"/>
  <text class="label" x="244" y="54" text-anchor="middle">write</text>
  <path class="line" d="M570 62 H628" marker-end="url(#arrow)"/>
  <text class="label" x="599" y="54" text-anchor="middle">rollout</text>
  <path class="line" d="M730 84 V140 H435 V178" marker-end="url(#arrow)"/>
  <text class="label" x="742" y="120">read <tspan class="code">imageID</tspan></text>
  <path class="okline" d="M310 202 H232" marker-end="url(#arrowok)"/>
  <text class="label good" x="271" y="194" text-anchor="middle">same</text>
  <path class="dashed" d="M560 202 H628" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="594" y="194" text-anchor="middle">differs</text>

  <rect class="box" x="30" y="40" width="170" height="44" rx="8"/>
  <text x="115" y="67" text-anchor="middle">digest you read</text>
  <rect class="box" x="290" y="40" width="280" height="44" rx="8"/>
  <text x="430" y="67" text-anchor="middle" class="code">busybox:1.37.0@sha256:&lt;digest&gt;</text>
  <text class="label" x="290" y="102">pinned <tspan class="code">image</tspan> field</text>
  <rect class="box" x="630" y="40" width="190" height="44" rx="8"/>
  <text x="725" y="67" text-anchor="middle">running pod</text>

  <rect class="ask" x="310" y="180" width="250" height="44" rx="8"/>
  <text x="435" y="207" text-anchor="middle">compare with the pin</text>
  <rect class="ok" x="30" y="180" width="200" height="44" rx="8"/>
  <text x="130" y="207" text-anchor="middle">runs what you pinned</text>
  <rect class="drop" x="630" y="180" width="190" height="44" rx="8"/>
  <text x="725" y="207" text-anchor="middle">find out why first</text>
</svg>
