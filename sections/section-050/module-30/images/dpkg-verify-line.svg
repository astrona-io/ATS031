<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="740" height="290" role="img" aria-labelledby="title desc">
  <title id="title">How to read a dpkg --verify line</title>
  <desc id="desc">The line ??5?????? c /etc/issue has nine characters, one per property. A question mark means the check could not be done. A 5 in the third place means the content digest differs. The letter c marks a configuration file. The path of the changed file comes last.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M346 116 V230"/>
  <path class="dashed" d="M130 116 V170"/>
  <path class="line" d="M418 116 V170"/>
  <path class="line" d="M580 116 V230"/>
  <rect class="box" x="40" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="58.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="58.0" y="50" text-anchor="middle">1</text>
  <rect class="box" x="76" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="94.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="94.0" y="50" text-anchor="middle">2</text>
  <rect class="drop" x="112" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="130.0" y="94" text-anchor="middle" style="font-size:20px">5</text>
  <text class="label" x="130.0" y="50" text-anchor="middle">3</text>
  <rect class="box" x="148" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="166.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="166.0" y="50" text-anchor="middle">4</text>
  <rect class="box" x="184" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="202.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="202.0" y="50" text-anchor="middle">5</text>
  <rect class="box" x="220" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="238.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="238.0" y="50" text-anchor="middle">6</text>
  <rect class="box" x="256" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="274.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="274.0" y="50" text-anchor="middle">7</text>
  <rect class="box" x="292" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="310.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="310.0" y="50" text-anchor="middle">8</text>
  <rect class="box" x="328" y="60" width="36" height="56" rx="4"/>
  <text class="code" x="346.0" y="94" text-anchor="middle" style="font-size:20px">?</text>
  <text class="label" x="346.0" y="50" text-anchor="middle">9</text>
  <rect class="ask" x="396" y="60" width="44" height="56" rx="4"/>
  <text class="code" x="418" y="94" text-anchor="middle" style="font-size:20px">c</text>
  <rect class="box" x="470" y="60" width="220" height="56" rx="4"/>
  <text class="code" x="580" y="94" text-anchor="middle" style="font-size:20px">/etc/issue</text>
  <text class="label" x="40" y="26">nine characters, one per property</text>
  <rect class="box" x="236" y="230" width="210" height="44" rx="8"/>
  <text x="341" y="257" text-anchor="middle"><tspan class="code">?</tspan> = check not done</text>
  <rect class="drop" x="20" y="170" width="260" height="44" rx="8"/>
  <text x="150" y="197" text-anchor="middle"><tspan class="code">5</tspan> in place 3 = digest differs</text>
  <rect class="ask" x="366" y="170" width="190" height="44" rx="8"/>
  <text x="461" y="197" text-anchor="middle"><tspan class="code">c</tspan> = configuration file</text>
  <rect class="box" x="470" y="230" width="220" height="44" rx="8"/>
  <text x="580" y="257" text-anchor="middle">path of the changed file</text>
</svg>
