<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Signing and verifying a blob with a cosign key pair</title>
  <desc id="desc">The signer runs cosign sign-blob with the private key cosign.key over build-record.txt and gets build-record.txt.sig. The verifier runs cosign verify-blob with the public key cosign.pub, the signature and the blob. The original blob prints Verified OK; a forged copy fails with a nonzero exit status.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="30" width="310" height="300" rx="10"/>
  <text class="label" x="36" y="54">signer</text>
  <rect class="frame" x="360" y="30" width="460" height="300" rx="10"/>
  <text class="label" x="376" y="54">verifier</text>

  <path class="line" d="M100 112 V158" marker-end="url(#arrow)"/>
  <path class="line" d="M250 112 V158" marker-end="url(#arrow)"/>
  <path class="line" d="M175 204 V248" marker-end="url(#arrow)"/>
  <path class="line" d="M295 272 H480 V206" marker-end="url(#arrow)"/>
  <text class="label" x="374" y="294">signature and blob</text>
  <path class="line" d="M450 112 V158" marker-end="url(#arrow)"/>
  <path class="okline" d="M580 170 H618 V132 H636" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M580 194 H618 V232 H636" marker-end="url(#arrowbad)"/>

  <rect class="ask" x="40" y="70" width="120" height="42" rx="8"/>
  <text x="100" y="96" text-anchor="middle" class="code">cosign.key</text>
  <rect class="box" x="180" y="70" width="140" height="42" rx="8"/>
  <text x="250" y="96" text-anchor="middle" class="code">build-record.txt</text>
  <rect class="box" x="55" y="160" width="240" height="44" rx="8"/>
  <text x="175" y="187" text-anchor="middle" class="code">cosign sign-blob</text>
  <rect class="box" x="55" y="250" width="240" height="44" rx="8"/>
  <text x="175" y="277" text-anchor="middle" class="code">build-record.txt.sig</text>

  <rect class="ok" x="385" y="70" width="130" height="42" rx="8"/>
  <text x="450" y="96" text-anchor="middle" class="code">cosign.pub</text>
  <rect class="box" x="380" y="160" width="200" height="44" rx="8"/>
  <text x="480" y="187" text-anchor="middle" class="code">cosign verify-blob</text>

  <rect class="ok" x="640" y="110" width="165" height="44" rx="8"/>
  <text x="722" y="137" text-anchor="middle" class="code">Verified OK</text>
  <text class="label good" x="722" y="100" text-anchor="middle">original blob</text>
  <rect class="drop" x="640" y="210" width="165" height="44" rx="8"/>
  <text x="722" y="237" text-anchor="middle">nonzero exit status</text>
  <text class="label bad" x="722" y="272" text-anchor="middle">forged copy</text>
</svg>
