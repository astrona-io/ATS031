<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-labelledby="title desc">
  <title id="title">The attack surface of the Traefik controller</title>
  <desc id="desc">Requests from the internet reach the Traefik pod through the Service traefik on ports 80 and 443. The pod uses its ServiceAccount to read Secrets in all namespaces from the Kubernetes API. When --api.insecure=true is set, anyone in the cluster network can reach the API and dashboard on port 8080.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M180 85 H238" marker-end="url(#arrow)"/>
  <path class="line" d="M410 110 V148" marker-end="url(#arrow)"/>
  <path class="line" d="M580 185 H658" marker-end="url(#arrow)"/>
  <path class="dashed" d="M410 222 V258" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M180 290 H238" marker-end="url(#arrowbad)"/>
  <rect class="frame" x="220" y="20" width="380" height="330" rx="10"/>
  <text class="label" x="232" y="40">namespace ingress-system</text>
  <text class="label" x="619" y="177" text-anchor="middle">reads</text>
  <rect class="box" x="30" y="60" width="150" height="50" rx="8"/>
  <text x="105.0" y="90" text-anchor="middle">internet</text>
  <rect class="box" x="240" y="50" width="340" height="60" rx="8"/>
  <text x="410.0" y="75" text-anchor="middle">Service</text>
  <text class="code" x="410.0" y="95" text-anchor="middle">traefik: ports 80, 443</text>
  <rect class="box" x="240" y="150" width="340" height="72" rx="8"/>
  <text class="strong" x="410.0" y="171" text-anchor="middle">Traefik pod</text>
  <text class="code" x="410.0" y="191" text-anchor="middle">web :8000, websecure :8443</text>
  <text x="410.0" y="211" text-anchor="middle">ServiceAccount traefik</text>
  <rect class="drop" x="240" y="260" width="340" height="64" rx="8" stroke-dasharray="6 5"/>
  <text x="410.0" y="287" text-anchor="middle">API and dashboard on port 8080</text>
  <text class="code" x="410.0" y="307" text-anchor="middle">only with --api.insecure=true</text>
  <rect class="ask" x="660" y="140" width="180" height="90" rx="8"/>
  <text class="strong" x="750.0" y="170" text-anchor="middle">Kubernetes API</text>
  <text x="750.0" y="190" text-anchor="middle">read Secrets in</text>
  <text x="750.0" y="210" text-anchor="middle">all namespaces</text>
  <rect class="box" x="30" y="260" width="150" height="60" rx="8"/>
  <text x="105.0" y="285" text-anchor="middle">anyone in the</text>
  <text x="105.0" y="305" text-anchor="middle">cluster network</text>
</svg>
