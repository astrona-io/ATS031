<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-labelledby="title desc">
  <title id="title">The order of a certificate rotation</title>
  <desc id="desc">First a new key and certificate, then the Secret probe-tls is updated in place, then Traefik sees the change through the Kubernetes API, and clients receive the new serial, which openssl s_client checks.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 95 H228" marker-end="url(#arrow)"/>
  <path class="line" d="M400 95 H438" marker-end="url(#arrow)"/>
  <path class="line" d="M610 95 H648" marker-end="url(#arrow)"/>
  <path class="line" d="M735 130 V168" marker-end="url(#arrow)"/>
  <rect class="box" x="20" y="60" width="170" height="70" rx="8"/>
  <text x="105.0" y="90" text-anchor="middle">1. new key and</text>
  <text x="105.0" y="110" text-anchor="middle">certificate</text>
  <rect class="box" x="230" y="60" width="170" height="70" rx="8"/>
  <text x="315.0" y="80" text-anchor="middle">2. Secret</text>
  <text class="code" x="315.0" y="100" text-anchor="middle">probe-tls</text>
  <text x="315.0" y="120" text-anchor="middle">updated in place</text>
  <rect class="box" x="440" y="60" width="170" height="70" rx="8"/>
  <text x="525.0" y="90" text-anchor="middle">3. Traefik sees</text>
  <text x="525.0" y="110" text-anchor="middle">the Secret change</text>
  <rect class="ok" x="650" y="60" width="170" height="70" rx="8"/>
  <text x="735.0" y="90" text-anchor="middle">4. clients get</text>
  <text x="735.0" y="110" text-anchor="middle">the new serial</text>
  <rect class="ask" x="560" y="170" width="280" height="50" rx="8"/>
  <text class="code" x="700.0" y="200" text-anchor="middle">check: openssl s_client</text>
  <text class="label" x="20" y="36" text-anchor="start">no restart: Traefik watches the Secret through the Kubernetes API</text>
</svg>
