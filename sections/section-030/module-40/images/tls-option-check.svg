<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-labelledby="title desc">
  <title id="title">The TLS option check in the handshake</title>
  <desc id="desc">The client hello carries a TLS version and a server name. Traefik refuses the handshake when the version is below minVersion, or when sniStrict is on and the name matches no certificate. An allowed hello reaches the TLS router, the certificate and the probe Service.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 145 H258" marker-end="url(#arrow)"/>
  <path class="dashed" d="M450 125 H480 V47 H528" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M450 140 H500 V123 H528" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M450 165 H480 V217 H528" marker-end="url(#arrowok)"/>
  <path class="okline" d="M680 217 H728" marker-end="url(#arrowok)"/>
  <rect class="box" x="30" y="110" width="170" height="70" rx="8"/>
  <text class="strong" x="115.0" y="140" text-anchor="middle">client hello</text>
  <text x="115.0" y="160" text-anchor="middle">version, server name</text>
  <rect class="ask" x="260" y="105" width="190" height="80" rx="8"/>
  <text class="strong" x="355.0" y="140" text-anchor="middle">TLS option check</text>
  <text x="355.0" y="160" text-anchor="middle">during the handshake</text>
  <rect class="drop" x="530" y="20" width="310" height="54" rx="8"/>
  <text class="strong" x="685.0" y="42" text-anchor="middle">handshake refused</text>
  <text x="685.0" y="62" text-anchor="middle">TLS version below minVersion</text>
  <rect class="drop" x="530" y="96" width="310" height="54" rx="8"/>
  <text class="strong" x="685.0" y="118" text-anchor="middle">handshake refused</text>
  <text x="685.0" y="138" text-anchor="middle">sniStrict on, name has no certificate</text>
  <rect class="ok" x="530" y="190" width="150" height="54" rx="8"/>
  <text class="strong" x="605.0" y="212" text-anchor="middle">TLS router</text>
  <text x="605.0" y="232" text-anchor="middle">and certificate</text>
  <rect class="box" x="730" y="190" width="110" height="54" rx="8"/>
  <text class="code" x="785.0" y="212" text-anchor="middle">probe</text>
  <text x="785.0" y="232" text-anchor="middle">Service</text>
  <text class="label good" x="605" y="266" text-anchor="middle">allowed</text>
</svg>
