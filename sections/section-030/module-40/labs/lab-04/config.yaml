apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-030-04-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - docker.io/library/traefik:v3.6.1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: secret-rbac
    description: The Traefik ServiceAccount may get, list and watch Secrets only in starfleet-031-030-04-04
    type: file
    source: validation/validate-secret-rbac.sh
    points: 1
  - name: api-closed
    description: Traefik runs without --api.insecure and its Service has no port 8080
    type: file
    source: validation/validate-api-closed.sh
    points: 1
  - name: secret-scope
    description: Traefik watches Ingress objects only in starfleet-031-030-04-04 and still serves dock-tls
    type: file
    source: validation/validate-secret-scope.sh
    points: 1
