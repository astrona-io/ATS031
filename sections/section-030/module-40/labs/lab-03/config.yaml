apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-030-04-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - docker.io/library/traefik:v3.6.1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: mtls-option
    description: The ConfigMap client-ca holds the crew CA, and the TLS option mtls in traefik-dynamic requires a client certificate from it
    type: file
    source: validation/validate-mtls-option.sh
    points: 1
  - name: vault-annotation
    description: Ingress vault uses the TLS option mtls@file, and Ingress beacon uses no TLS option
    type: file
    source: validation/validate-vault-annotation.sh
    points: 1
  - name: mtls-enforced
    description: vault.example.test accepts only clients with a crew certificate, and beacon.example.test stays open
    type: file
    source: validation/validate-mtls-enforced.sh
    points: 1
