<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Same trusted certificate, two host name checks</title>
  <desc id="desc">openssl s_client connects with the server name probe.local and trusts probe.crt. Checking the name probe.local gives Verify return code 0 (ok). Checking the name wrong.local fails with a hostname mismatch and return code 62. The chain and the dates pass both times.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M250 120 L328 72" marker-end="url(#arrow)"/>
  <path class="line" d="M250 150 L328 198" marker-end="url(#arrow)"/>
  <path class="okline" d="M560 72 H618" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M560 198 H618" marker-end="url(#arrowbad)"/>

  <rect class="box" x="30" y="96" width="220" height="80" rx="8"/>
  <text x="140" y="122" text-anchor="middle">certificate in <tspan class="code">probe-tls</tspan></text>
  <text class="code" x="140" y="144" text-anchor="middle">SAN: DNS:probe.local</text>
  <text x="140" y="164" text-anchor="middle">trusted with <tspan class="code">-CAfile</tspan></text>
  <text class="label" x="140" y="212" text-anchor="middle">chain and dates pass</text>
  <text class="label" x="140" y="230" text-anchor="middle">in both checks</text>

  <rect class="ask" x="330" y="42" width="230" height="60" rx="8"/>
  <text class="code" x="445" y="67" text-anchor="middle">-verify_hostname</text>
  <text class="code" x="445" y="88" text-anchor="middle">probe.local</text>

  <rect class="ask" x="330" y="168" width="230" height="60" rx="8"/>
  <text class="code" x="445" y="193" text-anchor="middle">-verify_hostname</text>
  <text class="code" x="445" y="214" text-anchor="middle">wrong.local</text>

  <rect class="ok" x="620" y="42" width="190" height="60" rx="8"/>
  <text class="strong good" x="715" y="67" text-anchor="middle">accepted</text>
  <text x="715" y="88" text-anchor="middle">return code 0 (ok)</text>

  <rect class="drop" x="620" y="160" width="190" height="76" rx="8"/>
  <text class="strong bad" x="715" y="184" text-anchor="middle">rejected</text>
  <text x="715" y="204" text-anchor="middle">hostname mismatch</text>
  <text x="715" y="224" text-anchor="middle">return code 62</text>
</svg>
