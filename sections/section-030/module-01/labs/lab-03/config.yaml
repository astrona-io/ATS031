apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-030-01-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - docker.io/library/traefik:v3.6.1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: vault-secret
    description: Secret vault-tls has the type kubernetes.io/tls and a matching certificate and key
    type: file
    source: validation/validate-vault-secret.sh
    points: 1
  - name: vault-certificate
    description: The vault-tls certificate names vault.local in its SAN and is valid for at least 80 more days
    type: file
    source: validation/validate-vault-certificate.sh
    points: 1
  - name: vault-https
    description: "https://vault.local serves the certificate from vault-tls"
    type: file
    source: validation/validate-vault-https.sh
    points: 1
