apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet
  namespace: starfleet-031-030-01-04
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: bridge.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bridge
            port:
              number: 80
  - host: dock.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dock
            port:
              number: 80
  tls:
  - hosts:
    - bridge.local
    secretName: bridge-tls
  - hosts:
    - dock.local
    secretName: dock-tls
