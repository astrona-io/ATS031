<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Where the HSTS header comes from</title>
  <desc id="desc">The ConfigMap traefik-dynamic in ingress-system holds dynamic.yaml with the TLS option default and the middleware hsts with stsSeconds 300. Traefik reads the file through the file provider. The Ingress probe in starfleet names hsts@file in the router.middlewares annotation. Traefik then adds Strict-Transport-Security: max-age=300 to the HTTPS response for the client.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M280 125 H418" marker-end="url(#arrow)"/>
  <text class="label" x="349" y="113" text-anchor="middle">file provider</text>
  <path class="line" d="M280 285 C 360 285, 360 175, 418 175" marker-end="url(#arrow)"/>
  <text class="label" x="304" y="326">names <tspan class="code">hsts@file</tspan></text>
  <path class="okline" d="M630 145 H678" marker-end="url(#arrowok)"/>

  <rect class="frame" x="20" y="20" width="270" height="180" rx="10"/>
  <text class="label code" x="34" y="40">ingress-system</text>
  <rect class="box" x="34" y="52" width="246" height="132" rx="8"/>
  <text x="48" y="74">ConfigMap <tspan class="code">traefik-dynamic</tspan></text>
  <text class="code" x="48" y="98">dynamic.yaml:</text>
  <text class="code" x="60" y="120">tls option default</text>
  <text class="code" x="60" y="142">middleware hsts:</text>
  <text class="code" x="72" y="164">stsSeconds: 300</text>

  <rect class="frame" x="20" y="220" width="270" height="110" rx="10"/>
  <text class="label code" x="34" y="240">starfleet</text>
  <rect class="box" x="34" y="250" width="246" height="68" rx="8"/>
  <text x="48" y="272">Ingress <tspan class="code">probe</tspan>, annotation</text>
  <text class="code" x="48" y="294">router.middlewares:</text>
  <text class="code" x="60" y="312">hsts@file</text>

  <rect class="ask" x="420" y="90" width="210" height="110" rx="10"/>
  <text x="525" y="118" text-anchor="middle" class="strong">Traefik</text>
  <text x="525" y="142" text-anchor="middle">router for</text>
  <text class="code" x="525" y="162" text-anchor="middle">probe.example.test</text>
  <text x="525" y="184" text-anchor="middle">runs middleware <tspan class="code">hsts</tspan></text>

  <rect class="ok" x="680" y="90" width="150" height="110" rx="10"/>
  <text x="755" y="116" text-anchor="middle">HTTPS response</text>
  <text class="code" x="755" y="142" text-anchor="middle">Strict-Transport-</text>
  <text class="code" x="755" y="160" text-anchor="middle">Security:</text>
  <text class="code" x="755" y="178" text-anchor="middle">max-age=300</text>
</svg>
