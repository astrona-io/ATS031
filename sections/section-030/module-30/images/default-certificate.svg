<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Known name and unknown name</title>
  <desc id="desc">A client that sends the name probe.example.test gets the certificate from the Secret probe-tls, which it trusts. A client that sends unknown.example.test matches no certificate, so Traefik serves its self-signed default certificate, which the client rejects.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M210 80 H318" marker-end="url(#arrowok)"/>
  <text class="label good" x="254" y="70" text-anchor="middle">match</text>
  <path class="dashed" d="M210 220 H318" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="254" y="210" text-anchor="middle">none</text>
  <path class="okline" d="M560 80 H618" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M560 220 H618" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="52" width="190" height="56" rx="8"/>
  <text class="label" x="115" y="74" text-anchor="middle">client asks for</text>
  <text class="code" x="115" y="94" text-anchor="middle">probe.example.test</text>
  <rect class="box" x="20" y="192" width="190" height="56" rx="8"/>
  <text class="label" x="115" y="214" text-anchor="middle">client asks for</text>
  <text class="code" x="115" y="234" text-anchor="middle">unknown.example.test</text>

  <rect class="frame" x="300" y="20" width="280" height="260" rx="10"/>
  <text class="label" x="314" y="40">Traefik certificate store</text>
  <rect class="ok" x="320" y="52" width="240" height="56" rx="8"/>
  <text x="440" y="74" text-anchor="middle">certificate from Secret</text>
  <text class="code" x="440" y="94" text-anchor="middle">probe-tls</text>
  <rect class="drop" x="320" y="192" width="240" height="56" rx="8"/>
  <text x="440" y="214" text-anchor="middle">default certificate</text>
  <text class="label" x="440" y="234" text-anchor="middle">self-signed by Traefik</text>

  <rect class="ok" x="620" y="52" width="190" height="56" rx="8"/>
  <text class="good strong" x="715" y="85" text-anchor="middle">client trusts it</text>
  <rect class="drop" x="620" y="192" width="190" height="56" rx="8"/>
  <text class="bad strong" x="715" y="225" text-anchor="middle">client rejects it</text>
</svg>
