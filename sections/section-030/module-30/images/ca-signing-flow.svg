<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">A CA signs the server certificate</title>
  <desc id="desc">On the CA side, ca.key and ca.crt sign the request. On the server side, probe.key puts its public key into probe.csr. Only probe.csr goes to the CA. The signing command reads probe.ext with the SAN and writes probe.crt, which goes back to the server side, where probe.crt and probe.key go to the cluster.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M185 110 V148" marker-end="url(#arrow)"/>
  <path class="line" d="M655 110 V148" marker-end="url(#arrow)"/>
  <text class="label" x="667" y="134">public key inside</text>
  <path class="okline" d="M575 179 H332" marker-end="url(#arrowok)"/>
  <text class="label good" x="420" y="169" text-anchor="middle">CSR only</text>
  <path class="line" d="M185 228 V266" marker-end="url(#arrow)"/>
  <path class="line" d="M285 297 H546" marker-end="url(#arrow)"/>
  <text class="label" x="420" y="287" text-anchor="middle">returned</text>

  <rect class="frame" x="20" y="20" width="330" height="340" rx="10"/>
  <text class="label" x="34" y="40">CA side</text>
  <rect class="box" x="75" y="56" width="220" height="54" rx="8"/>
  <text class="code" x="185" y="80" text-anchor="middle">ca.key   ca.crt</text>
  <text class="label" x="185" y="99" text-anchor="middle">ca.key never leaves the CA</text>
  <rect class="ask" x="40" y="150" width="290" height="78" rx="8"/>
  <text class="code" x="185" y="176" text-anchor="middle">openssl x509 -req</text>
  <text x="185" y="198" text-anchor="middle">signs with the CA files</text>
  <text x="185" y="218" text-anchor="middle">and <tspan class="code">probe.ext</tspan> (SAN)</text>
  <rect class="ok" x="85" y="270" width="200" height="54" rx="8"/>
  <text class="code" x="185" y="302" text-anchor="middle">probe.crt</text>

  <rect class="frame" x="490" y="20" width="330" height="340" rx="10"/>
  <text class="label" x="504" y="40">server side</text>
  <rect class="box" x="555" y="56" width="200" height="54" rx="8"/>
  <text class="code" x="655" y="80" text-anchor="middle">probe.key</text>
  <text class="label" x="655" y="99" text-anchor="middle">stays here</text>
  <rect class="box" x="575" y="152" width="160" height="54" rx="8"/>
  <text class="code" x="655" y="184" text-anchor="middle">probe.csr</text>
  <rect class="ok" x="550" y="270" width="250" height="54" rx="8"/>
  <text class="code" x="675" y="294" text-anchor="middle">probe.crt + probe.key</text>
  <text class="label" x="675" y="313" text-anchor="middle">go to the cluster</text>
</svg>
