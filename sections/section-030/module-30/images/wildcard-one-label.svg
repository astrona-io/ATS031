<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">A wildcard matches exactly one label</title>
  <desc id="desc">The certificate name *.example.test matches scout.example.test, where the star stands for the one label scout. It does not match a.b.example.test, which has two labels in that place, and it does not match example.test, which has no label in that place.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M250 150 C 330 150, 330 70, 430 70" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M250 150 H430" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M250 150 C 330 150, 330 230, 430 230" marker-end="url(#arrowbad)"/>

  <rect class="ask" x="30" y="110" width="220" height="80" rx="10"/>
  <text class="label" x="140" y="138" text-anchor="middle">name in the SAN</text>
  <text class="code" x="140" y="166" text-anchor="middle">*.example.test</text>

  <rect class="ok" x="434" y="46" width="230" height="48" rx="8"/>
  <text class="code" x="549" y="75" text-anchor="middle">scout.example.test</text>
  <text class="good strong" x="680" y="68">matches</text>
  <text x="680" y="88">one label: <tspan class="code">scout</tspan></text>

  <rect class="drop" x="434" y="126" width="230" height="48" rx="8"/>
  <text class="code" x="549" y="155" text-anchor="middle">a.b.example.test</text>
  <text class="bad strong" x="680" y="148">no match</text>
  <text x="680" y="168">two labels</text>

  <rect class="drop" x="434" y="206" width="230" height="48" rx="8"/>
  <text class="code" x="549" y="235" text-anchor="middle">example.test</text>
  <text class="bad strong" x="680" y="228">no match</text>
  <text x="680" y="248">no label</text>
</svg>
