<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Path of the HTTPS test request</title>
  <desc id="desc">On your machine, curl connects to 127.0.0.1:8443 and sends the name probe.example.test. The kubectl port forward passes the connection to the traefik Service on port 443 in ingress-system. Traefik receives it on the websecure entrypoint on port 8443, picks the certificate from the Secret probe-tls by the name, and sends the request to the probe Service on port 80 in starfleet.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M196 140 H212" marker-end="url(#arrowok)"/>
  <path class="okline" d="M354 140 H398" marker-end="url(#arrowok)"/>
  <path class="okline" d="M650 140 H688" marker-end="url(#arrowok)"/>
  <path class="line" d="M525 250 V178" marker-end="url(#arrow)"/>
  <text class="label" x="515" y="210" text-anchor="end">picks the</text>
  <text class="label" x="515" y="228" text-anchor="end">certificate</text>
  <text class="label" x="515" y="246" text-anchor="end">by name</text>

  <rect class="frame" x="20" y="40" width="350" height="160" rx="10"/>
  <text class="label" x="34" y="60">your machine</text>
  <rect class="box" x="36" y="96" width="160" height="88" rx="8"/>
  <text class="code" x="116" y="122" text-anchor="middle">curl</text>
  <text class="label" x="116" y="146" text-anchor="middle">sends the name</text>
  <text class="code" x="116" y="168" text-anchor="middle">probe.example.test</text>
  <rect class="box" x="214" y="96" width="140" height="88" rx="8"/>
  <text class="code" x="284" y="122" text-anchor="middle">127.0.0.1:8443</text>
  <text class="label" x="284" y="146" text-anchor="middle">kubectl</text>
  <text class="label" x="284" y="166" text-anchor="middle">port forward</text>

  <rect class="frame" x="390" y="40" width="275" height="280" rx="10"/>
  <text class="label code" x="404" y="60">ingress-system</text>
  <rect class="ask" x="400" y="96" width="250" height="82" rx="8"/>
  <text x="525" y="120" text-anchor="middle" class="strong">Traefik</text>
  <text class="code" x="525" y="142" text-anchor="middle">service/traefik :443</text>
  <text class="code" x="525" y="164" text-anchor="middle">entrypoint websecure :8443</text>
  <rect class="ok" x="420" y="252" width="210" height="58" rx="8"/>
  <text x="525" y="276" text-anchor="middle">Secret <tspan class="code">probe-tls</tspan></text>
  <text class="label" x="525" y="296" text-anchor="middle">named in the Ingress <tspan class="code">tls</tspan></text>

  <rect class="frame" x="680" y="40" width="160" height="160" rx="10"/>
  <text class="label code" x="694" y="60">starfleet</text>
  <rect class="ok" x="690" y="96" width="140" height="88" rx="8"/>
  <text x="760" y="122" text-anchor="middle">Service</text>
  <text class="code" x="760" y="146" text-anchor="middle">probe :80</text>
  <text class="label" x="760" y="168" text-anchor="middle">then the pod</text>
</svg>
