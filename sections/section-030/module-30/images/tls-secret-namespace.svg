<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">The TLS Secret and its namespace</title>
  <desc id="desc">The file probe.crt becomes the key tls.crt and the file probe.key becomes the key tls.key of the Secret probe-tls of type kubernetes.io/tls in the starfleet namespace. The Ingress probe in starfleet can use the Secret. An Ingress in the outpost namespace cannot use it.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 120 H337" marker-end="url(#arrow)"/>
  <path class="line" d="M190 162 H337" marker-end="url(#arrow)"/>
  <path class="okline" d="M450 196 V246" marker-end="url(#arrowok)"/>
  <text class="label good" x="462" y="226">same namespace</text>
  <path class="dashed" d="M572 150 C 700 150, 760 190, 760 258" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="600" y="138">other namespace</text>

  <rect class="box" x="30" y="97" width="160" height="46" rx="8"/>
  <text class="code" x="110" y="125" text-anchor="middle">probe.crt</text>
  <rect class="box" x="30" y="149" width="160" height="46" rx="8"/>
  <text class="code" x="110" y="177" text-anchor="middle">probe.key</text>

  <rect class="frame" x="320" y="20" width="270" height="320" rx="10"/>
  <text class="label code" x="334" y="40">starfleet</text>
  <rect class="ok" x="340" y="52" width="230" height="144" rx="8"/>
  <text class="strong" x="356" y="74">Secret <tspan class="code">probe-tls</tspan></text>
  <text class="code" x="356" y="94">kubernetes.io/tls</text>
  <rect class="box" x="356" y="104" width="198" height="32" rx="6"/>
  <text class="code" x="455" y="125" text-anchor="middle">tls.crt</text>
  <rect class="box" x="356" y="146" width="198" height="32" rx="6"/>
  <text class="code" x="455" y="167" text-anchor="middle">tls.key</text>
  <rect class="ok" x="360" y="250" width="190" height="50" rx="8"/>
  <text x="455" y="280" text-anchor="middle">Ingress <tspan class="code">probe</tspan></text>

  <rect class="frame" x="620" y="230" width="200" height="110" rx="10"/>
  <text class="label code" x="634" y="250">outpost</text>
  <rect class="drop" x="640" y="262" width="160" height="50" rx="8"/>
  <text x="720" y="292" text-anchor="middle">an Ingress</text>
</svg>
