apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-030-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - docker.io/library/traefik:v3.6.1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: depot-certificate
    description: Secret depot-tls holds a self-signed certificate valid for about 30 days, with its key
    type: file
    source: validation/validate-depot-certificate.sh
    points: 1
  - name: depot-san
    description: The depot-tls certificate names depot.example.test and www.depot.example.test in its SAN
    type: file
    source: validation/validate-depot-san.sh
    points: 1
  - name: depot-https
    description: Both host names are served over verified HTTPS with the depot-tls certificate
    type: file
    source: validation/validate-depot-https.sh
    points: 1
