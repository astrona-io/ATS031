schema_version: 1
kind: question_bank
id: ats031-030-04
course_id: ATS031
exam_code: CKS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: Ingress With TLS
placement:
  position: after
  reading: sections/section-030/module-04/course-06-summary.md
questions:
- id: ats031-030-04-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Locate the TLS policy of Traefik."
  source_readings:
  - sections/section-030/module-04/course-01-tls-versions-ciphers-and-server-names.md
  prompt: "Where are the minimum TLS version and server name policy set for this Traefik?"
  options:
  - id: a
    text: "In TLS options in the dynamic configuration file."
    explanation: "Correct. The file comes from the ConfigMap `traefik-dynamic`."
  - id: b
    text: "In the Ingress `spec.tls` section."
    explanation: "`spec.tls` names hosts and a Secret only."
  - id: c
    text: "In the TLS Secret."
    explanation: "A Secret holds a certificate and key."
  correct_option: a
  explanation: "TLS options are named sets, and `default` applies to every TLS router."
- id: ats031-030-04-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Prove a minimum version."
  source_readings:
  - sections/section-030/module-04/course-01-tls-versions-ciphers-and-server-names.md
  prompt: "How do you prove that TLS 1.2 is refused?"
  options:
  - id: a
    text: "`openssl s_client -tls1_2` fails with a handshake error."
    explanation: "Correct. The client offers only 1.2, and the server refuses it."
  - id: b
    text: "`kubectl get ingress` shows the version."
    explanation: "The Ingress does not show the policy."
  - id: c
    text: "`curl -k` succeeds."
    explanation: "A success would show that the version is still accepted."
  correct_option: a
  explanation: "Offer one version at a time with `-tls1_2` and `-tls1_3` and read the result."
- id: ats031-030-04-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know what sniStrict does."
  source_readings:
  - sections/section-030/module-04/course-01-tls-versions-ciphers-and-server-names.md
  prompt: "What does `sniStrict: true` do?"
  options:
  - id: a
    text: "It refuses a handshake whose server name matches no certificate."
    explanation: "Correct. No default certificate is served."
  - id: b
    text: "It forces TLS 1.3."
    explanation: "The minimum version is set by `minVersion`."
  - id: c
    text: "It requires a client certificate."
    explanation: "That is `clientAuth`."
  correct_option: a
  explanation: "Strict matching stops Traefik from serving its default certificate for unknown names."
- id: ats031-030-04-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: "Apply a changed ConfigMap."
  source_readings:
  - sections/section-030/module-04/course-01-tls-versions-ciphers-and-server-names.md
  prompt: "After you replace the ConfigMap `traefik-dynamic`, what is the sure way to load it?"
  options:
  - id: a
    text: "Delete the Ingress."
    explanation: "The Ingress does not hold the policy."
  - id: b
    text: "Restart the Deployment and wait for the rollout."
    explanation: "Correct. A restart reads the mounted file fresh."
  - id: c
    text: "Nothing; the change applies at once."
    explanation: "A ConfigMap mount updates late and the reload is not guaranteed."
  correct_option: b
  explanation: "`kubectl rollout restart` plus `rollout status` loads the new file."
- id: ats031-030-04-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Choose the mTLS policy value."
  source_readings:
  - sections/section-030/module-04/course-02-mutual-tls-with-client-certificates.md
  prompt: "Which `clientAuthType` refuses a client with no certificate?"
  options:
  - id: a
    text: "`VerifyClientCertIfGiven`"
    explanation: "This accepts a client with no certificate."
  - id: b
    text: "`RequireAndVerifyClientCert`"
    explanation: "Correct. A certificate is required and checked against the CA."
  - id: c
    text: "`NoClientCert`"
    explanation: "This disables client authentication."
  correct_option: b
  explanation: "Use the strict value for a protected route."
- id: ats031-030-04-q06
  type: single_choice
  difficulty: advanced
  learning_objective: "Test mutual TLS."
  source_readings:
  - sections/section-030/module-04/course-02-mutual-tls-with-client-certificates.md
  prompt: "A request without a client certificate reaches an mTLS route. What do you see?"
  options:
  - id: a
    text: "The application response."
    explanation: "The handshake is refused before the application."
  - id: b
    text: "A failed handshake and a nonzero curl exit status."
    explanation: "Correct. The server refuses the connection."
  - id: c
    text: "A redirect to HTTP."
    explanation: "A redirect needs a completed request."
  correct_option: b
  explanation: "Read the exit status, since the error text differs between TLS versions."
- id: ats031-030-04-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Measure the permissions of the controller."
  source_readings:
  - sections/section-030/module-04/course-03-shrink-the-controller-attack-surface.md
  prompt: "Which command shows whether the Traefik ServiceAccount can list Secrets in all namespaces?"
  options:
  - id: a
    text: "`kubectl auth can-i list secrets --all-namespaces --as=system:serviceaccount:ingress-system:traefik`"
    explanation: "Correct. It asks the API without changing anything."
  - id: b
    text: "`kubectl get secrets -A`"
    explanation: "This shows your own access."
  - id: c
    text: "`kubectl top pod`"
    explanation: "This shows resource use."
  correct_option: a
  explanation: "`auth can-i --as` tests any identity."
- id: ats031-030-04-q08
  type: single_choice
  difficulty: advanced
  learning_objective: "Spot an exposed management port."
  source_readings:
  - sections/section-030/module-04/course-03-shrink-the-controller-attack-surface.md
  prompt: "Which finding on a Traefik Deployment is a security risk?"
  options:
  - id: a
    text: "The argument `--entrypoints.websecure.address=:8443`"
    explanation: "This is the normal HTTPS entrypoint."
  - id: b
    text: "The argument `--api.insecure=true`"
    explanation: "Correct. It opens the API and dashboard without authentication."
  - id: c
    text: "The argument `--log.level=INFO`"
    explanation: "A log level is not a risk."
  correct_option: b
  explanation: "Remove the flag or protect the API with authentication."
- id: ats031-030-04-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Prove a rotation."
  source_readings:
  - sections/section-030/module-04/course-04-rotate-and-replace-certificates.md
  prompt: "How do you prove that a rotated certificate is the one on the wire?"
  options:
  - id: a
    text: "Compare the serial and end date from `openssl s_client` before and after."
    explanation: "Correct. A new serial shows a new certificate."
  - id: b
    text: "Check that the Secret exists."
    explanation: "The Secret can exist while the old certificate is still served."
  - id: c
    text: "Restart the application pods."
    explanation: "The pods do not hold the certificate."
  correct_option: a
  explanation: "Read the serial and the end date from the served certificate."
- id: ats031-030-04-q10
  type: single_choice
  difficulty: advanced
  learning_objective: "Diagnose a missing Secret."
  source_readings:
  - sections/section-030/module-04/course-05-troubleshoot-tls-ingress-failures.md
  prompt: "An Ingress names `one-tls` but only `one-cert` exists. What is the repair?"
  options:
  - id: a
    text: "Delete the Ingress."
    explanation: "This removes the evidence and the route."
  - id: b
    text: "Point the Ingress at `one-cert`, or create `one-tls` from a valid pair."
    explanation: "Correct. The Ingress must name a Secret that exists in its namespace."
  - id: c
    text: "Change the class to `nginx`."
    explanation: "This stops Traefik from serving the Ingress at all."
  correct_option: b
  explanation: "Check the Secret name, the namespace and the pair, then read the controller log."
