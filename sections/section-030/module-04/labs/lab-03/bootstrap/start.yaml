apiVersion: v1
kind: Namespace
metadata:
  name: rotation-training
  labels:
    project: cks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-code
  namespace: rotation-training
data:
  server.py: "from http.server import BaseHTTPRequestHandler, HTTPServer\nimport os\n\
    import socket\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def respond(self,\
    \ send_body):\n        text = \"app=%s pod=%s path=%s host=%s\\n\" % (\n     \
    \       os.getenv(\"APP\", \"web\"),\n            socket.gethostname(),\n    \
    \        self.path,\n            self.headers.get(\"Host\", \"\"),\n        )\n\
    \        data = text.encode()\n        self.send_response(200)\n        self.send_header(\"\
    Content-Type\", \"text/plain\")\n        self.send_header(\"Content-Length\",\
    \ str(len(data)))\n        self.end_headers()\n        if send_body:\n       \
    \     self.wfile.write(data)\n\n    def do_GET(self):\n        self.respond(True)\n\
    \n    def do_HEAD(self):\n        self.respond(False)\n\n\nHTTPServer((\"0.0.0.0\"\
    , 8080), Handler).serve_forever()\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: rotation-training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: APP
          value: probe
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: web-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: rotation-training
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: probe
  namespace: rotation-training
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: probe.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: probe
            port:
              number: 80
  tls:
  - hosts:
    - probe.example.test
    secretName: probe-tls
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: ingress-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
- apiGroups:
  - ''
  resources:
  - services
  - endpoints
  - secrets
  - namespaces
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - ingressclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
subjects:
- kind: ServiceAccount
  name: traefik
  namespace: ingress-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: ingress-system
data:
  dynamic.yaml: "tls:\n  options:\n    default:\n      minVersion: VersionTLS12\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
      - name: traefik
        image: docker.io/library/traefik:v3.6.1
        args:
        - --providers.kubernetesingress=true
        - --providers.kubernetesingress.ingressclass=traefik
        - --providers.file.directory=/etc/traefik/dynamic
        - --providers.file.watch=true
        - --entrypoints.web.address=:8000
        - --entrypoints.websecure.address=:8443
        - --log.level=INFO
        ports:
        - name: web
          containerPort: 8000
        - name: websecure
          containerPort: 8443
        readinessProbe:
          tcpSocket:
            port: web
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: dynamic
          mountPath: /etc/traefik/dynamic
          readOnly: true
      volumes:
      - name: dynamic
        configMap:
          name: traefik-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ingress-system
spec:
  selector:
    app: traefik
  ports:
  - name: web
    port: 80
    targetPort: web
  - name: websecure
    port: 443
    targetPort: websecure
