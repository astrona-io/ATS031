apiVersion: astrona.io/v1
metadata:
  name: ats-031-capstone-030
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - docker.io/library/traefik:v3.6.1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: tls-secrets
    description: probe-tls and scout-tls exist in starfleet as kubernetes.io/tls Secrets
    type: file
    source: validation/validate-tls-secrets.sh
    points: 1
  - name: ingress-routing
    description: Both hosts answer 200 over HTTPS from their own backend and serve only their own certificate
    type: file
    source: validation/validate-ingress-routing.sh
    points: 2
  - name: tls13-minimum
    description: Both hosts serve HTTPS and refuse TLS 1.2
    type: file
    source: validation/validate-tls13-minimum.sh
    points: 1
  - name: http-redirect
    description: Plain HTTP on both hosts redirects to HTTPS on the same host
    type: file
    source: validation/validate-http-redirect.sh
    points: 1
