<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Prefix matching by path elements</title>
  <desc id="desc">A path entry with pathType Prefix and path /api matches the request paths /api and /api/v1, because their first path element is api. It does not match /apiary, because apiary is a different path element.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M250 120 L338 62" marker-end="url(#arrowok)"/>
  <path class="okline" d="M250 130 H338" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M250 140 L338 198" marker-end="url(#arrowbad)"/>

  <rect class="ask" x="30" y="94" width="220" height="72" rx="8"/>
  <text class="code" x="140" y="124" text-anchor="middle">pathType: Prefix</text>
  <text class="code" x="140" y="146" text-anchor="middle">path: /api</text>

  <rect class="ok" x="340" y="38" width="160" height="48" rx="8"/>
  <text class="code" x="420" y="67" text-anchor="middle">/api</text>
  <text class="good strong" x="530" y="60">match</text>
  <text x="530" y="80">path element <tspan class="code">api</tspan></text>

  <rect class="ok" x="340" y="106" width="160" height="48" rx="8"/>
  <text class="code" x="420" y="135" text-anchor="middle">/api/v1</text>
  <text class="good strong" x="530" y="128">match</text>
  <text x="530" y="148">path elements <tspan class="code">api</tspan>, then <tspan class="code">v1</tspan></text>

  <rect class="drop" x="340" y="174" width="160" height="48" rx="8"/>
  <text class="code" x="420" y="203" text-anchor="middle">/apiary</text>
  <text class="bad strong" x="530" y="196">no match</text>
  <text x="530" y="216">path element <tspan class="code">apiary</tspan> is not <tspan class="code">api</tspan></text>
</svg>
