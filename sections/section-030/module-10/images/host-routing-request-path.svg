<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Routing by the Host header</title>
  <desc id="desc">A client request with Host probe.local reaches the traefik pod in ingress-system, matches the rule, and goes to the probe Service on port 80 and then to a probe pod on port 8080 in starfleet. A request with Host other.local matches no rule, and Traefik answers with 404 page not found.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="270" y="30" width="210" height="280" rx="10"/>
  <text class="label" x="284" y="54">Namespace <tspan class="code">ingress-system</tspan></text>
  <rect class="frame" x="510" y="30" width="330" height="190" rx="10"/>
  <text class="label" x="526" y="54">Namespace <tspan class="code">starfleet</tspan></text>

  <path class="okline" d="M120 146 H298" marker-end="url(#arrowok)"/>
  <text class="label code good" x="196" y="136" text-anchor="middle">Host: probe.local</text>
  <path class="dashed" d="M120 178 H298" marker-end="url(#arrowbad)"/>
  <text class="label code bad" x="196" y="198" text-anchor="middle">Host: other.local</text>
  <path class="okline" d="M450 146 H528" marker-end="url(#arrowok)"/>
  <path class="okline" d="M670 162 H698" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M375 194 V238" marker-end="url(#arrowbad)"/>

  <rect class="box" x="10" y="130" width="110" height="64" rx="8"/>
  <text x="65" y="156" text-anchor="middle">client</text>
  <text class="code" x="65" y="178" text-anchor="middle">curl</text>

  <rect class="ask" x="300" y="130" width="150" height="64" rx="8"/>
  <text x="375" y="156" text-anchor="middle"><tspan class="code">traefik</tspan> pod</text>
  <text x="375" y="178" text-anchor="middle">rule: host, path</text>

  <rect class="box" x="530" y="130" width="140" height="64" rx="8"/>
  <text x="600" y="156" text-anchor="middle">Service <tspan class="code">probe</tspan></text>
  <text x="600" y="178" text-anchor="middle">port 80</text>

  <rect class="ok" x="700" y="130" width="120" height="64" rx="8"/>
  <text x="760" y="156" text-anchor="middle"><tspan class="code">probe</tspan> pod</text>
  <text x="760" y="178" text-anchor="middle">port 8080</text>

  <rect class="drop" x="290" y="240" width="170" height="56" rx="8"/>
  <text x="375" y="262" text-anchor="middle">no rule matches</text>
  <text class="code" x="375" y="284" text-anchor="middle">404 page not found</text>
</svg>
