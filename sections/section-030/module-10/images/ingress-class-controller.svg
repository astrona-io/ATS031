<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">The Ingress, the IngressClass and the Ingress controller</title>
  <desc id="desc">The Kubernetes API server stores the Ingress probe-http, which selects the IngressClass traefik with ingressClassName. The traefik pod in the ingress-system namespace watches these objects and builds its own routing configuration from them.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="390" height="230" rx="10"/>
  <text class="label" x="46" y="54">Kubernetes API server: stores objects</text>
  <rect class="frame" x="480" y="30" width="330" height="230" rx="10"/>
  <text class="label" x="496" y="54">Namespace <tspan class="code">ingress-system</tspan></text>

  <path class="line" d="M510 110 H402" marker-end="url(#arrow)"/>
  <text class="label" x="450" y="100" text-anchor="middle">watches</text>
  <path class="line" d="M225 144 V178" marker-end="url(#arrow)"/>
  <text class="label" x="236" y="166">selects</text>
  <path class="line" d="M645 144 V178" marker-end="url(#arrow)"/>
  <text class="label" x="656" y="166">builds</text>

  <rect class="box" x="50" y="78" width="350" height="64" rx="8"/>
  <text x="225" y="104" text-anchor="middle">Ingress <tspan class="code">probe-http</tspan></text>
  <text class="code" x="225" y="126" text-anchor="middle">ingressClassName: traefik</text>

  <rect class="box" x="50" y="180" width="350" height="64" rx="8"/>
  <text x="225" y="206" text-anchor="middle">IngressClass <tspan class="code">traefik</tspan></text>
  <text class="code" x="225" y="228" text-anchor="middle">controller: traefik.io/ingress-controller</text>

  <rect class="ok" x="510" y="78" width="270" height="64" rx="8"/>
  <text x="645" y="104" text-anchor="middle"><tspan class="code">traefik</tspan> pod</text>
  <text x="645" y="126" text-anchor="middle">Ingress controller</text>

  <rect class="box" x="510" y="180" width="270" height="64" rx="8"/>
  <text x="645" y="206" text-anchor="middle">own routing configuration</text>
  <text class="code" x="645" y="228" text-anchor="middle">probe.local, path /</text>
</svg>
