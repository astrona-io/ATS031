<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">The three checks a client makes on a certificate</title>
  <desc id="desc">The client checks the certificate chain against a trusted certificate authority, checks that the host name is in the Subject Alternative Names, and checks that the current time is inside the validity period. The connection is accepted only when all three checks pass; one failed check ends the connection.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 140 L298 64" marker-end="url(#arrow)"/>
  <path class="line" d="M200 150 H298" marker-end="url(#arrow)"/>
  <path class="line" d="M200 160 L298 236" marker-end="url(#arrow)"/>
  <path class="okline" d="M540 64 L618 140" marker-end="url(#arrowok)"/>
  <path class="okline" d="M540 150 H618" marker-end="url(#arrowok)"/>
  <path class="okline" d="M540 236 L618 160" marker-end="url(#arrowok)"/>

  <rect class="box" x="30" y="110" width="170" height="80" rx="8"/>
  <text x="115" y="144" text-anchor="middle">certificate</text>
  <text x="115" y="166" text-anchor="middle">sent by the server</text>

  <rect class="ask" x="300" y="34" width="240" height="60" rx="8"/>
  <text class="strong" x="420" y="58" text-anchor="middle">1. Chain</text>
  <text x="420" y="80" text-anchor="middle">signed by a trusted CA</text>

  <rect class="ask" x="300" y="120" width="240" height="60" rx="8"/>
  <text class="strong" x="420" y="144" text-anchor="middle">2. Name</text>
  <text x="420" y="166" text-anchor="middle">host name is in the SAN</text>

  <rect class="ask" x="300" y="206" width="240" height="60" rx="8"/>
  <text class="strong" x="420" y="230" text-anchor="middle">3. Validity</text>
  <text x="420" y="252" text-anchor="middle">now is inside the dates</text>

  <rect class="ok" x="620" y="110" width="190" height="80" rx="8"/>
  <text x="715" y="144" text-anchor="middle">connection accepted</text>
  <text x="715" y="166" text-anchor="middle">only if all three pass</text>
  <text class="label bad" x="715" y="228" text-anchor="middle">One failed check</text>
  <text class="label bad" x="715" y="246" text-anchor="middle">ends the connection.</text>
</svg>
