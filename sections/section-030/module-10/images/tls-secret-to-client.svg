<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-labelledby="title desc">
  <title id="title">From key files to the certificate a client checks</title>
  <desc id="desc">The files scout.key and scout.crt go into the Secret scout-tls in starfleet. The Ingress names the Secret in secretName. The traefik pod in ingress-system watches the Ingress, reads the key pair from the Secret and serves the certificate. The client checks the chain, the name and the dates.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="180" y="20" width="470" height="130" rx="10"/>
  <text class="label" x="196" y="42">Namespace <tspan class="code">starfleet</tspan></text>
  <rect class="frame" x="420" y="168" width="230" height="126" rx="10"/>
  <text class="label" x="436" y="284">Namespace <tspan class="code">ingress-system</tspan></text>

  <path class="line" d="M140 52 L198 86" marker-end="url(#arrow)"/>
  <path class="line" d="M140 122 L198 106" marker-end="url(#arrow)"/>
  <path class="line" d="M430 94 H352" marker-end="url(#arrow)"/>
  <text class="label" x="391" y="84" text-anchor="middle">names</text>
  <path class="line" d="M275 126 V214 H438" marker-end="url(#arrow)"/>
  <text class="label" x="345" y="204" text-anchor="middle">reads key pair</text>
  <path class="line" d="M540 126 V180" marker-end="url(#arrow)"/>
  <text class="label" x="550" y="163">watches</text>
  <path class="okline" d="M630 214 H678" marker-end="url(#arrowok)"/>

  <rect class="box" x="20" y="30" width="120" height="44" rx="8"/>
  <text class="code" x="80" y="57" text-anchor="middle">scout.key</text>
  <rect class="box" x="20" y="100" width="120" height="44" rx="8"/>
  <text class="code" x="80" y="127" text-anchor="middle">scout.crt</text>

  <rect class="box" x="200" y="62" width="150" height="64" rx="8"/>
  <text x="275" y="88" text-anchor="middle">Secret</text>
  <text class="code" x="275" y="110" text-anchor="middle">scout-tls</text>

  <rect class="box" x="430" y="62" width="200" height="64" rx="8"/>
  <text x="530" y="88" text-anchor="middle">Ingress</text>
  <text class="code" x="530" y="110" text-anchor="middle">secretName: scout-tls</text>

  <rect class="ok" x="440" y="182" width="190" height="64" rx="8"/>
  <text x="535" y="208" text-anchor="middle"><tspan class="code">traefik</tspan> pod</text>
  <text x="535" y="230" text-anchor="middle">serves the certificate</text>

  <rect class="ask" x="680" y="182" width="170" height="64" rx="8"/>
  <text x="765" y="208" text-anchor="middle">client checks</text>
  <text x="765" y="230" text-anchor="middle">chain, name, dates</text>
</svg>
