<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Where TLS ends</title>
  <desc id="desc">The client and the traefik pod exchange the TLS handshake with the server name probe.local, and the HTTP request and response travel encrypted. Traefik ends TLS with the certificate from probe-tls and sends a plain HTTP request to the probe pod inside the cluster network.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="306" y="30" width="514" height="220" rx="10"/>
  <text class="label" x="322" y="54">Cluster network</text>

  <path class="okline" d="M172 140 H328" marker-start="url(#arrowok)" marker-end="url(#arrowok)"/>
  <text class="label good" x="236" y="128" text-anchor="middle">encrypted (TLS)</text>
  <text class="label" x="236" y="162" text-anchor="middle">server name</text>
  <text class="label code" x="236" y="180" text-anchor="middle">probe.local</text>
  <path class="line" d="M492 140 H638" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="565" y="128" text-anchor="middle">plain HTTP</text>
  <text class="label" x="565" y="162" text-anchor="middle">not encrypted</text>

  <rect class="box" x="30" y="108" width="140" height="64" rx="8"/>
  <text x="100" y="135" text-anchor="middle">client</text>
  <text class="code" x="100" y="156" text-anchor="middle">curl</text>

  <rect class="ask" x="330" y="108" width="160" height="64" rx="8"/>
  <text x="410" y="134" text-anchor="middle"><tspan class="code">traefik</tspan> pod</text>
  <text x="410" y="156" text-anchor="middle">TLS ends here</text>
  <text class="label" x="410" y="196" text-anchor="middle">certificate from</text>
  <text class="label code" x="410" y="214" text-anchor="middle">probe-tls</text>

  <rect class="box" x="640" y="108" width="150" height="64" rx="8"/>
  <text x="715" y="134" text-anchor="middle"><tspan class="code">probe</tspan> pod</text>
  <text x="715" y="156" text-anchor="middle">port 8080</text>
</svg>
