<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Certificate selection by SNI</title>
  <desc id="desc">Three connections go to the same address 127.0.0.1:8443 with different SNI names. For probe.local the traefik pod serves the certificate from probe-tls, for scout.local the certificate from scout-tls, and for unknown.local, which no tls entry lists, its own default certificate, which no client trusts.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M220 59 L318 125" marker-end="url(#arrow)"/>
  <path class="line" d="M220 145 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M220 231 L318 165" marker-end="url(#arrow)"/>
  <path class="okline" d="M500 125 L598 59" marker-end="url(#arrowok)"/>
  <path class="okline" d="M500 145 H598" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M500 165 L598 231" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="35" width="200" height="48" rx="8"/>
  <text class="code" x="120" y="64" text-anchor="middle">SNI: probe.local</text>
  <rect class="box" x="20" y="121" width="200" height="48" rx="8"/>
  <text class="code" x="120" y="150" text-anchor="middle">SNI: scout.local</text>
  <rect class="box" x="20" y="207" width="200" height="48" rx="8"/>
  <text class="code" x="120" y="236" text-anchor="middle">SNI: unknown.local</text>

  <rect class="ask" x="320" y="95" width="180" height="100" rx="8"/>
  <text x="410" y="124" text-anchor="middle"><tspan class="code">traefik</tspan> pod</text>
  <text class="code" x="410" y="146" text-anchor="middle">127.0.0.1:8443</text>
  <text x="410" y="170" text-anchor="middle">picks by SNI</text>

  <rect class="ok" x="600" y="31" width="240" height="56" rx="8"/>
  <text x="720" y="54" text-anchor="middle">certificate from <tspan class="code">probe-tls</tspan></text>
  <text x="720" y="75" text-anchor="middle">subject <tspan class="code">probe.local</tspan></text>
  <rect class="ok" x="600" y="117" width="240" height="56" rx="8"/>
  <text x="720" y="140" text-anchor="middle">certificate from <tspan class="code">scout-tls</tspan></text>
  <text x="720" y="161" text-anchor="middle">subject <tspan class="code">scout.local</tspan></text>
  <rect class="drop" x="600" y="203" width="240" height="56" rx="8"/>
  <text x="720" y="226" text-anchor="middle">Traefik default certificate</text>
  <text x="720" y="247" text-anchor="middle">no client trusts it</text>
</svg>
