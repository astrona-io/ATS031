apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  namespace: starfleet-031-030-01-02
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: relay.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: relay
            port:
              number: 80
