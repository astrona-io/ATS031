<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">The Host header chooses the route</title>
  <desc id="desc">curl connects to 127.0.0.1 port 8080. The port forward carries the request to the traefik Service on port 80, and the Service sends it to the Traefik router. A request with Host probe.local goes to a probe pod. A request with Host other.local matches no router and gets 404 page not found from Traefik.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M160 160 H198" marker-end="url(#arrow)"/>
  <path class="line" d="M380 160 H418" marker-end="url(#arrow)"/>
  <path class="line" d="M570 160 H618" marker-end="url(#arrow)"/>
  <path class="okline" d="M715 132 V86" marker-end="url(#arrowok)"/>
  <text class="label good code" x="705" y="114" text-anchor="end">Host: probe.local</text>
  <path class="dashed" d="M715 188 V234" marker-end="url(#arrowbad)"/>
  <text class="label bad code" x="705" y="216" text-anchor="end">Host: other.local</text>

  <rect class="box" x="30" y="132" width="130" height="56" rx="8"/>
  <text x="95" y="156" text-anchor="middle"><tspan class="code">curl</tspan></text>
  <text class="label" x="95" y="176" text-anchor="middle">your machine</text>
  <rect class="box" x="200" y="132" width="180" height="56" rx="8"/>
  <text x="290" y="156" text-anchor="middle">port forward</text>
  <text class="label code" x="290" y="176" text-anchor="middle">127.0.0.1:8080</text>
  <rect class="box" x="420" y="132" width="150" height="56" rx="8"/>
  <text x="495" y="156" text-anchor="middle">Service <tspan class="code">traefik</tspan></text>
  <text class="label" x="495" y="176" text-anchor="middle">port 80</text>
  <rect class="ask" x="620" y="132" width="190" height="56" rx="8"/>
  <text x="715" y="156" text-anchor="middle">Traefik router</text>
  <text class="label" x="715" y="176" text-anchor="middle">compares the Host header</text>

  <rect class="ok" x="620" y="30" width="190" height="56" rx="8"/>
  <text x="715" y="54" text-anchor="middle"><tspan class="code">probe</tspan> pod</text>
  <text class="label code" x="715" y="74" text-anchor="middle">app=probe ...</text>
  <rect class="drop" x="620" y="236" width="190" height="56" rx="8"/>
  <text x="715" y="260" text-anchor="middle">Traefik answers</text>
  <text class="label code" x="715" y="280" text-anchor="middle">404 page not found</text>
</svg>
