apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: depot
  namespace: starfleet-031-030-02-03
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: depot.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: depot
            port:
              number: 80
