<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Traefik building blocks</title>
  <desc id="desc">The Ingress provider reads Ingress, Service and Secret objects from the Kubernetes API and builds a router. A client request enters Traefik on the entrypoint web. The router matches the host and the path, and the Traefik service sends the request to a pod address.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M180 68 H228" marker-end="url(#arrow)"/>
  <path class="line" d="M380 68 H515 V123" marker-end="url(#arrow)"/>
  <text class="label" x="450" y="58" text-anchor="middle">builds</text>
  <path class="okline" d="M180 258 H228" marker-end="url(#arrowok)"/>
  <path class="okline" d="M380 258 H515 V183" marker-end="url(#arrowok)"/>
  <text class="label good" x="450" y="248" text-anchor="middle">request</text>
  <path class="okline" d="M590 153 H658" marker-end="url(#arrowok)"/>
  <text class="label good" x="624" y="143" text-anchor="middle">match</text>
  <path class="okline" d="M735 181 V228" marker-end="url(#arrowok)"/>
  <text class="label good" x="745" y="210">pod address</text>

  <rect class="box" x="30" y="40" width="150" height="56" rx="8"/>
  <text x="105" y="73" text-anchor="middle">Kubernetes API</text>
  <rect class="ask" x="230" y="40" width="150" height="56" rx="8"/>
  <text x="305" y="64" text-anchor="middle">Ingress provider</text>
  <text class="label" x="305" y="84" text-anchor="middle">reads the objects</text>

  <rect class="box" x="30" y="230" width="150" height="56" rx="8"/>
  <text x="105" y="263" text-anchor="middle">client</text>
  <rect class="box" x="230" y="230" width="150" height="56" rx="8"/>
  <text x="305" y="254" text-anchor="middle">entrypoint <tspan class="code">web</tspan></text>
  <text class="label" x="305" y="274" text-anchor="middle">HTTP port</text>

  <rect class="ok" x="440" y="125" width="150" height="56" rx="8"/>
  <text x="515" y="149" text-anchor="middle">router</text>
  <text class="label" x="515" y="169" text-anchor="middle">host and path rule</text>
  <rect class="ok" x="660" y="125" width="150" height="56" rx="8"/>
  <text x="735" y="149" text-anchor="middle">Traefik service</text>
  <text class="label" x="735" y="169" text-anchor="middle">pod addresses</text>
  <rect class="box" x="660" y="230" width="150" height="56" rx="8"/>
  <text x="735" y="263" text-anchor="middle">pod</text>
</svg>
