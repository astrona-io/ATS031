<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Three answers to one request</title>
  <desc id="desc">First case: a router matches and a pod is ready, so the pod answers. Second case: no router matches, so Traefik answers itself with 404 page not found. Third case: a router matches but the backend has no ready pod, so Traefik answers with an error, usually 503.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="30" y1="140" x2="810" y2="140"/>
  <line class="sep" x1="30" y1="270" x2="810" y2="270"/>

  <text class="strong" x="30" y="38">Router matches, pod ready</text>
  <path class="okline" d="M130 78 H198" marker-end="url(#arrowok)"/>
  <path class="okline" d="M360 78 H428" marker-end="url(#arrowok)"/>
  <rect class="box" x="30" y="56" width="100" height="44" rx="8"/>
  <text x="80" y="83" text-anchor="middle">client</text>
  <rect class="ok" x="200" y="56" width="160" height="44" rx="8"/>
  <text x="280" y="83" text-anchor="middle">Traefik router</text>
  <rect class="ok" x="430" y="56" width="120" height="44" rx="8"/>
  <text x="490" y="83" text-anchor="middle">pod</text>
  <text x="580" y="72">The pod answers.</text>
  <text x="580" y="94">Traefik passes the answer back.</text>

  <text class="strong" x="30" y="168">No router matches</text>
  <path class="line" d="M130 200 H198" marker-end="url(#arrow)"/>
  <path class="dashed" d="M200 216 H132" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="165" y="246" text-anchor="middle">404</text>
  <rect class="box" x="30" y="186" width="100" height="44" rx="8"/>
  <text x="80" y="213" text-anchor="middle">client</text>
  <rect class="drop" x="200" y="186" width="160" height="44" rx="8"/>
  <text x="280" y="213" text-anchor="middle">Traefik, no router</text>
  <rect class="box" x="430" y="186" width="120" height="44" rx="8" opacity="0.45"/>
  <text x="490" y="213" text-anchor="middle" opacity="0.45">pod</text>
  <text x="580" y="202">Traefik answers itself with</text>
  <text x="580" y="224"><tspan class="code">404 page not found</tspan>.</text>

  <text class="strong" x="30" y="298">Router matches, no ready pod</text>
  <path class="line" d="M130 330 H198" marker-end="url(#arrow)"/>
  <path class="dashed" d="M200 346 H132" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="165" y="376" text-anchor="middle">503</text>
  <path class="dashed" d="M360 338 H428" marker-end="url(#arrowbad)"/>
  <rect class="box" x="30" y="316" width="100" height="44" rx="8"/>
  <text x="80" y="343" text-anchor="middle">client</text>
  <rect class="ask" x="200" y="316" width="160" height="44" rx="8"/>
  <text x="280" y="343" text-anchor="middle">Traefik router</text>
  <rect class="drop" x="430" y="316" width="120" height="44" rx="8"/>
  <text x="490" y="343" text-anchor="middle">no ready pod</text>
  <text x="580" y="332">Traefik answers with an error,</text>
  <text x="580" y="354">usually <tspan class="code">503</tspan>.</text>
</svg>
