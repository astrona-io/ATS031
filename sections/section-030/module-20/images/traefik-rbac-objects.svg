<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Traefik installation objects and permissions</title>
  <desc id="desc">The IngressClass traefik names the controller that the Deployment traefik runs. The Deployment runs as the ServiceAccount traefik. The ClusterRoleBinding gives that account the ClusterRole traefik, which allows get, list and watch on Ingresses, Services, EndpointSlices and Secrets in all namespaces.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M145 80 V118" marker-end="url(#arrow)"/>
  <text class="label" x="160" y="104">names the controller</text>
  <path class="line" d="M145 170 V208" marker-end="url(#arrow)"/>
  <text class="label code" x="160" y="194">serviceAccountName</text>
  <path class="line" d="M145 260 V298" marker-end="url(#arrow)"/>
  <text class="label" x="160" y="284">ClusterRoleBinding</text>
  <path class="line" d="M260 325 H448" marker-end="url(#arrow)"/>
  <text class="label code" x="354" y="315" text-anchor="middle">get, list, watch</text>

  <rect class="ask" x="30" y="30" width="230" height="50" rx="8"/>
  <text x="145" y="60" text-anchor="middle">IngressClass <tspan class="code">traefik</tspan></text>
  <rect class="box" x="30" y="120" width="230" height="50" rx="8"/>
  <text x="145" y="150" text-anchor="middle">Deployment <tspan class="code">traefik</tspan></text>
  <rect class="box" x="30" y="210" width="230" height="50" rx="8"/>
  <text x="145" y="240" text-anchor="middle">ServiceAccount <tspan class="code">traefik</tspan></text>
  <rect class="box" x="30" y="300" width="230" height="50" rx="8"/>
  <text x="145" y="330" text-anchor="middle">ClusterRole <tspan class="code">traefik</tspan></text>

  <rect class="frame" x="450" y="190" width="360" height="170" rx="10"/>
  <text class="label" x="466" y="214">read access, all namespaces, no write verbs</text>
  <rect class="ok" x="470" y="232" width="155" height="44" rx="8"/>
  <text x="547" y="259" text-anchor="middle">Ingresses</text>
  <rect class="ok" x="640" y="232" width="155" height="44" rx="8"/>
  <text x="717" y="259" text-anchor="middle">Services</text>
  <rect class="ok" x="470" y="296" width="155" height="44" rx="8"/>
  <text x="547" y="323" text-anchor="middle">EndpointSlices</text>
  <rect class="drop" x="640" y="296" width="155" height="44" rx="8"/>
  <text x="717" y="323" text-anchor="middle">Secrets</text>
</svg>
