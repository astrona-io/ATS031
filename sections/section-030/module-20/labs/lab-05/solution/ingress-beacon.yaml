apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beacon
  namespace: starfleet-031-030-02-05
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: beacon.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beacon
            port:
              name: http
