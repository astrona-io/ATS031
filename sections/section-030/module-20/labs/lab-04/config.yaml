apiVersion: astrona.io/v1
metadata:
  name: ats-031-lab-030-02-04
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    - docker.io/library/traefik:v3.6.1
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: api-ingress
    description: Ingress api of class traefik uses the web entrypoint and has exactly the Exact path /healthz and the Prefix path /v1 of api.local
    type: file
    source: validation/validate-api-ingress.sh
    points: 1
  - name: exact-path
    description: api.local/healthz reaches beacon, and api.local/healthz/deep gets 404
    type: file
    source: validation/validate-exact-path.sh
    points: 1
  - name: prefix-path
    description: api.local/v1 and every path below it reach scout, while /v2 and / get 404
    type: file
    source: validation/validate-prefix-path.sh
    points: 1
